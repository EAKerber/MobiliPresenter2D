name: Development bounded branch hygiene — dry safety contracts

on:
  push:
    branches: [development]
    paths:
      - 'tools/development_retirement_batch.py'
      - 'tests/test_development_retirement_batch.py'
      - '.github/workflows/development-hygiene-safety.yml'
      - 'docs/handoffs/ARCHITECTURE_CHECKPOINT_2026-10-23_ARCHIVED.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and verify deny-by-default selection (no deletes)
        run: |
          python3 -m py_compile tools/development_retirement_batch.py
          python3 -m unittest tests/test_development_retirement_batch.py
      - name: Confirm durable archival checkpoint is retained
        run: |
          test -s docs/handoffs/ARCHITECTURE_CHECKPOINT_2026-10-23_ARCHIVED.md
          grep -q 'BEGIN-ARCHIVED-20261023-EXACT-26-LINES' docs/handoffs/ARCHITECTURE_CHECKPOINT_2026-10-23_ARCHIVED.md
