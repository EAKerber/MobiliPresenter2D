name: Development test impact plan (advisory)

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/build-workflow-inventory.mjs'
  pull_request:
    branches: [development]
    paths:
      - 'app/**'
      - 'architecture/**'
      - 'netlify/**'
      - 'reference/**'
      - 'review-assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate impact map, inventory evidence and historical path cases
        run: node --test tests/ci/test-impact-selector.test.mjs tests/ci/workflow-inventory.test.mjs
      - name: Report affected contract bundles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/select-test-bundles.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  inventory:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact inventory refs and open PRs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          development_sha="$GITHUB_SHA"
          candidate_sha=""
          candidate_tree=""
          candidate_pr_number=""
          candidate_is_draft=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            development_sha="$BASE_SHA"
            candidate_sha="$HEAD_SHA"
            candidate_pr_number="$PR_NUMBER"
            candidate_is_draft="$PR_DRAFT"
            candidate_tree="$(git rev-parse "${candidate_sha}^{tree}")"
          fi
          git cat-file -e "$main_sha^{commit}"
          git cat-file -e "$development_sha^{commit}"
          development_tree="$(git rev-parse "${development_sha}^{tree}")"
          mkdir -p artifacts
          gh pr list --state open --limit 1000 --json number,url,headRefName,headRefOid,baseRefName,baseRefOid,isDraft > artifacts/open-prs.json
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "development_sha=$development_sha" >> "$GITHUB_OUTPUT"
          echo "development_tree=$development_tree" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$candidate_tree" >> "$GITHUB_OUTPUT"
          echo "candidate_pr_number=$candidate_pr_number" >> "$GITHUB_OUTPUT"
          echo "candidate_is_draft=$candidate_is_draft" >> "$GITHUB_OUTPUT"
      - name: Generate SHA-pinned workflow inventory
        run: |
          inventory_args=(
            --main-sha "${{ steps.refs.outputs.main_sha }}"
            --development-sha "${{ steps.refs.outputs.development_sha }}"
            --development-tree "${{ steps.refs.outputs.development_tree }}"
            --open-prs-json "$(cat artifacts/open-prs.json)"
            --output artifacts/tst-001-workflow-inventory.json
          )
          candidate_sha="${{ steps.refs.outputs.candidate_sha }}"
          if [ -n "$candidate_sha" ]; then
            inventory_args+=(
              --candidate-head-sha "$candidate_sha"
              --candidate-tree "${{ steps.refs.outputs.candidate_tree }}"
              --candidate-pr-number "${{ steps.refs.outputs.candidate_pr_number }}"
              --candidate-is-draft "${{ steps.refs.outputs.candidate_is_draft }}"
            )
          fi
          node tools/ci/build-workflow-inventory.mjs "${inventory_args[@]}"
      - name: Emit exact inventory JSON for readback
        run: |
          echo 'BEGIN_TST001_INVENTORY_JSON'
          cat artifacts/tst-001-workflow-inventory.json
          echo 'END_TST001_INVENTORY_JSON'
      - uses: actions/upload-artifact@v4
        with:
          name: tst-001-workflow-inventory-${{ github.event_name }}-${{ github.run_id }}-${{ steps.refs.outputs.development_sha }}
          path: artifacts/tst-001-workflow-inventory.json
          retention-days: 30
