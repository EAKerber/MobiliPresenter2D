name: Development test impact plan (advisory)

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/**'
      - 'tools/ci/build-workflow-inventory.mjs'
  workflow_dispatch:
    inputs:
      main_sha:
        description: Exact main commit to inventory
        required: true
      development_sha:
        description: Exact development commit to inventory
        required: true
  pull_request:
    branches: [development]
    paths:
      - 'app/**'
      - 'architecture/**'
      - 'netlify/**'
      - 'reference/**'
      - 'review-assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate impact map, inventory evidence and historical path cases
        run: node --test tests/ci/test-impact-selector.test.mjs tests/ci/workflow-inventory.test.mjs
      - name: Report affected contract bundles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/select-test-bundles.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

  inventory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.development_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture open PRs for exact inventory refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh pr list --state open --limit 1000 --json number,url,headRefName,headRefOid,baseRefName,baseRefOid > artifacts/open-prs.json
      - name: Generate SHA-pinned workflow inventory
        env:
          MAIN_SHA: ${{ inputs.main_sha }}
          DEVELOPMENT_SHA: ${{ inputs.development_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DEVELOPMENT_SHA"
          node tools/ci/build-workflow-inventory.mjs \
            --main-sha "$MAIN_SHA" \
            --development-pin "$DEVELOPMENT_SHA" \
            --development-tree "$(git rev-parse 'HEAD^{tree}')" \
            --open-prs-json "$(cat artifacts/open-prs.json)" \
            --output artifacts/tst-001-workflow-inventory.json
      - name: Emit exact inventory JSON for readback
        run: |
          echo 'BEGIN_TST001_INVENTORY_JSON'
          cat artifacts/tst-001-workflow-inventory.json
          echo 'END_TST001_INVENTORY_JSON'
      - uses: actions/upload-artifact@v4
        with:
          name: tst-001-workflow-inventory-${{ inputs.development_sha }}
          path: artifacts/tst-001-workflow-inventory.json
          retention-days: 30

  inventory_on_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture exact inventory refs and open PRs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          development_sha="$(git rev-parse HEAD)"
          test "$development_sha" = "$GITHUB_SHA"
          development_tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p artifacts
          gh pr list --state open --limit 1000 --json number,url,headRefName,headRefOid,baseRefName,baseRefOid > artifacts/open-prs.json
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "development_sha=$development_sha" >> "$GITHUB_OUTPUT"
          echo "development_tree=$development_tree" >> "$GITHUB_OUTPUT"
      - name: Generate SHA-pinned workflow inventory
        run: |
          node tools/ci/build-workflow-inventory.mjs \
            --main-sha "${{ steps.refs.outputs.main_sha }}" \
            --development-pin "${{ steps.refs.outputs.development_sha }}" \
            --development-tree "${{ steps.refs.outputs.development_tree }}" \
            --open-prs-json "$(cat artifacts/open-prs.json)" \
            --output artifacts/tst-001-workflow-inventory.json
      - name: Emit exact inventory JSON for readback
        run: |
          echo 'BEGIN_TST001_INVENTORY_JSON'
          cat artifacts/tst-001-workflow-inventory.json
          echo 'END_TST001_INVENTORY_JSON'
      - uses: actions/upload-artifact@v4
        with:
          name: tst-001-workflow-inventory-${{ github.sha }}
          path: artifacts/tst-001-workflow-inventory.json
          retention-days: 30
