name: Research stone acceptance lineage diagnosis temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-reconstruction-checkpoint-temp.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Reconstruct historically accepted plinth masks
        run: |
          python - <<'PY'
          import copy, hashlib, json, tempfile
          from pathlib import Path
          from tools.build_stone_surface_masks import build
          root=Path(".")
          cfg=json.loads((root/"review-assets/stone-masks/config.json").read_text())
          accepted=json.loads((root/"review-assets/stone-cleanplate/accepted-surfaces.json").read_text())
          old=copy.deepcopy(cfg)
          old["groups"]["stone-02"]["surfaces"]["plinth"]=[[503,858],[744,858],[744,893],[503,893]]
          old["groups"]["stone-03"]["surfaces"]["plinth"]=[[744,858],[1203,858],[1203,893],[744,893]]
          with tempfile.TemporaryDirectory() as td:
              out=Path(td)
              report=build(old,root,out)
              rows=[]
              for asset in ("stone-02-exposed","stone-03-exposed"):
                  p=out/f"{asset}-plinth.png"
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  key=f"review-assets/stone-masks/generated/{asset}-plinth.png"
                  rows.append({
                    "asset":asset,
                    "reconstructedHistoricalSha256":digest,
                    "acceptedSha256":accepted["sha256ByPath"][key],
                    "exact":digest==accepted["sha256ByPath"][key],
                  })
              print(json.dumps(rows,indent=2))
              if not all(r["exact"] for r in rows):
                  raise SystemExit("HISTORICAL_ACCEPTANCE_RECONSTRUCTION_MISMATCH")
          PY
      - name: Self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-reconstruction-checkpoint-temp.yml
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "chore: self-clean stone acceptance lineage diagnosis"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
