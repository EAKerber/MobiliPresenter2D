name: Development CI old auth and PR238 lineage (offline provenance)
on:
  push:
    branches:
      - development
      - integration/33-ci-auth-pr238-lineage-20261028
    paths:
      - 'docs/work/DEVELOPMENT_CI_AUTH_LINEAGE_PR238_2026-10-28.md'
      - 'tests/test_development_ci_auth_lineage.py'
      - '.github/workflows/development-ci-auth-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original Git blobs and security-boundary differences
        run: python3 -m unittest discover -s tests -p test_development_ci_auth_lineage.py -v
      - name: Revalidate pure preview identity rejection, without network
        run: |
          node --check tests/ci/preview-identity-attestation.mjs
          node --test tests/ci/preview-identity-attestation.test.mjs
