name: R4 module 02 materialize

on:
  push:
    branches:
      - work/r4-module02-fidelity
    paths:
      - 'app/tools/apply-r4-module02-fidelity.py'
      - 'tools/materialize-r4-module02.py'
      - '.github/workflows/r4-materialize.yml'

concurrency:
  group: r4-module02-materialize
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[r4-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Materialize bounded R4 checkpoint
        run: python tools/materialize-r4-module02.py
      - name: Commit generated checkpoint
        shell: bash
        env:
          TARGET_BRANCH: work/r4-module02-fidelity
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/assets/kitchen/composicao-completa.png \
            app/assets/kitchen/layers/02_inferior_fogao.png \
            app/assets/kitchen/masks/02.png \
            app/data/mask-data.js \
            app/data/scene-data.js \
            app/data/technical-data.json \
            app/reports/default-composed.png \
            app/reports/module02-alpha-fix-validation.json \
            app/tools/build-inline-masks.py \
            app/tools/validate-assets.py \
            app/tools/masks/module02-alpha-approved-v3.png \
            app/tools/sources/02_inferior_fogao-combined-v3.png \
            reference/baseline-manifest.json \
            reference/r4-module02-fidelity.json
          if git diff --cached --quiet; then
            echo 'R4_MATERIALIZATION_NO_CHANGE readback=PASS'
            exit 0
          fi
          git commit -m 'R4: materialize module 02 fidelity checkpoint [r4-materialized]'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:${remote_before}!=${EXPECTED_HEAD}" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_after" != "$candidate_sha" ]; then
            echo "TARGET_READBACK_FAILED:${remote_after}!=${candidate_sha}" >&2
            exit 2
          fi
          echo "R4_MATERIALIZATION_RECEIPT base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"
