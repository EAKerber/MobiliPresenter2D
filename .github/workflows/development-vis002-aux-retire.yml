name: Development VIS002 one-shot ancestor-auxiliary retirement

on:
  push:
    branches: [development]
    paths:
      - 'tools/development_vis002_aux_retire.py'
      - 'tests/test_development_vis002_aux_retire.py'
      - '.github/workflows/development-vis002-aux-retire.yml'

concurrency:
  group: m2d-vis002-aux-retire
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative tests
        run: |
          python -m unittest discover -s tests -p 'test_development_vis002_aux_retire.py' -v
          python -m py_compile tools/development_vis002_aux_retire.py
      - name: Read-only audit; pinned complete historical inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/development_vis002_aux_retire.py --mode audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vis002-aux-audit-${{ github.run_id }}
          path: vis002-aux-retire-receipt.json
          if-no-files-found: warn

  apply:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeat negative tests
        run: python -m unittest discover -s tests -p 'test_development_vis002_aux_retire.py' -v
      - name: Retire only VIS002 proven ancestor with SHA lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/development_vis002_aux_retire.py --mode apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vis002-aux-apply-${{ github.run_id }}
          path: vis002-aux-retire-receipt.json
          if-no-files-found: warn
