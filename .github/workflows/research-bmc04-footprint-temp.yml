name: Research BMC04 footprint temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc04-footprint-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run footprint projection probe
        run: |
          python -m py_compile tools/research_project_rect_on_host_quad.py tools/validate_reconstruction_packet.py
          python -m unittest tests/test_research_project_rect_on_host_quad.py
          python tools/research_project_rect_on_host_quad.py             --config review-assets/research/bmc04-cooktop-footprint-v0.1.json             --output review-assets/research/bmc04-cooktop-footprint-v0.1-report.json
          python tools/validate_reconstruction_packet.py             review-assets/research/bmc04-cooktop-bounded-generation-v0.1.json
      - name: Commit report and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc04-footprint-temp.yml
          git add review-assets/research/bmc04-cooktop-footprint-v0.1-report.json
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize BMC-04 cooktop footprint"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
