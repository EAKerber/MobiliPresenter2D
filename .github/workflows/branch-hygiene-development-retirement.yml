name: Retire development squash heads (explicit approval only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/branch-hygiene-development-retirement.json'
      - 'tools/branch_hygiene_series.py'
      - 'tests/test_branch_hygiene_series.py'
      - '.github/workflows/branch-hygiene-development-retirement.yml'
  push:
    branches: [main]
    paths:
      - 'ops/branch-hygiene-development-retirement.json'

concurrency:
  group: m2d-development-retirement
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression safety tests
        run: |
          python -m unittest discover -s tests -p 'test_branch_hygiene_*.py'
          python -m py_compile tools/branch_hygiene_series.py
      - name: Audit each exact batch; no deletions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/branch_hygiene_series.py \
            --manifest ops/branch-hygiene-development-retirement.json \
            --receipts /tmp/retirement-audit --audit-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-development-retirement-audit-${{ github.run_id }}
          path: /tmp/retirement-audit/receipt-*.json
          if-no-files-found: warn
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression safety tests
        run: python -m unittest discover -s tests -p 'test_branch_hygiene_*.py'
      - name: Apply waves with full SHA/readback validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILIPRESENTER2D_BRANCH_HYGIENE_AUTHORIZED: '1'
          MOBILIPRESENTER2D_DEVELOPMENT_HYGIENE_AUTHORIZED: '1'
        run: |
          python tools/branch_hygiene_series.py \
            --manifest ops/branch-hygiene-development-retirement.json \
            --receipts /tmp/retirement-apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-development-retirement-${{ github.run_id }}
          path: /tmp/retirement-apply/receipt-*.json
          if-no-files-found: warn
