name: Retire development squash heads (explicit approval only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/branch-hygiene-development-retirement.json'
      - 'tools/branch_hygiene_plan.py'
      - 'tools/branch_hygiene_apply.py'
      - 'tests/test_branch_hygiene_*.py'
      - '.github/workflows/branch-hygiene-development-retirement.yml'
  push:
    branches: [main]
    paths:
      - 'ops/branch-hygiene-development-retirement.json'

concurrency:
  group: m2d-development-retirement
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression safety tests
        run: |
          python -m unittest discover -s tests -p 'test_branch_hygiene_*.py'
          python -m py_compile tools/branch_hygiene_plan.py tools/branch_hygiene_observe.py tools/branch_hygiene_apply.py
      - name: Audit proposed retirement manifest, if present
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if test -f ops/branch-hygiene-development-retirement.json; then
            python tools/branch_hygiene_observe.py --control development --output /tmp/obs.json
            python tools/branch_hygiene_plan.py --observation /tmp/obs.json --dispositions ops/branch-dispositions-development.json --output /tmp/plan.json >/dev/null
            python tools/branch_hygiene_apply.py \
              --plan /tmp/plan.json \
              --dispositions ops/branch-dispositions-development.json \
              --expected-plan "$(python -c 'import json; print(json.load(open("/tmp/plan.json"))["planHash"])')" \
              --batch ops/branch-hygiene-development-retirement.json \
              --receipt /tmp/receipt.json --audit-only
          else
            echo 'No retirement manifest: tool-only PR, no retirement possible'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-dev-retirement-audit-${{ github.run_id }}
          path: /tmp/receipt.json
          if-no-files-found: warn
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression safety tests
        run: python -m unittest discover -s tests -p 'test_branch_hygiene_*.py'
      - name: Execute exact authorized retirement batch with readbacks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILIPRESENTER2D_BRANCH_HYGIENE_AUTHORIZED: '1'
          MOBILIPRESENTER2D_DEVELOPMENT_HYGIENE_AUTHORIZED: '1'
        run: |
          python tools/branch_hygiene_observe.py --control development --output /tmp/obs.json
          python tools/branch_hygiene_plan.py --observation /tmp/obs.json --dispositions ops/branch-dispositions-development.json --output /tmp/plan.json >/dev/null
          python tools/branch_hygiene_apply.py \
            --plan /tmp/plan.json \
            --dispositions ops/branch-dispositions-development.json \
            --expected-plan "$(python -c 'import json; print(json.load(open("/tmp/plan.json"))["planHash"])')" \
            --batch ops/branch-hygiene-development-retirement.json \
            --receipt /tmp/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-dev-retirement-receipt-${{ github.run_id }}
          path: /tmp/receipt.json
          if-no-files-found: warn
