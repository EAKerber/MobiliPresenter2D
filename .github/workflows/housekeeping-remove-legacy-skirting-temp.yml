name: Housekeeping remove legacy skirting painter temp

on:
  push:
    branches: [housekeeping/remove-legacy-skirting-painter]
    paths:
      - '.github/workflows/housekeeping-remove-legacy-skirting-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: housekeeping/remove-legacy-skirting-painter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove inert painter and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, replacement="", flags=0):
              p = Path(path)
              before = p.read_text()
              after, count = re.subn(pattern, replacement, before, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}: {pattern!r}; got {count}")
              p.write_text(after)

          sub_once(
              "app/index.html",
              r'\n\s*<div id="skirtingOverlay02" class="scene-skirting scene-skirting--02" aria-hidden="true"></div>\n\s*<div id="skirtingOverlay03" class="scene-skirting scene-skirting--03" aria-hidden="true"></div>',
              ""
          )
          sub_once(
              "app/app.js",
              r'\n  const skirtingOverlays = \[\n.*?\n  \];\n',
              "\n",
              re.S
          )
          sub_once(
              "app/app.js",
              r'\n  function syncSkirtingAppearance\(\) \{\n.*?\n  \}\n',
              "\n",
              re.S
          )
          sub_once("app/app.js", r'\n    syncSkirtingAppearance\(\);', "")
          sub_once("app/styles.css", r', \.scene-skirting', "")
          sub_once(
              "app/styles.css",
              r'\n\.scene-skirting \{\n.*?\n\.scene-skirting--03 \{[^\n]*\}\n',
              "\n",
              re.S
          )
          sub_once(
              "app/tools/test-core.js",
              r'\nconst skirtingMasks = \{\n.*?\nObject\.entries\(skirtingMasks\)\.forEach\(\(\[name, expectedPath\]\) => \{\n.*?\n\}\);',
              "",
              re.S
          )

          revision = "runtime-v6"
          coordinated = [
              "styles.css",
              "data/scene-data.js",
              "data/catalog-data.js",
              "data/mock-price-book.js",
              "data/mask-data.js",
              "core/state.js",
              "core/visibility.js",
              "core/validation.js",
              "core/fingerprint.js",
              "core/finishes.js",
              "core/pricing.js",
              "data/stone-data.js",
              "core/stone.js",
              "app.js",
          ]
          for asset in coordinated:
              sub_once(
                  "app/index.html",
                  re.escape(asset) + r'\?v=[^\"]+',
                  f"{asset}?v={revision}"
              )
          PY
          rm app/assets/kitchen/masks/skirting-02.svg app/assets/kitchen/masks/skirting-03.svg
      - name: Static contract gate
        run: |
          set -euo pipefail
          if grep -R -n -E 'skirtingOverlay0[23]|syncSkirtingAppearance|scene-skirting|skirting-0[23]\.svg' app; then
            echo 'legacy skirting painter reference survived cleanup' >&2
            exit 1
          fi
          grep -q 'id="stoneSkirtingToggle"' app/index.html
          grep -q 'stone-skirting' app/core/configuration.js
          grep -q 'stone-skirting' app/core/runtime-contracts.js
          grep -q 'globalEntries\["stone-skirting"\]' app/tools/test-core.js
          grep -q 'renderStone(effectiveState, sceneMaterials())' app/app.js
          grep -q 'id="plinthCanvas"' app/index.html
          grep -q 'app.js?v=runtime-v6' app/index.html
          node --check app/app.js
          node app/tools/test-core.js
          node app/tools/test-runtime-contracts.js
      - name: Commit cleanup and self-remove
        env:
          TARGET_BRANCH: housekeeping/remove-legacy-skirting-painter
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/housekeeping-remove-legacy-skirting-temp.yml
          git add app/app.js app/index.html app/styles.css app/tools/test-core.js app/assets/kitchen/masks/skirting-02.svg app/assets/kitchen/masks/skirting-03.svg
          git commit -m 'Remove inert legacy skirting painter'
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          result="$(git rev-parse HEAD)"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
          echo "RESULT_HEAD=$result"
