name: ARC-13 inventory provenance and determinism

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, development]
    paths:
      - 'app/**/*.html'
      - 'app/**/*.js'
      - '!app/tools/test-v5-normal-save.js'
      - 'app/**/*.mjs'
      - 'package.json'
      - 'architecture/pages/**'
      - 'architecture/fragments/primary-header.fragment.html'
      - 'architecture/fragments/primary-header.routes.json'
      - 'architecture/generated/primary-pages.manifest.json'
      - 'architecture/arc13/ui-text-candidates.json'
      - 'docs/architecture/arc13/loc002-ui-control-copy-2026-11-22.json'
      - 'scripts/compile-primary-pages.mjs'
      - 'tools/arc13/package.json'
      - 'tools/arc13/package-lock.json'
      - 'tools/arc13/run-inventory.mjs'
      - 'tools/arc13/scan-js-sinks.mjs'
      - 'tools/arc13/scan-ui-inventory.py'
      - 'tests/arc13_line_ending_normalization_test.py'
      - 'tests/auth-first-login-recovery.test.mjs'
      - 'tests/ui-theme-contract.cjs'
      - 'tests/technical-drawings-copy.test.cjs'
      - '.github/workflows/arc13-inventory-integrity.yml'
  push:
    branches: [main, development]
    paths:
      - 'app/**/*.html'
      - 'app/**/*.js'
      - '!app/tools/test-v5-normal-save.js'
      - 'app/**/*.mjs'
      - 'package.json'
      - 'architecture/pages/**'
      - 'architecture/fragments/primary-header.fragment.html'
      - 'architecture/fragments/primary-header.routes.json'
      - 'architecture/generated/primary-pages.manifest.json'
      - 'architecture/arc13/ui-text-candidates.json'
      - 'docs/architecture/arc13/loc002-ui-control-copy-2026-11-22.json'
      - 'scripts/compile-primary-pages.mjs'
      - 'tools/arc13/package.json'
      - 'tools/arc13/package-lock.json'
      - 'tools/arc13/run-inventory.mjs'
      - 'tools/arc13/scan-js-sinks.mjs'
      - 'tools/arc13/scan-ui-inventory.py'
      - 'tests/arc13_line_ending_normalization_test.py'
      - 'tests/auth-first-login-recovery.test.mjs'
      - 'tests/ui-theme-contract.cjs'
      - 'tests/technical-drawings-copy.test.cjs'
      - '.github/workflows/arc13-inventory-integrity.yml'

permissions:
  contents: read

concurrency:
  group: arc13-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned parser
        run: npm ci --prefix tools/arc13
      - name: Verify source-map normalization and catalog whitespace mapping
        run: python tests/arc13_line_ending_normalization_test.py
      - name: Verify catalog-backed theme and menu labels
        run: node tests/ui-theme-contract.cjs
      - name: Verify shared technical drawing descriptions and fallback
        run: node --test tests/technical-drawings-copy.test.cjs
      - name: Verify primary page compiler output
        run: node scripts/compile-primary-pages.mjs --check
      - name: Confirm the generated report remains tracked
        run: git ls-files --error-unmatch architecture/arc13/ui-text-candidates.json
      - name: Regenerate the candidate inventory
        run: npm run inventory --prefix tools/arc13
      - name: Verify provenance coverage and unreviewed status
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const inventory = JSON.parse(fs.readFileSync('architecture/arc13/ui-text-candidates.json', 'utf8'));
          const summary = inventory.summary;
          assert.equal(inventory.schemaVersion, 4);
          assert.equal(inventory.status, 'candidate-unreviewed');
          assert.equal(summary.javascriptParseErrors, 0, 'JavaScript input must parse without errors');
          assert.equal(inventory.parseErrors.length, 0);
          assert.equal(summary.javascriptNotScannedSources, 0,
            'the normal AST-backed scan must run instead of HTML-only mode');
          assert.equal(summary.unassignedOwnerSites, 0,
            'source-path technical ownership must be assigned');
          assert.equal(summary.unassignedRouteSites, 0,
            'JavaScript sink routes must be assigned');
          assert.equal(summary.primaryPageAuthoringUnresolvedOccurrences, 0);
          assert.equal(summary.unreviewedOccurrences, inventory.entries.length,
            'generated candidates remain unreviewed');
          assert(inventory.entries.every((entry) => entry.classification === 'unreviewed'));
          const bootstrapFailureSources = inventory.sourceEntries.filter((entry) =>
            entry.source === 'app/core/ui-copy.js'
            && entry.sourceRole === 'error-message-source'
            && entry.valuePath?.startsWith('admin.loadState.bootstrapFailures.'));
          assert.deepEqual(
            bootstrapFailureSources.map((entry) => entry.valuePath).sort(),
            ['admin.loadState.bootstrapFailures.forbidden', 'admin.loadState.bootstrapFailures.invalid',
              'admin.loadState.bootstrapFailures.network', 'admin.loadState.bootstrapFailures.unauthorized',
              'admin.loadState.bootstrapFailures.unavailable'].sort(),
            'the five fixed Admin bootstrap messages must be catalogued as bounded UI copy'
          );
          for (const source of bootstrapFailureSources) {
            assert.equal(source.consumerRefs?.length, 1, `${source.valuePath} has one proven Admin sink`);
            assert.equal(source.consumerRefs[0].sink, 'helper:setMessage');
            assert.equal(source.consumerRefs[0].flow, 'bounded-custom-error-to-admin-status');
            assert.deepEqual(source.consumerRefs[0].routeConsumers, ['/admin']);
          }
          const viewerDetailHeadingSources = inventory.sourceEntries.filter((entry) =>
            entry.source === 'app/core/ui-copy.js'
            && entry.sourceRole === 'detail-heading'
            && entry.valuePath?.startsWith('viewer.detailHeadings.'));
          assert.deepEqual(
            viewerDetailHeadingSources.map((entry) => entry.valuePath).sort(),
            ['viewer.detailHeadings.components', 'viewer.detailHeadings.requirements'],
            'the two fixed Viewer detail headings must be catalogued'
          );
          for (const source of viewerDetailHeadingSources) {
            assert.equal(source.consumerRefs?.length, 1, `${source.valuePath} has one proven Viewer sink`);
            assert.equal(source.consumerRefs[0].sink, 'helper:element');
            assert.equal(source.consumerRefs[0].flow, 'bounded-catalog-copy-to-viewer-detail-heading');
            assert.deepEqual(source.consumerRefs[0].routeConsumers, ['/viewer/']);
          }
          const viewerFixedSources = inventory.sourceEntries.filter((entry) =>
            entry.source === 'app/core/ui-copy.js' && entry.sourceRole === 'fixed-viewer-copy');
          assert.equal(viewerFixedSources.length, 19, 'the bounded Viewer copy family must remain inventoried');
          for (const source of viewerFixedSources) {
            assert.equal(source.consumerRefs?.length, 1, `${source.valuePath} has one proven consumer`);
            assert.equal(source.consumerRefs[0].flow, 'bounded-catalog-copy-to-viewer');
          }
          const drawingSources = inventory.sourceEntries.filter((entry) =>
            entry.source === 'app/core/ui-copy.js' && entry.sourceRole === 'technical-drawing-copy');
          assert.equal(drawingSources.length, 8);
          for (const source of drawingSources) {
            assert.equal(source.consumerRefs?.length, source.valuePath.endsWith('.amplification') ? 2 : 1,
              `${source.valuePath} has its bounded consumers`);
            for (const consumer of source.consumerRefs) {
              assert.equal(consumer.flow, 'bounded-catalog-copy-to-technical-drawing');
              assert.deepEqual(consumer.routeConsumers, ['/config/', '/viewer/']);
            }
          }
          assert(!inventory.sourceEntries.some((entry) =>
            entry.source === 'app/core/admin-bootstrap-retry.mjs'
            && entry.sourceRole === 'error-message-source'
            && entry.consumerLinkStatus === 'declared-sink-not-indexed'),
          'bootstrap error message catalog sources must resolve through the explicit source mapping');
          const expectedOutputs = [
            { path: 'app/index.html', route: '/' },
            { path: 'app/about/index.html', route: '/about/' },
            { path: 'app/how-it-works/index.html', route: '/how-it-works/' }
          ];
          assert.deepEqual(
            inventory.primaryPageAuthoringProvenance.outputs.map(({ path, route, status }) => ({ path, route, status })),
            expectedOutputs.map(({ path, route }) => ({ path, route, status: 'mapped' }))
          );
          for (const { path } of expectedOutputs) {
            const occurrences = inventory.entries.filter((entry) => entry.source === path);
            assert(occurrences.length > 0, `expected inventoried occurrences for ${path}`);
            assert(occurrences.every((entry) => entry.authoring?.status === 'mapped'),
              `every occurrence in ${path} must resolve to authoring provenance`);
          }
          assert.equal(summary.primaryPageAuthoringMappedOccurrences,
            inventory.entries.filter((entry) => entry.authoring?.status === 'mapped'
              && ['app/index.html', 'app/about/index.html', 'app/how-it-works/index.html'].includes(entry.source)).length);
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Confirm the tracked report is reproducible
        run: git diff --exit-code -- architecture/arc13/ui-text-candidates.json
