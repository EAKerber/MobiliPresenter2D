name: ARC-13 inventory provenance and determinism

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, development]
    paths:
      - 'app/**/*.html'
      - 'app/**/*.js'
      - 'app/**/*.mjs'
      - 'package.json'
      - 'architecture/pages/**'
      - 'architecture/fragments/primary-header.fragment.html'
      - 'architecture/fragments/primary-header.routes.json'
      - 'architecture/generated/primary-pages.manifest.json'
      - 'architecture/arc13/ui-text-candidates.json'
      - 'docs/architecture/arc13/loc002-ui-control-copy-2026-11-22.json'
      - 'scripts/compile-primary-pages.mjs'
      - 'tools/arc13/package.json'
      - 'tools/arc13/package-lock.json'
      - 'tools/arc13/run-inventory.mjs'
      - 'tools/arc13/scan-js-sinks.mjs'
      - 'tools/arc13/scan-ui-inventory.py'
      - 'tests/arc13_line_ending_normalization_test.py'
      - 'tests/ui-theme-contract.cjs'
      - '.github/workflows/arc13-inventory-integrity.yml'
  push:
    branches: [main, development]
    paths:
      - 'app/**/*.html'
      - 'app/**/*.js'
      - 'app/**/*.mjs'
      - 'package.json'
      - 'architecture/pages/**'
      - 'architecture/fragments/primary-header.fragment.html'
      - 'architecture/fragments/primary-header.routes.json'
      - 'architecture/generated/primary-pages.manifest.json'
      - 'architecture/arc13/ui-text-candidates.json'
      - 'docs/architecture/arc13/loc002-ui-control-copy-2026-11-22.json'
      - 'scripts/compile-primary-pages.mjs'
      - 'tools/arc13/package.json'
      - 'tools/arc13/package-lock.json'
      - 'tools/arc13/run-inventory.mjs'
      - 'tools/arc13/scan-js-sinks.mjs'
      - 'tools/arc13/scan-ui-inventory.py'
      - 'tests/arc13_line_ending_normalization_test.py'
      - 'tests/ui-theme-contract.cjs'
      - '.github/workflows/arc13-inventory-integrity.yml'

permissions:
  contents: read

concurrency:
  group: arc13-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned parser
        run: npm ci --prefix tools/arc13
      - name: Verify source-map line-ending normalization
        run: python tests/arc13_line_ending_normalization_test.py
      - name: Verify catalog-backed theme and menu labels
        run: node tests/ui-theme-contract.cjs
      - name: Verify primary page compiler output
        run: node scripts/compile-primary-pages.mjs --check
      - name: Confirm the generated report remains tracked
        run: git ls-files --error-unmatch architecture/arc13/ui-text-candidates.json
      - name: Regenerate the candidate inventory
        run: npm run inventory --prefix tools/arc13
      - name: Verify provenance coverage and unreviewed status
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const inventory = JSON.parse(fs.readFileSync('architecture/arc13/ui-text-candidates.json', 'utf8'));
          const summary = inventory.summary;
          assert.equal(inventory.schemaVersion, 4);
          assert.equal(inventory.status, 'candidate-unreviewed');
          assert.equal(summary.javascriptParseErrors, 0, 'JavaScript input must parse without errors');
          assert.equal(inventory.parseErrors.length, 0);
          assert.equal(summary.javascriptNotScannedSources, 0,
            'the normal AST-backed scan must run instead of HTML-only mode');
          assert.equal(summary.unassignedOwnerSites, 0,
            'source-path technical ownership must be assigned');
          assert.equal(summary.unassignedRouteSites, 0,
            'JavaScript sink routes must be assigned');
          assert.equal(summary.primaryPageAuthoringUnresolvedOccurrences, 0);
          assert.equal(summary.unreviewedOccurrences, inventory.entries.length,
            'generated candidates remain unreviewed');
          assert(inventory.entries.every((entry) => entry.classification === 'unreviewed'));
          const expectedOutputs = [
            { path: 'app/index.html', route: '/' },
            { path: 'app/about/index.html', route: '/about/' },
            { path: 'app/how-it-works/index.html', route: '/how-it-works/' }
          ];
          assert.deepEqual(
            inventory.primaryPageAuthoringProvenance.outputs.map(({ path, route, status }) => ({ path, route, status })),
            expectedOutputs.map(({ path, route }) => ({ path, route, status: 'mapped' }))
          );
          for (const { path } of expectedOutputs) {
            const occurrences = inventory.entries.filter((entry) => entry.source === path);
            assert(occurrences.length > 0, `expected inventoried occurrences for ${path}`);
            assert(occurrences.every((entry) => entry.authoring?.status === 'mapped'),
              `every occurrence in ${path} must resolve to authoring provenance`);
          }
          assert.equal(summary.primaryPageAuthoringMappedOccurrences,
            inventory.entries.filter((entry) => entry.authoring?.status === 'mapped'
              && ['app/index.html', 'app/about/index.html', 'app/how-it-works/index.html'].includes(entry.source)).length);
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - name: Confirm the tracked report is reproducible
        run: git diff --exit-code -- architecture/arc13/ui-text-candidates.json
