name: Audit live CSS temp

on:
  push:
    branches: [audit/live-state-2026-09-17]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      TARGET_URL: https://6aabc2c4b3a76f8ad67da4f5--mobilipresenter2d.netlify.app
      TARGET_BRANCH: audit/live-state-2026-09-17
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Chromium tooling
        run: |
          npm install --prefix /tmp/css-browser --no-audit --no-fund playwright@1.62.1
          /tmp/css-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture computed CSS metrics and responsive screenshots
        env:
          NODE_PATH: /tmp/css-browser/node_modules
        run: |
          cat > /tmp/css-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out='/tmp/css-audit'; fs.mkdirSync(out,{recursive:true});
          const target=process.env.TARGET_URL;
          const cases=[
            {w:1720,h:1000},{w:1440,h:1000},{w:1366,h:768},{w:1200,h:800},
            {w:1051,h:900},{w:1050,h:900},{w:900,h:700},{w:701,h:900},{w:700,h:900},
            {w:500,h:850},{w:390,h:844},{w:360,h:800},{w:320,h:700},
            {w:1366,h:600},{w:1366,h:500},{w:900,h:500},{w:390,h:667}
          ];
          const safe=s=>s.replace(/[^a-z0-9_-]+/gi,'-').toLowerCase();
          async function fresh(page){
            await page.goto(target+'/?cssaudit='+Date.now(),{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(450);
          }
          async function measure(page,label){
            const data=await page.evaluate((label)=>{
              const vis=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;};
              const rect=el=>{if(!el||!vis(el))return null;const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),width:+r.width.toFixed(1),height:+r.height.toFixed(1),right:+r.right.toFixed(1),bottom:+r.bottom.toFixed(1),position:s.position,overflowX:s.overflowX,overflowY:s.overflowY,fontSize:s.fontSize,lineHeight:s.lineHeight,whiteSpace:s.whiteSpace};};
              const q=s=>document.querySelector(s);
              const all=s=>[...document.querySelectorAll(s)];
              const flowSteps=all('.flow-step').filter(vis).map(el=>({text:(el.innerText||'').replace(/\s+/g,' ').trim(),clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,rect:rect(el)}));
              const moduleNames=all('.module-card__copy strong').filter(vis).map(el=>({text:el.textContent.trim(),clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,whiteSpace:getComputedStyle(el).whiteSpace,textOverflow:getComputedStyle(el).textOverflow}));
              const buttons=all('button').filter(vis).map(el=>({text:(el.innerText||'').replace(/\s+/g,' ').trim().slice(0,100),w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height,font:getComputedStyle(el).fontSize}));
              const textEls=all('h1,h2,h3,h4,p,small,strong,dt,dd,legend,button,label,span,em').filter(vis).map(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {tag:el.tagName.toLowerCase(),cls:typeof el.className==='string'?el.className:'',id:el.id||'',text:(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim().slice(0,120),fontSize:parseFloat(s.fontSize)||0,clientWidth:el.clientWidth,scrollWidth:el.scrollWidth,clientHeight:el.clientHeight,scrollHeight:el.scrollHeight,overflowX:s.overflowX,overflowY:s.overflowY,whiteSpace:s.whiteSpace,x:r.x,right:r.right};});
              const clipped=textEls.filter(x=>(x.scrollWidth>x.clientWidth+1||x.scrollHeight>x.clientHeight+1)&&(['hidden','clip'].includes(x.overflowX)||['hidden','clip'].includes(x.overflowY)||x.whiteSpace==='nowrap'));
              const tiny=textEls.filter(x=>x.fontSize>0&&x.fontSize<11);
              const outside=textEls.filter(x=>x.x<-1||x.right>innerWidth+1);
              const root=getComputedStyle(document.documentElement);
              return {
                label,viewport:{width:innerWidth,height:innerHeight},dpr:devicePixelRatio,
                doc:{scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1},
                rects:{workspace:rect(q('.workspace')),viewerCard:rect(q('.viewer-card')),viewer:rect(q('#viewer')),controls:rect(q('.controls')),flowNav:rect(q('.flow-nav')),flowActions:rect(q('.flow-actions')),modulePanel:rect(q('#modulesPanel')),moduleDetail:rect(q('#moduleDetail'))},
                controls:{clientHeight:q('.controls')?.clientHeight||0,scrollHeight:q('.controls')?.scrollHeight||0,overflowY:q('.controls')?getComputedStyle(q('.controls')).overflowY:null},
                flowSteps,moduleNames,clipped,tiny,outside,buttons,
                tokens:{background:root.getPropertyValue('--background').trim(),surface:root.getPropertyValue('--surface').trim(),surfaceRaised:root.getPropertyValue('--surface-raised').trim(),text:root.getPropertyValue('--text').trim(),muted:root.getPropertyValue('--muted').trim(),border:root.getPropertyValue('--border').trim(),accent:root.getPropertyValue('--accent').trim(),accentStrong:root.getPropertyValue('--accent-strong').trim()},
                bodyClass:document.body.className
              };
            },label);
            fs.writeFileSync(path.join(out,safe(label)+'.json'),JSON.stringify(data,null,2));
            return data;
          }
          async function shot(page,label,fullPage=false){ await page.screenshot({path:path.join(out,safe(label)+'.png'),fullPage,animations:'disabled'}); }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({serviceWorkers:'block',extraHTTPHeaders:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}});
            const page=await ctx.newPage();
            const summary=[];
            for(const c of cases){
              await page.setViewportSize({width:c.w,height:c.h}); await fresh(page);
              const label=`initial-${c.w}x${c.h}`; summary.push(await measure(page,label));
              if([[1440,1000],[1051,900],[1050,900],[700,900],[390,844],[320,700],[1366,500]].some(([w,h])=>w===c.w&&h===c.h)) await shot(page,label,false);
              if([[1440,1000],[1051,900],[1050,900],[390,844],[320,700]].some(([w,h])=>w===c.w&&h===c.h)){
                const d=page.locator('[data-select-entity="module-02"]'); if(await d.count()){await d.first().click();await page.waitForTimeout(250); const dl=`detail-${c.w}x${c.h}`; summary.push(await measure(page,dl)); await shot(page,dl,false);}
              }
            }
            // Mobile sticky-action overlap scan.
            await page.setViewportSize({width:390,height:844}); await fresh(page);
            const overlap=[]; const max=await page.evaluate(()=>Math.max(0,document.documentElement.scrollHeight-innerHeight));
            for(let y=0;y<=max;y+=Math.max(120,Math.floor(innerHeight/3))){
              await page.evaluate(y=>scrollTo(0,y),y); await page.waitForTimeout(30);
              overlap.push(await page.evaluate(()=>{
                const bar=document.querySelector('.flow-actions'); if(!bar)return null; const b=bar.getBoundingClientRect();
                const hits=[...document.querySelectorAll('.module-card button,.module-card input,.flow-step,.module-card__toggle')].filter(el=>{const r=el.getBoundingClientRect();return r.bottom>b.top&&r.top<b.bottom&&r.right>b.left&&r.left<b.right;}).map(el=>({tag:el.tagName,cls:el.className,id:el.id||'',text:(el.innerText||el.getAttribute('aria-label')||'').trim().slice(0,80)}));
                return {scrollY,bar:{top:b.top,bottom:b.bottom,height:b.height},hits};
              }));
            }
            fs.writeFileSync(path.join(out,'mobile-sticky-overlap.json'),JSON.stringify(overlap,null,2));
            fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2));
            await browser.close();
          })().catch(e=>{fs.writeFileSync(path.join(out,'fatal.txt'),String(e.stack||e));process.exitCode=1;});
          NODE
          node /tmp/css-audit.cjs
      - name: Upload CSS audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-css-audit-2026-09-17
          path: /tmp/css-audit
          if-no-files-found: error
      - name: Self-clean temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-live-css-temp.yml
          git commit -m 'Remove temporary live CSS audit workflow'
          git push origin HEAD:${TARGET_BRANCH}
