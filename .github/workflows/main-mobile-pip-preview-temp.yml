name: Main mobile PiP deploy-preview gate temp

on:
  push:
    branches:
      - fix/mobile-pip-main-publish-20260925
    paths:
      - .github/workflows/main-mobile-pip-preview-temp.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-pip-main-publish-20260925
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/mobile-browser --no-audit --no-fund playwright@1.62.1
          /tmp/mobile-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run deploy-preview real-touch gate
        env:
          NODE_PATH: /tmp/mobile-browser/node_modules
          MOBILE_INTERACTIONS_URL: https://deploy-preview-33--mobilipresenter2d.netlify.app
        run: node tests/mobile-pip-main-browser.cjs /tmp/mobile-pip-main-preview-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pip-main-preview-review
          path: /tmp/mobile-pip-main-preview-review
          if-no-files-found: ignore
      - name: Self-clean with CAS
        env:
          TARGET_BRANCH: fix/mobile-pip-main-publish-20260925
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/main-mobile-pip-preview-temp.yml
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "chore: self-clean main mobile PiP preview gate"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
