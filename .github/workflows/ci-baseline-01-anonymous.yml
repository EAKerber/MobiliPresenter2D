name: CI-BASELINE-01 anonymous Config and isolation barrier
on:
  push:
    branches:
      - ci/ci-baseline-01-isolated-auth-extraction-20261024
    paths:
      - "tests/ci/config-auth-*"
      - ".github/workflows/ci-baseline-01-anonymous.yml"
      - ".github/workflows/ci-baseline-01-isolated-authenticated.yml"
      - "docs/handoffs/CI_BASELINE_01_ISOLATED_AUTH_FIXTURE_2026-10-24.md"
      - "netlify/access/migrations/**"
      - "netlify.toml"
      - "netlify/plugins/ci-v5-fixture/**"
      - "scripts/build-ci-preview-fixture.mjs"
      - "tests/ci/build-ci-preview-fixture.test.mjs"
      - "tests/ci/config-authenticated-v5-suites.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and production-denial tests
        run: |
          node --check tests/ci/config-auth-isolation.mjs
          node --check tests/ci/config-auth-anonymous-browser.mjs
          node --check tests/ci/config-auth-isolated-browser.mjs
          node --check tests/ci/config-authenticated-v5-suites.mjs
          node --check scripts/build-ci-preview-fixture.mjs
          node --check netlify/plugins/ci-v5-fixture/index.mjs
          node --test tests/ci/build-ci-preview-fixture.test.mjs
          node --test tests/ci/config-auth-isolation.test.mjs
      - name: Restrict changes to the approved CI fixture and test scope
        run: |
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- app/config app/admin app/access app/viewer netlify/access netlify/functions netlify/edge-functions ':(exclude)netlify/access/migrations/20261024120000_ci_config_fixture_role.sql'
          node --input-type=module <<'NODE'
          import {execFileSync} from "node:child_process";
          const changed = execFileSync("git", ["diff", "--name-only", "origin/main...HEAD"], {encoding:"utf8"}).trim().split("\n").filter(Boolean);
          const allowed = new Set([
            ".github/workflows/ci-baseline-01-anonymous.yml",
            ".github/workflows/ci-baseline-01-isolated-authenticated.yml",
            "docs/handoffs/CI_BASELINE_01_ISOLATED_AUTH_FIXTURE_2026-10-24.md",
            "netlify.toml",
            "netlify/plugins/ci-v5-fixture/index.mjs",
            "netlify/plugins/ci-v5-fixture/package.json",
            "netlify/plugins/ci-v5-fixture/manifest.yml",
            "netlify/access/migrations/20261024120000_ci_config_fixture_role.sql",
            "scripts/build-ci-preview-fixture.mjs",
            "tests/ci/build-ci-preview-fixture.test.mjs",
            "tests/ci/config-auth-anonymous-browser.mjs",
            "tests/ci/config-auth-isolated-browser.mjs",
            "tests/ci/config-auth-isolation.mjs",
            "tests/ci/config-auth-isolation.test.mjs",
            "tests/ci/config-authenticated-v5-suites.mjs",
            "tests/flow-layout-browser.cjs",
            "tests/keyboard-browser.cjs"
          ]);
          const unexpected = changed.filter(path => !allowed.has(path));
          if (unexpected.length) throw new Error("Unexpected files in CI fixture PR: " + unexpected.join(", "));
          if (!changed.includes("netlify.toml") || !changed.includes("netlify/plugins/ci-v5-fixture/index.mjs") || !changed.includes("netlify/plugins/ci-v5-fixture/manifest.yml")) {
            throw new Error("Approved isolated preview fixture is not included");
          }
          NODE
  anonymous-config:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    env:
      CI_ANON_TARGET_ORIGIN: https://mobilipresenter2d.netlify.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/m2d-ci-config-anon --no-audit --no-fund playwright@1.56.0
          ln -s /tmp/m2d-ci-config-anon/node_modules ./node_modules
      - name: Observe real anonymous redirect without credentials
        run: node tests/ci/config-auth-anonymous-browser.mjs
      - name: Save sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-config-anonymous-readiness
          path: artifacts/ci-baseline-01/anonymous.json
          retention-days: 7
          if-no-files-found: warn
