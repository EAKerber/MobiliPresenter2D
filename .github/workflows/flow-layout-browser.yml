name: Flow layout browser (local V5; protected preview separately gated)
on:
  push:
    branches: [main]
    paths:
      - 'app/data/hierarchy-defaults.js'
      - 'app/core/flow-model.js'
      - 'app/core/layout-profiles.js'
      - 'app/core/presentation-contract.js'
      - 'app/data/presentation-policy-defaults.js'
      - 'app/core/flow-layout.js'
      - 'app/app.js'
      - 'app/index.html'
      - 'app/styles.css'
      - 'tests/flow-layout-browser.cjs'
      - 'tests/buyer-v5-browser.cjs'
      - 'tests/ci/nav-flow-responsive-crossbrowser.cjs'
      - '.github/workflows/flow-layout-browser.yml'
      - 'tests/ci/prepare-local-v5-browser.sh'
      - 'tests/ci/local-buyer-config-server.mjs'
  pull_request:
    paths:
      - 'app/data/hierarchy-defaults.js'
      - 'app/core/flow-model.js'
      - 'app/core/layout-profiles.js'
      - 'app/core/presentation-contract.js'
      - 'app/data/presentation-policy-defaults.js'
      - 'app/core/flow-layout.js'
      - 'app/app.js'
      - 'app/index.html'
      - 'app/styles.css'
      - 'tests/flow-layout-browser.cjs'
      - 'tests/buyer-v5-browser.cjs'
      - 'tests/ci/nav-flow-responsive-crossbrowser.cjs'
      - '.github/workflows/flow-layout-browser.yml'
      - 'tests/ci/prepare-local-v5-browser.sh'
      - 'tests/ci/local-buyer-config-server.mjs'
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional deployed URL for a smoke test
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve browser target (validated V5 loopback by default)
        shell: bash
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            target="${{ inputs.target_url }}"
            echo "FLOW_LAYOUT_URL=$target" >> "$GITHUB_ENV"
            echo "CI_EXPLICIT_BROWSER_TARGET_SPECIFIED"
          else
            bash tests/ci/prepare-local-v5-browser.sh FLOW_LAYOUT_URL
          fi
      - name: Install browser test tooling
        run: |
          npm install --prefix /tmp/flow-layout-tools --no-audit --no-fund playwright@1.62.1
          /tmp/flow-layout-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test hierarchy-driven buyer layout
        env:
          NODE_PATH: /tmp/flow-layout-tools/node_modules
        run: node tests/flow-layout-browser.cjs /tmp/flow-layout-review
      - name: Verify buyer v3/v5 response parity and invalid-v5 failure
        env:
          NODE_PATH: /tmp/flow-layout-tools/node_modules
        run: node tests/buyer-v5-browser.cjs /tmp/buyer-v5-review
      - name: Test dynamic navigation across 700/701 and 1050/1051 breakpoints
        env:
          NODE_PATH: /tmp/flow-layout-tools/node_modules
        run: node tests/ci/nav-flow-responsive-crossbrowser.cjs
      - name: Save flow layout review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-layout-browser-${{ github.run_id }}
          path: |
            /tmp/flow-layout-review
            /tmp/buyer-v5-review
          if-no-files-found: ignore
