name: Pan ghost audit

on:
  push:
    branches:
      - audit/boundary-forensics
    paths:
      - 'tools/audit-pan-ghost.py'
      - '.github/workflows/pan-ghost-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python tools/audit-pan-ghost.py
      - uses: actions/upload-artifact@v4
        with:
          name: pan-ghost-audit
          path: pan-ghost-audit-output/
          if-no-files-found: error
