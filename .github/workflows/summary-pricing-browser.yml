name: Summary pricing browser

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/summary-pricing-browser.cjs'
      - '.github/workflows/summary-pricing-browser.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/summary-pricing-browser.cjs'
      - '.github/workflows/summary-pricing-browser.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional deployed URL for a production smoke test
        required: false
        type: string

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static summary ownership gate
        run: |
          test "$(grep -c 'function renderCurrentValue' app/app.js)" -eq 1
          test "$(grep -c 'function renderSummary' app/app.js)" -eq 1
          ! grep -q 'estimate.status === "legacy"' app/app.js
          grep -q 'estimate.status === "estimate"' app/app.js
          node --check app/app.js
          node app/tools/test-core.js
      - name: Resolve browser target
        shell: bash
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            target="${{ inputs.target_url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            target="https://deploy-preview-${{ github.event.pull_request.number }}--mobilipresenter2d.netlify.app/"
          else
            target="https://mobilipresenter2d.netlify.app/"
          fi
          echo "SUMMARY_PRICING_BROWSER_URL=$target" >> "$GITHUB_ENV"
          echo "Browser target: $target"
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/summary-pricing-tools --no-audit --no-fund playwright@1.62.1
          /tmp/summary-pricing-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test summary and pricing ownership
        env:
          NODE_PATH: /tmp/summary-pricing-tools/node_modules
        run: node tests/summary-pricing-browser.cjs /tmp/summary-pricing-review
      - name: Save interface review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-pricing-${{ github.run_id }}
          path: /tmp/summary-pricing-review
          if-no-files-found: ignore
