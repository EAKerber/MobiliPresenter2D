name: Research SC01 internal edge temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-sc01-internal-edge-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Compile and test SC-01 v4
        run: |
          python -m py_compile tools/research_scene_projective_consistency.py
          python -m unittest tests/test_research_scene_projective_consistency.py
      - name: Materialize SC-01 v4 report
        run: |
          python tools/research_scene_projective_consistency.py             --config review-assets/research/scene-projective-consistency-v0.1.json             --output review-assets/research/scene-projective-consistency-v0.1-report.json
          cat review-assets/research/scene-projective-consistency-v0.1-report.json
      - name: Commit report and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-sc01-internal-edge-temp.yml
          git add review-assets/research/scene-projective-consistency-v0.1-report.json
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize SC-01 internal edge trace"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
