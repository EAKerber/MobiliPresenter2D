name: Research BMC04 packet gate temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc04-packet-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Validate BMC-04 bounded-generation packet
        run: |
          python -m py_compile tools/validate_reconstruction_packet.py tools/research_bmc04_generation_input.py
          python -m unittest tests/test_validate_reconstruction_packet.py tests/test_research_bmc04_generation_input.py
          python tools/validate_reconstruction_packet.py             review-assets/research/bmc04-cooktop-bounded-generation-v0.1.json
      - name: Self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc04-packet-temp.yml
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "chore: self-clean BMC-04 packet gate"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
