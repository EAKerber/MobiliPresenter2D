name: Housekeeping runtime contract boundaries temp

on:
  push:
    branches: [housekeeping/runtime-contract-boundaries]
    paths:
      - '.github/workflows/housekeeping-runtime-boundaries-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: housekeeping/runtime-contract-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize explicit runtime boundaries
        run: |
          cat > app/core/runtime-contracts.js <<'JS'
          (function registerRuntimeContracts(global) {
            "use strict";

            const SKIRTING_ID = "stone-skirting";
            const STONE_GROUP_ID = "stone-all";
            const HANDLE_GROUP_ID = "handles-all";
            const FRONT_GROUP_ID = "fronts-all";

            function clone(value) {
              return typeof structuredClone === "function"
                ? structuredClone(value)
                : JSON.parse(JSON.stringify(value));
            }

            function itemIsAssigned(stages, itemId) {
              return stages.some((stage) => Array.isArray(stage?.items) && stage.items.includes(itemId));
            }

            function stageContaining(stages, itemId) {
              return stages.find((stage) => Array.isArray(stage?.items) && stage.items.includes(itemId));
            }

            function appendOnce(stage, itemId) {
              if (!stage || !Array.isArray(stage.items) || stage.items.includes(itemId)) return;
              stage.items.push(itemId);
            }

            // Compatibility for static/default settings created before handles and
            // semantic skirting were both assigned to the finishes stage.
            function repairDefaultStageSettings(input) {
              if (!input || !Array.isArray(input.stages)) return input;
              const value = clone(input);
              const finishes = stageContaining(value.stages, STONE_GROUP_ID)
                || stageContaining(value.stages, FRONT_GROUP_ID);
              if (!finishes) return value;
              if (!itemIsAssigned(value.stages, HANDLE_GROUP_ID)) appendOnce(finishes, HANDLE_GROUP_ID);
              if (!itemIsAssigned(value.stages, SKIRTING_ID)) appendOnce(finishes, SKIRTING_ID);
              return value;
            }

            // Published configurations created before the skirting control became a
            // first-class stage item may contain an active service with no visible
            // control. Repair only that contradictory state. If an administrator removed
            // both the control and the service from initialState, preserve that intent.
            function repairSkirtingStageContract(input) {
              if (!input || !Array.isArray(input.stages)) return input;
              const services = new Set(input.initialState?.services || []);
              if (!services.has(SKIRTING_ID) || itemIsAssigned(input.stages, SKIRTING_ID)) return input;
              const stoneStage = stageContaining(input.stages, STONE_GROUP_ID);
              if (!stoneStage) return input;
              const value = clone(input);
              appendOnce(stageContaining(value.stages, STONE_GROUP_ID), SKIRTING_ID);
              return value;
            }

            const configuration = global.CasaModulesConfiguration;
            if (configuration) {
              global.CasaModulesConfiguration = Object.freeze({
                ...configuration,
                createDefaultAdministration(settings, ...args) {
                  return configuration.createDefaultAdministration(repairDefaultStageSettings(settings), ...args);
                },
                normalizeConfiguratorSettings(input, ...args) {
                  return configuration.normalizeConfiguratorSettings(repairSkirtingStageContract(input), ...args);
                }
              });
            }

            global.CASA_RUNTIME_CONTRACTS = Object.freeze({
              repairDefaultStageSettings,
              repairSkirtingStageContract
            });
          })(typeof window === "undefined" ? globalThis : window);
          JS

          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('app/index.html')
          html = index.read_text()
          if html.count('core/keyboard-shortcuts.js') != 0:
              raise SystemExit('keyboard script already explicitly present; refuse ambiguous materialization')
          marker = '<script src="core/runtime-contracts.js?v=runtime-contracts-v1"></script>'
          replacement = (
              '<script src="core/runtime-contracts.js?v=runtime-contracts-v2"></script>\n'
              '    <script src="core/keyboard-shortcuts.js?v=keyboard-v2"></script>'
          )
          if html.count(marker) != 1:
              raise SystemExit('runtime-contracts script marker drift')
          html = html.replace(marker, replacement, 1)
          count = html.count('runtime-v6')
          if count != 14:
              raise SystemExit(f'expected 14 coordinated runtime-v6 references, got {count}')
          html = html.replace('runtime-v6', 'runtime-v7')
          index.write_text(html)

          styles = Path('app/styles.css')
          css = styles.read_text()
          anchor = '.scene-hotspots { z-index: 500; pointer-events: none; }'
          rules = '''.scene-hotspots { z-index: 500; pointer-events: none; }\n#alignmentGrid { z-index: 840; }\n#sceneHotspots { z-index: 860; }\n#selectionFrame { z-index: 900; }'''
          if css.count(anchor) != 1:
              raise SystemExit('scene-hotspots CSS anchor drift')
          if any(token in css for token in ['#alignmentGrid { z-index: 840;', '#sceneHotspots { z-index: 860;', '#selectionFrame { z-index: 900;']):
              raise SystemExit('stack contract already materialized in CSS')
          styles.write_text(css.replace(anchor, rules, 1))

          test = Path('app/tools/test-runtime-contracts.js')
          source = test.read_text()
          anchor = 'console.log("runtime contracts: PASS");'
          if source.count(anchor) != 1:
              raise SystemExit('runtime-contract test anchor drift')
          assertions = r'''
          const runtimeContractsSource = fs.readFileSync(path.join(projectRoot, "core/runtime-contracts.js"), "utf8");
          const indexHtml = fs.readFileSync(path.join(projectRoot, "index.html"), "utf8");
          const stylesCss = fs.readFileSync(path.join(projectRoot, "styles.css"), "utf8");
          assert.equal(runtimeContractsSource.includes("installSceneStackContracts"), false, "migration shim must not own presentation stacking");
          assert.equal(runtimeContractsSource.includes("installKeyboardShortcuts"), false, "migration shim must not own script loading");
          assert.equal(runtimeContractsSource.includes("createElement(\"style\")"), false, "migration shim must not inject CSS");
          assert.equal(runtimeContractsSource.includes("createElement(\"script\")"), false, "migration shim must not inject scripts");
          assert.equal((indexHtml.match(/core\/keyboard-shortcuts\.js/g) || []).length, 1, "keyboard script is loaded explicitly exactly once");
          const runtimeContractIndex = indexHtml.indexOf("core/runtime-contracts.js?v=runtime-contracts-v2");
          const keyboardIndex = indexHtml.indexOf("core/keyboard-shortcuts.js?v=keyboard-v2");
          const appIndex = indexHtml.indexOf("app.js?v=runtime-v7");
          assert.equal(runtimeContractIndex >= 0 && keyboardIndex > runtimeContractIndex && appIndex > keyboardIndex, true, "runtime migration, keyboard behavior and app load in explicit order");
          assert.match(stylesCss, /#alignmentGrid\s*\{\s*z-index:\s*840;\s*\}/, "alignment grid stack contract lives in CSS");
          assert.match(stylesCss, /#sceneHotspots\s*\{\s*z-index:\s*860;\s*\}/, "hotspot stack contract lives in CSS");
          assert.match(stylesCss, /#selectionFrame\s*\{\s*z-index:\s*900;\s*\}/, "selection stack contract lives in CSS");

          console.log("runtime contracts: PASS");'''
          test.write_text(source.replace(anchor, assertions, 1))
          PY
      - name: Contract gates
        run: |
          set -euo pipefail
          node --check app/core/runtime-contracts.js
          node --check app/core/keyboard-shortcuts.js
          node app/tools/test-runtime-contracts.js
          node app/tools/test-core.js
          test "$(grep -o 'core/keyboard-shortcuts.js?v=keyboard-v2' app/index.html | wc -l)" -eq 1
          ! grep -q 'installSceneStackContracts\|installKeyboardShortcuts\|runtime-scene-stack-contracts\|keyboard-shortcuts-runtime' app/core/runtime-contracts.js
          grep -q '#alignmentGrid { z-index: 840; }' app/styles.css
          grep -q '#sceneHotspots { z-index: 860; }' app/styles.css
          grep -q '#selectionFrame { z-index: 900; }' app/styles.css
      - name: Commit cleanup and self-remove
        env:
          TARGET_BRANCH: housekeeping/runtime-contract-boundaries
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/housekeeping-runtime-boundaries-temp.yml
          git add app/core/runtime-contracts.js app/index.html app/styles.css app/tools/test-runtime-contracts.js
          git commit -m 'Separate runtime migrations from presentation contracts'
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          result="$(git rev-parse HEAD)"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
          echo "RESULT_HEAD=$result"
