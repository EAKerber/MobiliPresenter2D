name: NAV-005 public header browser gate (local only)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'app/about/index.html'
      - 'app/how-it-works/**'
      - 'app/index.html'
      - 'app/landing/**'
      - 'app/viewer/index.html'
      - 'architecture/fragments/**'
      - 'architecture/pages/**'
      - 'tests/ci/public-navigation-semantic-browser.mjs'
      - '.github/workflows/nav005-public-header-browser.yml'

permissions:
  contents: read

concurrency:
  group: nav005-public-header-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  public-header-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authored and generated page integrity
        run: |
          node --check app/landing/header-menu.js
          node --check tests/ci/public-navigation-semantic-browser.mjs
          node --test tests/arc03c-source-authority.test.mjs
          npm run pages:check
      - name: Install Playwright package matching the container browsers
        run: |
          npm install --prefix /tmp/m2d-nav005 --no-audit --no-fund playwright@1.62.1
          node -e 'const p=require("/tmp/m2d-nav005/node_modules/playwright/package.json");if(p.version!=="1.62.1")process.exit(1)'
      - name: Serve only the local static app
        shell: bash
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory app >/tmp/m2d-nav005-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8123/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8123/about/ >/dev/null
          curl --fail http://127.0.0.1:8123/how-it-works/ >/dev/null
          curl --fail http://127.0.0.1:8123/viewer/ >/dev/null
      - name: Verify 124 public navigation scenarios in Chromium and WebKit
        env:
          NODE_PATH: /tmp/m2d-nav005/node_modules
          M2D_PUBLIC_LOOPBACK_URL: http://127.0.0.1:8123
        run: node tests/ci/public-navigation-semantic-browser.mjs
