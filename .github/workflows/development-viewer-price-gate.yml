name: Development 06 Viewer price/publication gate (offline and localhost)

on:
  push:
    branches:
      - development
    paths:
      - 'tests/ci/viewer-price-wire-contract.test.cjs'
      - 'tests/viewer-base-price-publication.test.cjs'
      - 'tests/viewer-price-v5-save.test.cjs'
      - 'tests/viewer-base-price-browser-gate.mjs'
      - 'app/core/administration-v5.js'
      - 'app/core/public-module-projection.js'
      - 'app/viewer/**'
      - 'app/admin/admin.js'
      - 'netlify/functions/public-modules.mjs'
      - '.github/workflows/development-viewer-price-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: m2d-development-viewer-price-${{ github.ref }}
  cancel-in-progress: false

jobs:
  price-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V5 publication and client wire fail-closed contracts (no real network)
        run: |
          node --test tests/viewer-base-price-publication.test.cjs tests/viewer-price-v5-save.test.cjs tests/ci/viewer-price-wire-contract.test.cjs
          node app/tools/test-public-modules-endpoint.js
          node --check app/viewer/public-data.js
          node --check app/viewer/viewer.js
  price-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright client matching system browsers
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.62.1
      - name: Serve Viewer locally without production or preview
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory app >/tmp/m2d-dev-viewer-price.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8123/viewer/ >/dev/null
      - name: Browser price ON/OFF in Chromium and WebKit
        run: node tests/viewer-base-price-browser-gate.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-viewer-price-browser-${{ github.run_id }}
          path: artifacts/viewer-base-price/
          if-no-files-found: ignore
          retention-days: 7
