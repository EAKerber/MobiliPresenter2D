name: Development 06 Viewer price/publication gate (offline and localhost)

on:
  pull_request:
    branches:
      - development
    paths:
      - 'tests/ci/viewer-price-wire-contract.test.cjs'
      - 'app/viewer/public-data.js'
      - '.github/workflows/development-viewer-price-gate.yml'
  push:
    branches:
      - development
    paths:
      - 'tests/ci/viewer-price-wire-contract.test.cjs'
      - 'app/viewer/public-data.js'
      - '.github/workflows/development-viewer-price-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: m2d-development-viewer-price-${{ github.ref }}
  cancel-in-progress: false

jobs:
  price-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the browser wire adapter against authorized price contracts
        run: node --test tests/ci/viewer-price-wire-contract.test.cjs
