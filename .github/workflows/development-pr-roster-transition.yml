name: Development CP-PUBLIC protected PR roster transition
on:
  push:
    branches:
      - development
    paths:
      - 'ops/development-pr-closure-transition.json'
      - 'docs/work/DEVELOPMENT_CP_PUBLIC_PR_CLOSURE_2026-10-28.md'
      - 'tools/development_retirement_batch.py'
      - 'tools/development_pr_roster_probe.py'
      - 'tests/test_development_pr_roster_transition.py'
      - '.github/workflows/development-pr-roster-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile strict PR, archive, and bounded branch retirement logic
        run: |
          python3 -m py_compile tools/development_retirement_batch.py tools/development_pr_roster_probe.py
          python3 -m unittest tests/test_development_retirement_batch.py tests/test_development_pr_roster_transition.py -v
      - name: Read-only GitHub check of all live PRs and all four exact archive tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/development_pr_roster_probe.py
