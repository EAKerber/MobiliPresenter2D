name: Development CP-PUBLIC historical retention (offline)
on:
  push:
    branches:
      - development
    paths:
      - 'ops/development-pr-branch-transition.json'
      - 'docs/work/DEVELOPMENT_PR_BRANCH_ARCHIVE_2026-11-01.md'
      - 'tools/historical_pr_retention.py'
      - 'tests/test_development_pr_roster_transition.py'
      - 'tests/test_development_cp_public_lineage.py'
      - 'tests/test_development_cp_public_prs_175_180.py'
      - '.github/workflows/development-pr-roster-transition.yml'
  pull_request:
    branches: [development]
    paths:
      - 'tools/historical_pr_retention.py'
      - 'tests/test_development_pr_roster_transition.py'
      - 'tests/test_development_cp_public_lineage.py'
      - 'tests/test_development_cp_public_prs_175_180.py'
      - '.github/workflows/development-pr-roster-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile read-only historical PR/archive contracts
        run: |
          python3 -m py_compile tools/historical_pr_retention.py
          python3 -m unittest tests/test_development_pr_roster_transition.py tests/test_development_cp_public_lineage.py tests/test_development_cp_public_prs_175_180.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public projection, endpoint and viewer contracts without external services
        run: |
          node --test tests/public-module-projection.test.cjs
          node app/tools/test-public-modules-endpoint.js
          node --test app/viewer/scene-adapters.test.mjs
