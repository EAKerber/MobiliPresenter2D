name: Development CP-PUBLIC protected PR roster transition
on:
  push:
    branches:
      - development
    paths:
      - 'ops/development-pr-branch-transition.json'
      - 'docs/work/DEVELOPMENT_PR_BRANCH_ARCHIVE_2026-11-01.md'
      - 'tools/development_retirement_batch.py'
      - 'tools/development_pr_roster_probe.py'
      - 'tests/test_development_pr_roster_transition.py'
      - 'tests/test_development_cp_public_lineage.py'
      - 'tests/test_development_cp_public_prs_175_180.py'
      - '.github/workflows/development-pr-roster-transition.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile strict PR, archive, and bounded branch retirement logic
        run: |
          python3 -m py_compile tools/development_retirement_batch.py tools/development_pr_roster_probe.py
          python3 -m unittest tests/test_development_retirement_batch.py tests/test_development_pr_roster_transition.py tests/test_development_cp_public_lineage.py tests/test_development_cp_public_prs_175_180.py -v
      - name: Read-only GitHub check of live PRs, pinned branches and archive tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/development_pr_roster_probe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public projection, endpoint and viewer contracts without external services
        run: |
          node --test tests/public-module-projection.test.cjs
          node app/tools/test-public-modules-endpoint.js
          node --test app/viewer/scene-adapters.test.mjs
