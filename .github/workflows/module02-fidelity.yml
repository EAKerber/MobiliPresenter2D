name: Historical R4 module 02 replay

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Historical commit, tag or branch to replay against the R4 checkpoint
        required: true
        type: string

permissions:
  contents: read

jobs:
  module02-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Materialize parent visual evidence
        run: |
          mkdir -p /tmp/r4-parent /tmp/r4-review
          git show d8ec0dd15c7dc9e61623b5eb3a4bd346b4e7d587:app/assets/kitchen/composicao-completa.png > /tmp/r4-parent/golden.png
          git show d8ec0dd15c7dc9e61623b5eb3a4bd346b4e7d587:app/assets/kitchen/layers/02_inferior_fogao.png > /tmp/r4-parent/module02.png
      - name: Validate exact historical checkpoint
        run: python tools/validate-baseline.py
      - name: Validate checkpoint app runtime and assets
        working-directory: app
        run: npm test
      - name: Replay bounded R4 visual transition when applicable
        run: |
          baseline_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('reference/baseline-manifest.json').read_text(encoding='utf-8'))['baselineId'])
          PY
          )"
          case "$baseline_id" in
            cozinha-01-r4-*)
              python tools/validate-r4-module02.py \
                --previous-golden /tmp/r4-parent/golden.png \
                --previous-module /tmp/r4-parent/module02.png \
                --output-dir /tmp/r4-review
              ;;
            *)
              BASELINE_ID="$baseline_id" python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('/tmp/r4-review/summary.json')
          path.write_text(json.dumps({
              'status': 'SKIPPED',
              'code': 'R4_TRANSITION_GATE_NOT_APPLICABLE',
              'baselineId': os.environ['BASELINE_ID'],
              'detail': 'The selected historical ref is not an R4 checkpoint.'
          }, indent=2) + '\n', encoding='utf-8')
          PY
              ;;
          esac
          cat /tmp/r4-review/summary.json
      - name: Upload historical R4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical-r4-module02-${{ github.run_id }}
          path: /tmp/r4-review
          if-no-files-found: error
