name: Implement measured plinth and adaptive seams temp
# retry: full final plinth alpha row

on:
  push:
    branches:
      - feat/global-finishes-stone-mobile-pip
    paths:
      - .github/workflows/implement-plinth-structure-temp.yml

permissions:
  contents: write

jobs:
  patch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-finishes-stone-mobile-pip
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Apply measured patch
        run: python ops/tmp-implement-plinth-structure.py

      - name: Rebuild stone masks and runtime data
        run: |
          set -euo pipefail
          python tools/build_stone_surface_masks.py --output-dir review-assets/stone-masks/generated
          rm -rf /tmp/stone-runtime
          python tools/build_approved_stone.py --output-dir /tmp/stone-runtime
          cp /tmp/stone-runtime/stone-data.js app/data/stone-data.js

      - name: Rebuild structural and inline masks
        working-directory: app
        run: |
          npm run build:structure-masks
          npm run build:inline-masks

      - name: Syntax and deterministic core gates
        run: |
          node --check app/app.js
          node --check app/core/stone.js
          node --check app/core/finishes.js
          python -m unittest tests/test_stone_surface_masks.py
          cd app
          npm test

      - name: Verify expanded plinth covers owner alpha in canonical band
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          root=Path(".")
          cfg=json.loads((root/"review-assets/stone-masks/config.json").read_text())
          for asset in cfg["assets"]:
              group=cfg["groups"][asset["group"]]
              poly=group["surfaces"]["plinth"]
              y0=min(p[1] for p in poly);y1=max(p[1] for p in poly)+1
              owner=Image.open(root/asset["path"]).convert("RGBA").getchannel("A")
              mask=Image.open(root/f"review-assets/stone-masks/generated/{asset['id']}-plinth.png").convert("L")
              band=Image.new("L",owner.size)
              ImageDraw.Draw(band).rectangle((0,y0,owner.width-1,y1-1),fill=255)
              owner_band=ImageChops.multiply(owner,band)
              missed=ImageChops.subtract(owner_band,mask)
              significant=missed.point(lambda v:255 if v>=96 else 0)
              significant_pixels=sum(significant.histogram()[1:])
              owner_pixels=sum(owner_band.histogram()[1:])
              print(asset["id"],"owner",owner_pixels,"significantMiss",significant_pixels,"bbox",significant.getbbox())
              if significant_pixels>50:
                  raise SystemExit(f"PLINTH_OWNER_ALPHA_SIGNIFICANT_MISS:{asset['id']}:{significant_pixels}:{significant.getbbox()}")
          print("PLINTH_OWNER_ALPHA_COVERAGE PASS")
          PY

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Browser material and seam gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/review
          python -m http.server 4173 --directory app >/tmp/mobili-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          cp ops/tmp-plinth-structure-gate.cjs /tmp/pw/gate.cjs
          cd /tmp/pw
          node gate.cjs

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: plinth-structure-review
          path: /tmp/review
          if-no-files-found: error

      - name: Commit implementation with CAS and cleanup
        env:
          TARGET_BRANCH: feat/global-finishes-stone-mobile-pip
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/implement-plinth-structure-temp.yml
          git rm ops/tmp-implement-plinth-structure.py ops/tmp-plinth-structure-gate.cjs

          git add             review-assets/stone-masks/config.json             review-assets/stone-masks/generated             tools/build_approved_stone.py             app/core/stone.js             app/tools/build-structure-masks.py             app/tools/build-inline-masks.py             app/tools/validate-material-metrics.py             app/package.json             app/data/catalog-data.js             app/data/mask-data.js             app/data/stone-data.js             app/assets/kitchen/masks             app/core/finishes.js             app/app.js             app/styles.css             app/tools/test-core.js             docs/work/global-materials-mobile-pip-backlog.md

          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          allowed_prefixes=(
            ".github/workflows/implement-plinth-structure-temp.yml",
            "ops/tmp-implement-plinth-structure.py",
            "ops/tmp-plinth-structure-gate.cjs",
            "review-assets/stone-masks/",
            "tools/build_approved_stone.py",
            "app/core/stone.js",
            "app/tools/build-structure-masks.py",
            "app/tools/build-inline-masks.py",
            "app/tools/validate-material-metrics.py",
            "app/package.json",
            "app/data/catalog-data.js",
            "app/data/mask-data.js",
            "app/data/stone-data.js",
            "app/assets/kitchen/masks/structure-",
            "app/core/finishes.js",
            "app/app.js",
            "app/styles.css",
            "app/tools/test-core.js",
            "docs/work/global-materials-mobile-pip-backlog.md",
          )
          bad=[p for p in paths if not any(p==a or p.startswith(a) for a in allowed_prefixes)]
          if bad: raise SystemExit("UNEXPECTED_STAGED:"+",".join(bad))
          required=[
            "review-assets/stone-masks/config.json",
            "tools/build_approved_stone.py",
            "app/core/stone.js",
            "app/tools/build-structure-masks.py",
            "app/tools/validate-material-metrics.py",
            "app/data/stone-data.js",
            "app/core/finishes.js",
            "app/app.js",
            "app/styles.css",
            "docs/work/global-materials-mobile-pip-backlog.md",
          ]
          missing=[p for p in required if p not in paths]
          if missing: raise SystemExit("EXPECTED_CHANGE_MISSING:"+",".join(missing))
          print("STAGED",paths)
          PY

          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "fix: complete plinth geometry and adaptive front structure"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
          echo "PLINTH_STRUCTURE_RESULT=$result"
