name: Viewer base-price publication contract (no Netlify deploy)
on:
  push:
    branches: [feature/viewer-base-prices-global-off-20261021]
  workflow_dispatch:
jobs:
  price-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/viewer-base-price-publication.test.cjs tests/viewer-price-v5-save.test.cjs
      - run: node app/tools/test-administration-v5.js && node app/tools/test-v5-normal-save.js && node app/tools/test-v5-endpoint-safety.js
      - run: node --check app/core/administration-v5.js && node --check app/core/public-module-projection.js && node --check netlify/functions/public-modules.mjs && node --check app/viewer/public-data.js && node --check app/viewer/scene-adapters.js && node --check app/viewer/viewer.js
      - run: npm install --no-audit --no-fund
      - run: npm run build
