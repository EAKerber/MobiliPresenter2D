name: Development CP-PUBLIC-03a exact auxiliary retirement (one-shot)

on:
  push:
    branches:
      - development
    paths:
      - 'tools/development_access_dto_aux_retire.py'
      - 'tests/test_development_access_dto_aux_retire.py'
      - '.github/workflows/development-access-dto-aux-retire.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: m2d-access-dto-exact-aux-one-shot
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Denial and roster tests
        run: python3 -m unittest tests/test_development_access_dto_aux_retire.py
      - name: SHA pinned read-only audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/development_access_dto_aux_retire.py --mode audit
      - uses: actions/upload-artifact@v4
        with:
          name: access-dto-aux-audit-${{ github.run_id }}
          path: access-dto-aux-retirement-receipt.json
          retention-days: 30

  apply:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire exactly one ancestor ref with SHA lease and readback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/development_access_dto_aux_retire.py --mode apply
      - uses: actions/upload-artifact@v4
        with:
          name: access-dto-aux-apply-${{ github.run_id }}
          path: access-dto-aux-retirement-receipt.json
          retention-days: 30
