name: Research BMC01 antialiased completion temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc01-antialiased-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Build current variant manifest
        run: node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/current-variants.json
      - name: Test and run antialiased completion
        run: |
          python -m py_compile tools/research_bmc01_antialiased_completion.py
          python -m unittest tests/test_research_bmc01_antialiased_completion.py
          rm -rf review-assets/research/bmc01-antialiased-completion-v0.1
          python tools/research_bmc01_antialiased_completion.py             --config review-assets/research/bmc01-antialiased-completion-v0.1.json             --variant-manifest /tmp/current-variants.json             --output-dir review-assets/research/bmc01-antialiased-completion-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: bmc01-antialiased-review
          path: review-assets/research/bmc01-antialiased-completion-v0.1
          if-no-files-found: error
      - name: Commit candidate and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc01-antialiased-temp.yml
          git add review-assets/research/bmc01-antialiased-completion-v0.1
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize antialiased BMC-01 completion"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
