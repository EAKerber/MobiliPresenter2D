name: Integrate module02 side temp
on:
  push:
    branches: [fix/module-02-exposed-right-face]
    paths:
      - '.github/workflows/integrate-module02-side-temp.yml'
      - 'app/tools/update-technical-data.py'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Freeze pre-promotion source manifest and verify source pixels
        run: |
          set -euo pipefail
          mkdir -p /tmp/module02-side-source/variants
          node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/module02-side-source/manifest.json
          python tools/render_variant_fidelity.py --manifest /tmp/module02-side-source/manifest.json --output-dir /tmp/module02-side-source/variants
          actual="$(sha256sum /tmp/module02-side-source/variants/module-03-hidden.png | cut -d' ' -f1)"
          expected='f502790c76afe612563958ca3acfcc7d653018d718d11d852ed3a45df553ecfa'
          test "$actual" = "$expected" || { echo "SOURCE_FRAME_DRIFT:${actual}!=${expected}" >&2; exit 2; }
          cp /tmp/module02-side-source/manifest.json review-assets/calibration/module-02-right-face-v1/source-variant-manifest.json
      - name: Bind recipe and calibration to historical source snapshot
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          snapshot='review-assets/calibration/module-02-right-face-v1/source-variant-manifest.json'
          recipe_path=Path('review-assets/recipes/module-02-exposed-right-side-v1.json')
          recipe=json.loads(recipe_path.read_text())
          if snapshot not in recipe['sourceReferences']:
              recipe['sourceReferences'].append(snapshot)
          recipe['sourceVariantManifest']=snapshot
          recipe_path.write_text(json.dumps(recipe,ensure_ascii=False,indent=2)+'\n')
          config_path=Path('review-assets/calibration/module-02-right-face-v1/config.json')
          config=json.loads(config_path.read_text())
          config['sourceFrame']['sourceSnapshotHeadSha']=os.environ['SOURCE_HEAD']
          config['sourceFrame']['variantManifest']=snapshot
          config['measuredAnchors']={
              'frontEdgeX':742,
              'stoneExposedEdge':{'back':[763,525],'front':[742,586],'dx':-21,'dy':61},
              'counterFrontY':586,
              'cabinetFrontBottomY':857,
              'floorContactY':898
          }
          config['authoring']['authorizedRoi']=[742,520,764,899]
          config['authoring']['hypothesisSupportPolygon']=[[742,586],[763,525],[763,796],[742,857]]
          config['candidate']={
              'id':'module-02-exposed-right-side-v1',
              'imageSha256':'3becbf8a510dd76757593ed5c227482edef7af57c48877e9d2e714398e77fff8',
              'changedPixelCount':1910,
              'differenceBounds':[755,525,764,815],
              'protectedLayerOverlapPixels':0,
              'outsideAuthorizedRoiChangedPixelCount':0,
              'roundtripMismatchPixelCount':0,
              'visualReview':'AGENT_PASS',
              'humanReview':'PENDING'
          }
          config['evidenceStatus']['frontEdge']='measured-from-visible-pixels'
          config['evidenceStatus']['stoneEdge']='measured-from-visible-pixels'
          config['evidenceStatus']['backEdge']='geometric-hypothesis-from-exposed-stone-depth; agent-visual-review-pass; human-review-pending'
          config['evidenceStatus']['approval']='HUMAN_REVIEW_PENDING'
          config_path.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Re-materialize candidate against frozen source snapshot
        run: |
          rm -rf review-assets/candidates/module-02-exposed-right-side-v1
          python tools/materialize_perspective_donor_recipe.py \
            --recipe review-assets/recipes/module-02-exposed-right-side-v1.json \
            --source-frame /tmp/module02-side-source/variants/module-03-hidden.png \
            --variant-manifest review-assets/calibration/module-02-right-face-v1/source-variant-manifest.json \
            --output-dir review-assets/candidates/module-02-exposed-right-side-v1
          cp review-assets/candidates/module-02-exposed-right-side-v1/candidate.png app/assets/kitchen/overlays/module-02-right-exposed-face.png
          cmp --silent review-assets/candidates/module-02-exposed-right-side-v1/candidate.png app/assets/kitchen/overlays/module-02-right-exposed-face.png
          python tools/validate_candidate_assets.py --output /tmp/module02-side-intake.json
          python tools/validate_authoring_provenance.py --output /tmp/module02-side-provenance.json
      - name: Integrate overlay entity and visibility expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          scene_path=Path('app/data/scene-data.js')
          scene=scene_path.read_text()
          visible_needle='        "stone-02-joint-bridge",\n        "stone-03-joint-bridge",'
          visible_repl='        "stone-02-joint-bridge",\n        "module-02-right-exposed-face",\n        "stone-03-joint-bridge",'
          if visible_needle not in scene: raise SystemExit('SCENE_VISIBLE_INSERTION_POINT_MISSING')
          scene=scene.replace(visible_needle,visible_repl,1)
          entity_needle='''      {\n        id: "stone-03-joint-bridge",'''
          entity_block='''      {\n        id: "module-02-right-exposed-face",\n        alias: "02L",\n        label: "Lateral direita exposta do módulo 02",\n        kind: "accessory",\n        zIndex: 203,\n        asset: "assets/kitchen/overlays/module-02-right-exposed-face.png",\n        maskAsset: null,\n        alphaBounds: { x: 755, y: 525, width: 9, height: 290 },\n        defaultVisible: true,\n        controllable: false,\n        hostId: "module-02",\n        occludedByIds: ["module-03"],\n        finishGroups: [],\n        tags: ["exposed-side", "carcass-side", "cooking-zone"]\n      },\n      {\n        id: "stone-03-joint-bridge",'''
          if entity_needle not in scene: raise SystemExit('SCENE_ENTITY_INSERTION_POINT_MISSING')
          scene=scene.replace(entity_needle,entity_block,1)
          scene_path.write_text(scene)
          cases_path=Path('reference/variant-cases.json')
          doc=json.loads(cases_path.read_text())
          reasons={'default':'occluded','module-02-hidden':'host-hidden','module-03-hidden':'visible','modules-02-03-hidden':'host-hidden'}
          for case in doc['cases']:
              case['expectedVisibilityReasons']['module-02-right-exposed-face']=reasons[case['id']]
          cases_path.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Extend runtime and browser regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          core_path=Path('app/tools/test-core.js')
          text=core_path.read_text()
          text=text.replace('assert.equal(scene.entities.length,16);','assert.equal(scene.entities.length,17);',1)
          text=text.replace('assert.equal(visibility.resolveVisibility(scene,initial)["stone-03-joint-bridge"].visible,true);','assert.equal(visibility.resolveVisibility(scene,initial)["stone-03-joint-bridge"].visible,true);\nassert.equal(visibility.resolveVisibility(scene,initial)["module-02-right-exposed-face"].reason,"occluded");',1)
          text=text.replace('assert.equal(r["stone-03-joint-bridge"].reason,"host-hidden");\nassert.equal(visibility.getVisibleEntities(scene,initial).length,10);','assert.equal(r["stone-03-joint-bridge"].reason,"host-hidden");\nassert.equal(r["module-02-right-exposed-face"].reason,"visible");\nassert.equal(visibility.getVisibleEntities(scene,initial).length,11);',1)
          text=text.replace('assert.equal(r["stone-03-joint-bridge"].reason,"visible");\nassert.equal(visibility.getVisibleEntities(scene,initial).length,12);','assert.equal(r["stone-03-joint-bridge"].reason,"visible");\nassert.equal(r["module-02-right-exposed-face"].reason,"host-hidden");\nassert.equal(visibility.getVisibleEntities(scene,initial).length,12);',1)
          text=text.replace('entities:16,controllableEntities:8','entities:17,controllableEntities:8',1)
          core_path.write_text(text)
          browser_path=Path('tests/stone-browser.cjs')
          browser=browser_path.read_text()
          needle="""    assert.equal(visible['stone-03-joint-bridge'].visible,b);\n    assert.equal(visible['faucet-approved'].visible,b);"""
          repl="""    assert.equal(visible['stone-03-joint-bridge'].visible,b);\n    const exposedSide = visible['module-02-right-exposed-face'];\n    assert.equal(exposedSide.visible,a && !b);\n    assert.equal(exposedSide.reason,!a?'host-hidden':(b?'occluded':'visible'));\n    const exposedSideLayer = page.locator('[data-entity-id=\"module-02-right-exposed-face\"]');\n    assert.equal(await exposedSideLayer.getAttribute('aria-hidden'),String(!(a && !b)));\n    assert.equal(visible['faucet-approved'].visible,b);"""
          if needle not in browser: raise SystemExit('BROWSER_INSERTION_POINT_MISSING')
          browser=browser.replace(needle,repl,1)
          browser_path.write_text(browser)
          PY
      - name: Regenerate technical data and baseline
        run: |
          (cd app && npm run build:technical-data)
          python tools/refresh-baseline-manifest.py
          python tools/validate-baseline.py
      - name: Run runtime and candidate regression gates
        run: |
          (cd app && npm test)
          python -m unittest tests/test_candidate_asset_gates.py tests/test_candidate_authoring_provenance.py tests/test_candidate_delta_authoring.py
          mkdir -p /tmp/module02-side-post/variants
          node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/module02-side-post/manifest.json
          python tools/render_variant_fidelity.py --manifest /tmp/module02-side-post/manifest.json --output-dir /tmp/module02-side-post/variants
          python - <<'PY'
          import json
          manifest=json.load(open('/tmp/module02-side-post/manifest.json'))
          case=next(item for item in manifest['cases'] if item['id']=='module-03-hidden')
          print(json.dumps({'module03HiddenFingerprintAfterIntegration':case['fingerprint'],'visibleEntityIds':[e['id'] for e in case['visibleEntities']]},sort_keys=True))
          PY
      - name: Commit integrated runtime slice with CAS readback
        shell: bash
        env:
          TARGET_BRANCH: fix/module-02-exposed-right-face
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf tools/__pycache__ tests/__pycache__
          git restore app/reports 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/scene-data.js app/data/technical-data.json app/tools/test-core.js tests/stone-browser.cjs reference/variant-cases.json reference/baseline-manifest.json review-assets/calibration/module-02-right-face-v1/config.json review-assets/calibration/module-02-right-face-v1/source-variant-manifest.json review-assets/recipes/module-02-exposed-right-side-v1.json review-assets/candidates/module-02-exposed-right-side-v1 app/assets/kitchen/overlays/module-02-right-exposed-face.png
          git rm .github/workflows/integrate-module02-side-temp.yml
          unexpected="$(git status --short | grep -Ev '^(M  |A  |D  )' || true)"
          if [ -n "$unexpected" ]; then echo "UNEXPECTED_STATUS:$unexpected" >&2; exit 2; fi
          allowed='^(app/data/scene-data\.js|app/data/technical-data\.json|app/tools/test-core\.js|tests/stone-browser\.cjs|reference/variant-cases\.json|reference/baseline-manifest\.json|review-assets/calibration/module-02-right-face-v1/config\.json|review-assets/calibration/module-02-right-face-v1/source-variant-manifest\.json|review-assets/recipes/module-02-exposed-right-side-v1\.json|review-assets/candidates/module-02-exposed-right-side-v1/|app/assets/kitchen/overlays/module-02-right-exposed-face\.png|\.github/workflows/integrate-module02-side-temp\.yml)'
          bad="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then echo "UNEXPECTED_STAGED_PATHS:$bad" >&2; exit 2; fi
          git commit -m 'Scene: integrate protected module-02 exposed side [module02-side-integrated]'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then echo "TARGET_HEAD_DRIFT:${remote_before}!=${EXPECTED_HEAD}" >&2; exit 2; fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_after" != "$candidate_sha" ]; then echo "TARGET_READBACK_FAILED:${remote_after}!=${candidate_sha}" >&2; exit 2; fi
          echo "MODULE02_SIDE_INTEGRATION_RECEIPT base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"
