name: Discover plinth and seam behavior temp

on:
  push:
    branches:
      - feat/global-finishes-stone-mobile-pip
    paths:
      - .github/workflows/discover-plinth-seams-temp.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-finishes-stone-mobile-pip
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Run discovery
        run: python ops/tmp-discover-plinth-seams.py

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: plinth-seam-discovery
          path: /tmp/material-discovery
          if-no-files-found: error

      - name: Cleanup one-shot scaffolding with CAS
        env:
          TARGET_BRANCH: feat/global-finishes-stone-mobile-pip
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/discover-plinth-seams-temp.yml ops/tmp-discover-plinth-seams.py
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "chore: complete plinth and seam discovery"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
