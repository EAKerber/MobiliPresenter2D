name: Historical R0 contract replay

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Historical commit, tag or branch whose exact R0 contract should be replayed
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Historical R0 exact contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Compile historical validation tooling
        run: python -m py_compile tools/check-r0-contract.py tools/inventory-baseline-source.py tools/validate-baseline.py
      - name: Replay R0 state
        run: python tools/check-r0-contract.py
