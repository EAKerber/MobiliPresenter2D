name: R0 contract

on:
  push:
    branches:
      - work/r0-baseline-freeze
  pull_request:
    paths:
      - 'reference/**'
      - 'tools/**'
      - 'docs/work/r0-baseline-freeze.md'
      - '.github/workflows/r0-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: R0 contract (baseline may be blocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Compile tooling
        run: python -m py_compile tools/check-r0-contract.py tools/inventory-baseline-source.py tools/validate-baseline.py
      - name: Check R0 state
        run: python tools/check-r0-contract.py
