name: Module05 user-approved contour
on:
  push:
    branches: [audit/boundary-forensics]
    paths:
      - 'tools/finalize-module05-user-mask.py'
      - '.github/workflows/module05-user-mask.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python tools/finalize-module05-user-mask.py
      - uses: actions/upload-artifact@v4
        with:
          name: module05-user-approved-contour
          path: module05-user-mask-output/
