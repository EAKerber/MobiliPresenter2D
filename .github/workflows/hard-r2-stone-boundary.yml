name: Hard r2 stone boundary
on:
  push:
    branches: [audit/boundary-forensics]
    paths:
      - 'tools/audit-hard-r2-and-stone-boundary.py'
      - '.github/workflows/hard-r2-stone-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python tools/audit-hard-r2-and-stone-boundary.py
      - uses: actions/upload-artifact@v4
        with:
          name: hard-r2-stone-boundary
          path: hard-r2-stone-boundary-output/
          if-no-files-found: error
