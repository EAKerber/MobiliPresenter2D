name: Research BMC01 v04 review artifact temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc01-v04-artifact-temp.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - name: Package review images
        run: |
          mkdir -p /tmp/bmc01-v04/v02 /tmp/bmc01-v04/v03 /tmp/bmc01-v04/v04
          cp review-assets/research/bmc01-minimal-completion-v0.2/{comparison.png,candidate.png,edited.png,report.json} /tmp/bmc01-v04/v02/
          cp review-assets/research/bmc01-minimal-completion-v0.3/{comparison.png,candidate.png,edited.png,report.json} /tmp/bmc01-v04/v03/
          cp review-assets/research/bmc01-minimal-completion-v0.4/{comparison.png,candidate.png,edited.png,report.json} /tmp/bmc01-v04/v04/
      - uses: actions/upload-artifact@v4
        with:
          name: bmc01-v04-review
          path: /tmp/bmc01-v04
          if-no-files-found: error
      - name: Self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc01-v04-artifact-temp.yml
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "chore: self-clean BMC-01 v04 review artifact workflow"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
