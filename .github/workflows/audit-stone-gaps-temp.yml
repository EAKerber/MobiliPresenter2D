name: Audit stone support gaps temp
on:
  push:
    branches: [audit/module02-finish-mask]
    paths: ['.github/workflows/audit-stone-gaps-temp.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements.txt
      - name: Rebuild canonical approved stone states
        run: |
          mkdir -p /tmp/stone-gap-audit/variants /tmp/stone-gap-audit/approved
          node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/stone-gap-audit/variant-manifest.json
          python tools/render_variant_fidelity.py --manifest /tmp/stone-gap-audit/variant-manifest.json --output-dir /tmp/stone-gap-audit/variants
          python tools/validate_approved_stone.py --manifest /tmp/stone-gap-audit/variant-manifest.json --output-dir /tmp/stone-gap-audit/approved
      - name: Measure host-only residue under graphite and light stone
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw
          import json
          root=Path('.')
          out=Path('/tmp/stone-gap-audit')
          cfg=json.loads((root/'review-assets/stone-masks/config.json').read_text())
          size=tuple(cfg['canvas'])
          def poly(polys):
              m=Image.new('L',size,0); d=ImageDraw.Draw(m)
              for p in polys:d.polygon(p,fill=255)
              return m
          def binary(im):return im.point(lambda v:255 if v else 0)
          def count(im):return sum(1 for v in im.getdata() if v)
          def response(case, support, color):
              before=Image.open(out/'approved'/f'{case}.png').convert('RGB')
              after=Image.open(out/'approved'/case/f'{color}.png').convert('RGB')
              bands=ImageChops.difference(before,after).split()
              diff=ImageChops.lighter(ImageChops.lighter(bands[0],bands[1]),bands[2])
              supported=ImageChops.multiply(binary(diff),support)
              values=[]; dp=diff.load(); sp=support.load(); bb=support.getbbox()
              if bb:
                  for y in range(bb[1],bb[3]):
                      for x in range(bb[0],bb[2]):
                          if sp[x,y]:values.append(dp[x,y])
              return {
                  'supportPixels':count(support),'changedPixels':count(supported),
                  'unchangedPixels':count(support)-count(supported),
                  'maxDelta':max(values) if values else 0,
                  'meanDelta':round(sum(values)/len(values),3) if values else 0,
              }
          records=[]
          cases={'stone-02':'module-03-hidden','stone-03':'module-02-hidden'}
          for group,case in cases.items():
              surfaces=poly(cfg['groups'][group]['surfaces'].values())
              plinth=poly([cfg['groups'][group]['surfaces']['plinth']])
              group_alpha=Image.new('L',size,0); bridge=None
              for asset in cfg['assets']:
                  if asset['group']!=group:continue
                  alpha=binary(Image.open(root/asset['path']).convert('RGBA').getchannel('A'))
                  group_alpha=ImageChops.lighter(group_alpha,alpha)
                  if asset['id'].endswith('bridge'): bridge=alpha
              bridge_residual=ImageChops.multiply(bridge,ImageChops.invert(surfaces))
              plinth_envelope=Image.new('L',size,0)
              x0=480 if group=='stone-02' else 730; x1=770 if group=='stone-02' else 1225
              ImageDraw.Draw(plinth_envelope).rectangle((x0,850,x1,915),fill=255)
              plinth_residual=ImageChops.multiply(ImageChops.multiply(group_alpha,plinth_envelope),ImageChops.invert(plinth))
              records.append({
                  'group':group,'case':case,
                  'bridgeResidualBounds':list(bridge_residual.getbbox()) if bridge_residual.getbbox() else None,
                  'bridgeGraphite':response(case,bridge_residual,'graphite'),
                  'bridgeLight':response(case,bridge_residual,'light'),
                  'plinthResidualBounds':list(plinth_residual.getbbox()) if plinth_residual.getbbox() else None,
                  'plinthGraphite':response(case,plinth_residual,'graphite'),
                  'plinthLight':response(case,plinth_residual,'light'),
              })
              before=Image.open(out/'approved'/f'{case}.png').convert('RGB')
              graphite=Image.open(out/'approved'/case/'graphite.png').convert('RGB')
              light=Image.open(out/'approved'/case/'light.png').convert('RGB')
              crop=(470,480,780,925) if group=='stone-02' else (720,430,1230,925)
              ims=[im.crop(crop) for im in (before,graphite,light)]
              sheet=Image.new('RGB',(ims[0].width*3,ims[0].height),'white')
              for i,im in enumerate(ims):sheet.paste(im,(i*ims[0].width,0))
              sheet.save(out/f'{group}-host-only-original-graphite-light.png')
          (out/'residue-response.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps(records,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stone-residue-light-review
          path: |
            /tmp/stone-gap-audit/residue-response.json
            /tmp/stone-gap-audit/stone-02-host-only-original-graphite-light.png
            /tmp/stone-gap-audit/stone-03-host-only-original-graphite-light.png
