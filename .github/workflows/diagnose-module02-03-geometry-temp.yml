name: Diagnose module02-03 geometry temp

on:
  push:
    branches: [fix/module02-03-geometry-seams]
    paths: ['.github/workflows/diagnose-module02-03-geometry-temp.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tooling
        run: |
          python -m pip install -r tools/requirements.txt
          npm install --prefix /tmp/m23-browser --no-audit --no-fund playwright@1.62.1
          /tmp/m23-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build pixel diagnostics
        run: |
          mkdir -p /tmp/m23-review
          python - <<'PY'
          from PIL import Image, ImageChops, ImageDraw
          from pathlib import Path
          import json
          root=Path('app')
          out=Path('/tmp/m23-review')
          crop=(450,420,830,930)
          layer2=Image.open(root/'assets/kitchen/layers/02_inferior_fogao.png').convert('RGBA')
          mask2=Image.open(root/'assets/kitchen/masks/02.png').convert('RGBA').getchannel('A')
          layer3=Image.open(root/'assets/kitchen/layers/03_inferior_pia.png').convert('RGBA')
          mask3=Image.open(root/'assets/kitchen/masks/03.png').convert('RGBA').getchannel('A')
          def count(im): return sum(1 for v in im.get_flattened_data() if v)
          def diag(layer,mask,name):
              alpha=layer.getchannel('A')
              masked=Image.new('RGBA', layer.size, (0,0,0,0))
              # visible layer underlay
              under=layer.copy()
              under.putalpha(alpha.point(lambda v: 150 if v else 0))
              masked.alpha_composite(under)
              d=ImageDraw.Draw(masked)
              # mask support red
              red=Image.new('RGBA',layer.size,(255,0,0,0)); red.putalpha(mask.point(lambda v: 110 if v else 0)); masked.alpha_composite(red)
              # host alpha outside mask blue
              missing=ImageChops.subtract(alpha,mask)
              blue=Image.new('RGBA',layer.size,(0,140,255,0)); blue.putalpha(missing.point(lambda v: 210 if v else 0)); masked.alpha_composite(blue)
              # mask outside host yellow
              outside=ImageChops.subtract(mask,alpha)
              yellow=Image.new('RGBA',layer.size,(255,210,0,0)); yellow.putalpha(outside.point(lambda v: 240 if v else 0)); masked.alpha_composite(yellow)
              masked.crop(crop).resize(((crop[2]-crop[0])*2,(crop[3]-crop[1])*2),Image.Resampling.NEAREST).save(out/f'{name}-mask-diagnostic-2x.png')
              return {'maskPixels':count(mask),'hostPixels':count(alpha),'hostOutsideMaskPixels':count(missing),'maskOutsideHostPixels':count(outside),'maskBounds':list(mask.getbbox()) if mask.getbbox() else None,'hostBounds':list(alpha.getbbox()) if alpha.getbbox() else None}
          report={'module02':diag(layer2,mask2,'module02'),'module03':diag(layer3,mask3,'module03')}
          for p in ['assets/kitchen/variants/stone-02-cozinha-exposed-right.png','assets/kitchen/bridges/stone-02-joint-bridge.png','assets/kitchen/variants/stone-03-pia-exposed-left.png','assets/kitchen/bridges/stone-03-joint-bridge.png','assets/kitchen/overlays/module-02-right-exposed-face.png']:
              im=Image.open(root/p).convert('RGBA'); a=im.getchannel('A'); report[p]={'pixels':count(a),'bounds':list(a.getbbox()) if a.getbbox() else None}
          (out/'pixel-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Capture browser state matrix
        env:
          NODE_PATH: /tmp/m23-browser/node_modules
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const {pathToFileURL}=require('node:url');
          const {chromium}=require('playwright');
          (async()=>{
            const out='/tmp/m23-review';
            const browser=await chromium.launch({headless:true});
            const states=[
              ['both',true,true],['only02',true,false],['only03',false,true],['none',false,false]
            ];
            const finishes=[['original',null],['black','Aplicar Preto'],['white','Aplicar Branco TX'],['olive','Aplicar Verde oliva']];
            for(const [state,m2,m3] of states){
              for(const [finish,label] of finishes){
                const page=await browser.newPage({viewport:{width:1536,height:1100}});
                await page.goto(pathToFileURL(path.resolve('app/index.html')).href);
                await page.evaluate(()=>Promise.all(Array.from(document.images,i=>i.decode())));
                await page.locator('[data-module-toggle="module-02"]').setChecked(m2);
                await page.locator('[data-module-toggle="module-03"]').setChecked(m3);
                if(label) await page.getByRole('button',{name:label,exact:true}).click();
                const viewer=page.locator('#viewer');
                await viewer.screenshot({path:`${out}/${state}-${finish}.png`,animations:'disabled'});
                const layers=await page.evaluate(()=>Object.fromEntries([...document.querySelectorAll('.layer-group')].filter(x=>['stone-02-joint-bridge','stone-03-joint-bridge','module-02-right-exposed-face','module-02','module-03'].includes(x.dataset.entityId)).map(x=>[x.dataset.entityId,{hidden:x.classList.contains('is-hidden'),reason:x.dataset.visibilityReason,mask:x.querySelector('.finish-layer')?.dataset.maskAsset||null}])));
                fs.writeFileSync(`${out}/${state}-${finish}.json`,JSON.stringify(layers,null,2));
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          out=Path('/tmp/m23-review'); crop=(430,390,850,940)
          for p in out.glob('*.png'):
              if 'diagnostic' in p.name: continue
              im=Image.open(p).convert('RGB')
              im.crop(crop).resize(((crop[2]-crop[0])*2,(crop[3]-crop[1])*2),Image.Resampling.LANCZOS).save(out/(p.stem+'-crop2x.png'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: module02-03-geometry-diagnostic
          path: /tmp/m23-review
