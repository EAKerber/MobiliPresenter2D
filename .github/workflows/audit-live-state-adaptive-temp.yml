name: Audit live state adaptive temp

on:
  push:
    branches: [audit/live-state-2026-09-17]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_URL: https://mobilipresenter2d.netlify.app
      TARGET_BRANCH: audit/live-state-2026-09-17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Archive live runtime and compare with main tree
        run: |
          mkdir -p /tmp/live-audit/live-files /tmp/live-audit/diffs
          python - <<'PY'
          import hashlib, json, pathlib, re, urllib.request, difflib
          root=pathlib.Path('app')
          base='https://mobilipresenter2d.netlify.app/'
          paths={'index.html','app.js','styles.css'}
          for pat in ('core/*.js','data/*.js','data/*.json'):
              paths.update(p.relative_to(root).as_posix() for p in root.glob(pat) if p.is_file())
          blob='\n'.join((root/p).read_text(encoding='utf-8',errors='replace') for p in sorted(paths) if (root/p).exists())
          for m in re.finditer(r'''["'](assets/[^"']+)["']''',blob): paths.add(m.group(1))
          rows=[]
          for rel in sorted(paths):
              lp=root/rel
              if not lp.is_file(): continue
              try:
                  req=urllib.request.Request(base+rel,headers={'Cache-Control':'no-cache','User-Agent':'MobiliPresenter2D-live-audit'})
                  with urllib.request.urlopen(req,timeout=30) as r: rb=r.read(); status=r.status
              except Exception as e:
                  rows.append({'path':rel,'fetchError':repr(e)}); continue
              lb=lp.read_bytes(); same=hashlib.sha256(lb).digest()==hashlib.sha256(rb).digest()
              rec={'path':rel,'status':status,'same':same,'localBytes':len(lb),'liveBytes':len(rb),'localSha256':hashlib.sha256(lb).hexdigest(),'liveSha256':hashlib.sha256(rb).hexdigest()}
              rows.append(rec)
              if not same:
                  dest=pathlib.Path('/tmp/live-audit/live-files')/rel
                  dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(rb)
                  if lp.suffix.lower() in {'.js','.json','.html','.css','.md'}:
                      try:
                          a=lb.decode('utf-8').splitlines(True); b=rb.decode('utf-8').splitlines(True)
                          diff=''.join(difflib.unified_diff(a,b,fromfile='main/'+rel,tofile='live/'+rel,n=4))
                          d=pathlib.Path('/tmp/live-audit/diffs')/(rel.replace('/','__')+'.diff'); d.write_text(diff,encoding='utf-8')
                      except Exception as e: rec['diffError']=repr(e)
          out={'target':base,'checked':len(rows),'different':[r['path'] for r in rows if r.get('same') is False],'fetchErrors':[r['path'] for r in rows if 'fetchError' in r],'files':rows}
          pathlib.Path('/tmp/live-audit/byte-compare.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'checked':out['checked'],'different':out['different'],'fetchErrors':out['fetchErrors']},indent=2,ensure_ascii=False))
          PY

      - name: Install isolated Chromium tooling
        run: |
          npm install --prefix /tmp/live-browser-tools --no-audit --no-fund playwright@1.62.1
          /tmp/live-browser-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Capture and exercise live production adaptively
        env:
          NODE_PATH: /tmp/live-browser-tools/node_modules
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          const path=require('path');
          const OUT='/tmp/live-audit';
          const URL='https://mobilipresenter2d.netlify.app';
          fs.mkdirSync(OUT,{recursive:true});
          function safeName(s){return String(s).replace(/[^a-z0-9_-]+/gi,'-').replace(/^-+|-+$/g,'').slice(0,80)||'capture'}
          async function inventory(page){
            return await page.evaluate(()=>{
              const labelFor=(el)=>{if(el.id){const x=document.querySelector(`label[for="${CSS.escape(el.id)}"]`);if(x)return x.innerText.trim()} return el.closest('label')?.innerText.trim()||''};
              const all=[...document.querySelectorAll('*')];
              return {
                href:location.href,title:document.title,
                bodyText:document.body.innerText,
                fingerprint:document.body.dataset.sceneFingerprint||window.CASA_EM_MODULOS_CURRENT_FINGERPRINT||null,
                viewport:{w:innerWidth,h:innerHeight,dpr:devicePixelRatio,scrollX,scrollY},
                documentSize:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight,clientW:document.documentElement.clientWidth,clientH:document.documentElement.clientHeight},
                headings:[...document.querySelectorAll('h1,h2,h3,h4')].map(e=>({tag:e.tagName,text:e.innerText.trim()})),
                buttons:[...document.querySelectorAll('button')].map((e,i)=>({i,id:e.id,text:e.innerText.trim(),title:e.title,aria:e.getAttribute('aria-label'),pressed:e.getAttribute('aria-pressed'),disabled:e.disabled,classes:String(e.className),dataset:{...e.dataset}})),
                inputs:[...document.querySelectorAll('input')].map((e,i)=>({i,id:e.id,type:e.type,name:e.name,value:e.value,checked:e.checked,aria:e.getAttribute('aria-label'),label:labelFor(e),classes:String(e.className),dataset:{...e.dataset}})),
                links:[...document.querySelectorAll('a')].map((e,i)=>({i,text:e.innerText.trim(),href:e.href,aria:e.getAttribute('aria-label')})),
                dialogs:[...document.querySelectorAll('[role=dialog],dialog')].map(e=>({open:e.open??true,text:e.innerText.trim().slice(0,1000),classes:String(e.className)})),
                stickyFixed:all.map(e=>{const s=getComputedStyle(e);if(!['fixed','sticky'].includes(s.position))return null;const r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,classes:String(e.className),position:s.position,top:s.top,bottom:s.bottom,x:r.x,y:r.y,w:r.width,h:r.height,text:(e.innerText||'').trim().slice(0,180)}}).filter(Boolean),
                scene:window.CASA_EM_MODULOS_DEBUG?.scene||window.CASA_EM_MODULOS_SCENE||null,
                state:window.CASA_EM_MODULOS_DEBUG?.getState?.()||null,
                visibility:window.CASA_EM_MODULOS_DEBUG?.getVisibility?.()||null,
                scripts:[...document.scripts].map(e=>e.src||'[inline]'),
                styles:[...document.styleSheets].map(s=>s.href||'[inline]')
              }
            });
          }
          async function shot(page,name,full=true){await page.screenshot({path:path.join(OUT,safeName(name)+'.png'),fullPage:full});}
          async function toggleModule(page,id,visible){
            return await page.evaluate(({id,visible})=>{
              const selectors=[`[data-module-toggle="${id}"]`,`#toggle-${id}`,`input[data-entity-id="${id}"]`,`input[name="${id}"]`];
              let el=null; for(const s of selectors){el=document.querySelector(s);if(el)break}
              if(!el){
                const inputs=[...document.querySelectorAll('input[type=checkbox]')];
                el=inputs.find(x=>(x.closest('label')?.innerText||'').toLowerCase().includes(id.replace('module-','')))||null;
              }
              if(!el)return {ok:false,reason:'not-found'};
              if(el.checked!==visible){el.checked=visible;el.dispatchEvent(new Event('change',{bubbles:true}));el.dispatchEvent(new Event('input',{bubbles:true}));}
              return {ok:true,id:el.id,checked:el.checked,label:el.closest('label')?.innerText||''};
            },{id,visible});
          }
          async function restore(page){
            const selectors=['#restoreButton','button[aria-label*="Restaur" i]','button[title*="Restaur" i]'];
            for(const s of selectors){const loc=page.locator(s).first();if(await loc.count()){try{await loc.click({timeout:3000});await page.waitForTimeout(500);return true}catch{}}}
            await page.reload({waitUntil:'networkidle'}); return false;
          }
          async function captureModuleMatrix(page,prefix){
            const result={};
            for(const c of [
              {name:'both-visible',a:true,b:true},
              {name:'module-02-hidden',a:false,b:true},
              {name:'module-03-hidden',a:true,b:false},
              {name:'both-hidden',a:false,b:false}
            ]){
              await restore(page);
              result[c.name]={m02:await toggleModule(page,'module-02',c.a),m03:await toggleModule(page,'module-03',c.b)};
              await page.waitForTimeout(500);
              await shot(page,`${prefix}-${c.name}`,false);
              result[c.name].fingerprint=await page.evaluate(()=>document.body.dataset.sceneFingerprint||window.CASA_EM_MODULOS_CURRENT_FINGERPRINT||null);
              result[c.name].visibility=await page.evaluate(()=>window.CASA_EM_MODULOS_DEBUG?.getVisibility?.()||null);
            }
            await restore(page); return result;
          }
          async function clickCandidates(page,rx,max=5){
            const out=[];
            const btns=page.locator('button'); const n=await btns.count();
            for(let i=0;i<n&&out.length<max;i++){
              const b=btns.nth(i); const meta=await b.evaluate(e=>({text:e.innerText.trim(),aria:e.getAttribute('aria-label')||'',title:e.title||'',id:e.id||''}));
              const hay=`${meta.text} ${meta.aria} ${meta.title} ${meta.id}`;
              if(!rx.test(hay))continue;
              try{await b.click({timeout:2500});await page.waitForTimeout(400);out.push({...meta,clicked:true});}catch(e){out.push({...meta,clicked:false,error:String(e)})}
            }
            return out;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report={url:URL,timestamp:new Date().toISOString(),desktop:{},mobile:{}};
            for(const cfg of [{name:'desktop',viewport:{width:1536,height:1000}},{name:'mobile',viewport:{width:390,height:844}}]){
              const page=await browser.newPage({viewport:cfg.viewport});
              const pageErrors=[]; const consoleErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              await page.goto(URL,{waitUntil:'networkidle',timeout:120000});
              report[cfg.name].initial=await inventory(page);
              report[cfg.name].pageErrors=pageErrors; report[cfg.name].consoleErrors=consoleErrors;
              await shot(page,`live-${cfg.name}-initial-top`,false);
              await shot(page,`live-${cfg.name}-initial-full`,true);
              report[cfg.name].moduleMatrix=await captureModuleMatrix(page,`live-${cfg.name}`);
              await restore(page);
              if(cfg.name==='desktop'){
                report.desktop.moduleOrDetailsClicks=await clickCandidates(page,/(m[oó]dulo|detalh|selecion|configur|editar)/i,4);
                await shot(page,'live-desktop-after-module-detail-clicks',false);
                report.desktop.afterClicks=await inventory(page);
              } else {
                const before=await page.evaluate(()=>({y:scrollY}));
                await page.evaluate(()=>scrollTo(0,Math.min(document.documentElement.scrollHeight,700))); await page.waitForTimeout(500);
                await shot(page,'live-mobile-scrolled-before-pin',false);
                report.mobile.pinCandidates=await clickCandidates(page,/(pin|fix|prend|sticky|travar|destravar)/i,3);
                await page.waitForTimeout(500);
                await shot(page,'live-mobile-scrolled-after-pin',false);
                report.mobile.afterPin=await inventory(page); report.mobile.scrollStart=before;
              }
              await page.close();
            }
            fs.writeFileSync(path.join(OUT,'live-dom-and-interactions.json'),JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);fs.writeFileSync(path.join(OUT,'browser-fatal.txt'),String(e&&e.stack||e));process.exitCode=1});
          JS

      - name: Upload live audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-state-adaptive-audit-2026-09-17
          path: /tmp/live-audit
          if-no-files-found: error

      - name: Self-clean temporary workflow
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-live-state-adaptive-temp.yml
          git commit -m 'Remove temporary adaptive live-state audit workflow'
          git push origin HEAD:${TARGET_BRANCH}
