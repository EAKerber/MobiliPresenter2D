name: Housekeeping remove shadowed summary temp

on:
  push:
    branches: [housekeeping/summary-pricing-gate]
    paths:
      - '.github/workflows/housekeeping-remove-shadowed-summary-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: housekeeping/summary-pricing-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove shadowed legacy summary implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/app.js')
          text = path.read_text()
          legacy = '''\n  function renderCurrentValue(resolved) {\n    const estimate = getEstimate(resolved);\n    if (!configurationValue) return;\n    if (estimate.status === "legacy")'''
          current = '''\n  function renderCurrentValue(resolved) {\n    const estimate = getEstimate(resolved);\n    if (!configurationValue) return;\n    if (estimate.status === "estimate")'''
          start = text.find(legacy)
          end = text.find(current)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'legacy/current summary boundaries not found exactly: start={start}, end={end}')
          before = text[:start]
          removed = text[start:end]
          after = text[end:]
          if removed.count('function renderCurrentValue') != 1 or removed.count('function renderSummary') != 1:
              raise SystemExit('unexpected legacy block shape')
          text = before + after
          if text.count('function renderCurrentValue') != 1 or text.count('function renderSummary') != 1:
              raise SystemExit('summary implementation must be unique after cleanup')
          if 'estimate.status === "legacy"' in text:
              raise SystemExit('legacy estimate branch survived cleanup')
          path.write_text(text)
          print('REMOVED_BYTES', len(removed.encode()))
          PY
      - name: Static and core gates
        run: |
          set -euo pipefail
          test "$(grep -c 'function renderCurrentValue' app/app.js)" -eq 1
          test "$(grep -c 'function renderSummary' app/app.js)" -eq 1
          ! grep -q 'estimate.status === "legacy"' app/app.js
          grep -q 'estimate.status === "estimate"' app/app.js
          node --check app/app.js
          node app/tools/test-core.js
          node app/tools/test-runtime-contracts.js
      - name: Commit cleanup and self-remove
        env:
          TARGET_BRANCH: housekeeping/summary-pricing-gate
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/housekeeping-remove-shadowed-summary-temp.yml
          git add app/app.js
          git commit -m 'Remove shadowed legacy summary implementation'
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          result="$(git rev-parse HEAD)"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
          echo "RESULT_HEAD=$result"
