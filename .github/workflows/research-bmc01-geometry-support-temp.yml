name: Research BMC01 geometry support temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc01-geometry-support-temp.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Test and audit geometry support
        run: |
          python -m py_compile tools/research_bmc01_geometry_support.py
          python -m unittest tests/test_research_bmc01_geometry_support.py
          python tools/research_bmc01_geometry_support.py             --config review-assets/research/bmc01-geometry-support-audit-v0.1.json             --output review-assets/research/bmc01-geometry-support-audit-v0.1-report.json             --review-image review-assets/research/bmc01-geometry-support-audit-v0.1.png
          cat review-assets/research/bmc01-geometry-support-audit-v0.1-report.json
      - name: Commit report and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc01-geometry-support-temp.yml
          git add             review-assets/research/bmc01-geometry-support-audit-v0.1-report.json             review-assets/research/bmc01-geometry-support-audit-v0.1.png
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize BMC-01 geometry support audit"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
