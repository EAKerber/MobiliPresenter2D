name: Research BMC04 generation inputs temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc04-generation-inputs-temp.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Build current variant manifest
        run: node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/current-variants.json
      - name: Assemble BMC-04 generation inputs
        run: |
          python -m py_compile tools/research_bmc04_generation_inputs.py tools/validate_reconstruction_packet.py
          python -m unittest tests/test_research_bmc04_generation_inputs.py tests/test_validate_reconstruction_packet.py
          rm -rf review-assets/research/bmc04-generation-input-v0.1
          python tools/research_bmc04_generation_inputs.py             --config review-assets/research/bmc04-generation-input-v0.1.json             --variant-manifest /tmp/current-variants.json             --output-dir review-assets/research/bmc04-generation-input-v0.1
          python tools/validate_reconstruction_packet.py             review-assets/research/bmc04-cooktop-bounded-generation-v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bmc04-generation-inputs
          path: review-assets/research/bmc04-generation-input-v0.1
          if-no-files-found: error
      - name: Commit inputs and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc04-generation-inputs-temp.yml
          git add review-assets/research/bmc04-generation-input-v0.1
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize BMC-04 generation inputs"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
