name: Audit fresh live report temp

on:
  push:
    branches: [audit/live-state-2026-09-17]
    paths: ['.github/workflows/audit-fresh-live-report-temp.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PRIMARY_URL: https://mobilipresenter2d.netlify.app
      IMMUTABLE_URL: https://6aabc2c4b3a76f8ad67da4f5--mobilipresenter2d.netlify.app
      TARGET_BRANCH: audit/live-state-2026-09-17
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Chromium tooling
        run: |
          npm install --prefix /tmp/fresh-browser --no-audit --no-fund playwright@1.62.1
          /tmp/fresh-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture immutable and primary with cache disabled
        env:
          NODE_PATH: /tmp/fresh-browser/node_modules
        run: |
          cat > /tmp/fresh-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          (async()=>{
            const out='/tmp/fresh-live'; fs.mkdirSync(out,{recursive:true});
            const browser=await chromium.launch({headless:true});
            const results={capturedAt:new Date().toISOString(), primary:process.env.PRIMARY_URL, immutable:process.env.IMMUTABLE_URL, variants:{}};
            async function run(label,base){
              const context=await browser.newContext({viewport:{width:1440,height:1000},serviceWorkers:'block',extraHTTPHeaders:{'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache'}});
              const page=await context.newPage();
              const cdp=await context.newCDPSession(page); await cdp.send('Network.enable'); await cdp.send('Network.setCacheDisabled',{cacheDisabled:true});
              const errors=[]; page.on('pageerror',e=>errors.push('pageerror: '+e.message)); page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
              const navUrl=base+'/?fresh_audit='+Date.now()+'-'+Math.random().toString(36).slice(2);
              const response=await page.goto(navUrl,{waitUntil:'networkidle',timeout:90000}); await page.waitForTimeout(1200);
              const headers=response?await response.allHeaders():{};
              const bodyText=await page.locator('body').innerText();
              const info=await page.evaluate(()=>({title:document.title,htmlLang:document.documentElement.lang,bodyClass:document.body.className,fingerprint:document.body.dataset.sceneFingerprint||null, scripts:[...document.scripts].map(s=>s.src).filter(Boolean), styles:[...document.querySelectorAll('link[rel=stylesheet]')].map(x=>x.href), headings:[...document.querySelectorAll('h1,h2,h3')].filter(x=>getComputedStyle(x).display!=='none').map(x=>x.textContent.trim()), buttons:[...document.querySelectorAll('button')].filter(x=>getComputedStyle(x).display!=='none').map(x=>({text:(x.innerText||'').trim().replace(/\s+/g,' '),aria:x.getAttribute('aria-label')})), viewport:{w:innerWidth,h:innerHeight}, scroll:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight}}));
              fs.writeFileSync(path.join(out,label+'-body.txt'),bodyText);
              fs.writeFileSync(path.join(out,label+'-page.html'),await page.content());
              await page.screenshot({path:path.join(out,label+'-desktop-initial.png'),fullPage:true,animations:'disabled'});
              async function safeShot(step,action){try{await action();await page.waitForTimeout(350);await page.screenshot({path:path.join(out,label+'-'+step+'.png'),fullPage:true,animations:'disabled'});}catch(e){errors.push(step+': '+e.message)}}
              await safeShot('module02-detail',async()=>{const x=page.locator('[data-select-entity="module-02"]');if(await x.count())await x.first().click();});
              await safeShot('finishes',async()=>{const x=page.locator('[data-step="finishes"]');if(await x.count())await x.click();});
              await safeShot('services',async()=>{const x=page.locator('[data-step="services"]');if(await x.count())await x.click();});
              await safeShot('summary',async()=>{const x=page.locator('[data-step="summary"]');if(await x.count())await x.click();});
              await page.setViewportSize({width:390,height:844}); await page.goto(navUrl+'&mobile=1',{waitUntil:'networkidle',timeout:90000}); await page.waitForTimeout(800); await page.screenshot({path:path.join(out,label+'-mobile-initial.png'),fullPage:true,animations:'disabled'});
              const mobileInfo=await page.evaluate(()=>({bodyClass:document.body.className,viewport:{w:innerWidth,h:innerHeight},scroll:{w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight},headings:[...document.querySelectorAll('h1,h2,h3')].filter(x=>getComputedStyle(x).display!=='none').map(x=>x.textContent.trim())}));
              results.variants[label]={finalUrl:response?.url()||null,status:response?.status()||null,headers,info,mobileInfo,errors};
              await context.close();
            }
            await run('immutable',process.env.IMMUTABLE_URL);
            await run('primary',process.env.PRIMARY_URL);
            for(const name of ['immutable','primary']){
              for(const file of ['desktop-initial.png','mobile-initial.png','page.html','body.txt']){
                const p=path.join(out,name+'-'+file); if(fs.existsSync(p)) results.variants[name].hashes=Object.assign(results.variants[name].hashes||{}, {[file]:crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')});
              }
            }
            const files=['index.html','styles.css','app.js','data/scene-data.js','data/mask-data.js','data/stone-data.js','data/catalog-data.js','data/mock-price-book.js','core/state.js','core/visibility.js','core/validation.js','core/fingerprint.js','core/finishes.js','core/stone.js','core/pricing.js'];
            const liveDir=path.join(out,'immutable-files'); fs.mkdirSync(liveDir,{recursive:true});
            for(const rel of files){
              try{const u=process.env.IMMUTABLE_URL+'/'+rel+'?fresh_file='+Date.now(); const r=await fetch(u,{headers:{'Cache-Control':'no-cache, no-store','Pragma':'no-cache'},cache:'no-store'}); const b=Buffer.from(await r.arrayBuffer()); const dest=path.join(liveDir,rel); fs.mkdirSync(path.dirname(dest),{recursive:true}); fs.writeFileSync(dest,b); (results.files||(results.files={}))[rel]={status:r.status,sha256:crypto.createHash('sha256').update(b).digest('hex'),bytes:b.length,contentType:r.headers.get('content-type')};}catch(e){(results.files||(results.files={}))[rel]={error:e.message};}
            }
            fs.writeFileSync(path.join(out,'audit.json'),JSON.stringify(results,null,2)); await browser.close();
          })().catch(e=>{fs.mkdirSync('/tmp/fresh-live',{recursive:true});fs.writeFileSync('/tmp/fresh-live/fatal.txt',String(e?.stack||e));process.exitCode=0;});
          NODE
          node /tmp/fresh-audit.cjs
      - name: Upload fresh-live audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-live-report-basis-2026-09-17
          path: /tmp/fresh-live
          if-no-files-found: error
      - name: Self-clean temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-fresh-live-report-temp.yml
          git commit -m 'Remove temporary fresh-live report audit workflow'
          git push origin HEAD:${TARGET_BRANCH}
