name: Review module04-06 finish seam temp
on:
  push:
    branches: [fix/module04-seam-bridge]
    paths: ['.github/workflows/review-module04-seam-temp.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/seam-browser --no-audit --no-fund playwright@1.62.1
          /tmp/seam-browser/node_modules/.bin/playwright install --with-deps chromium
          python -m pip install -r tools/requirements.txt
      - name: Capture seam visibility states
        env:
          NODE_PATH: /tmp/seam-browser/node_modules
        run: |
          mkdir -p /tmp/module04-seam-review
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const {pathToFileURL}=require('node:url');
          const {chromium}=require('playwright');
          (async()=>{
            const out='/tmp/module04-seam-review';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            await page.goto(pathToFileURL(path.resolve('app/index.html')).href);
            await page.evaluate(()=>Promise.all(Array.from(document.images,i=>i.decode())));
            const viewer=page.locator('#viewer');
            const bridge=page.locator('.layer-group[data-entity-id="module-04-06-finish-bridge"]');
            const bridgeFinish=bridge.locator('.finish-layer');
            const snap=async(name)=>viewer.screenshot({path:`${out}/${name}.png`,animations:'disabled'});
            const state=async(label)=>({
              label,
              bridgeHidden:await bridge.evaluate(el=>el.classList.contains('is-hidden')),
              bridgeReason:await bridge.getAttribute('data-visibility-reason'),
              finishOpacity:await bridgeFinish.evaluate(el=>getComputedStyle(el).opacity),
              maskAsset:await bridgeFinish.getAttribute('data-mask-asset'),
              module04:await page.locator('[data-module-toggle="module-04"]').isChecked(),
              module06:await page.locator('[data-module-toggle="module-06"]').isChecked(),
            });
            const records=[];
            records.push(await state('original-both')); await snap('original-both');
            await page.getByRole('button',{name:'Aplicar Preto',exact:true}).click();
            records.push(await state('black-both')); await snap('black-both');
            await page.locator('[data-module-toggle="module-06"]').setChecked(false);
            records.push(await state('black-no06')); await snap('black-no06');
            await page.locator('[data-module-toggle="module-06"]').setChecked(true);
            await page.locator('[data-module-toggle="module-04"]').setChecked(false);
            records.push(await state('black-no04')); await snap('black-no04');
            await page.locator('[data-module-toggle="module-04"]').setChecked(true);
            await page.getByRole('button',{name:'Aplicar Branco TX',exact:true}).click();
            records.push(await state('white-both')); await snap('white-both');
            fs.writeFileSync(`${out}/browser-state.json`,JSON.stringify(records,null,2));
            if(records[0].bridgeHidden || records[0].bridgeReason!=='visible' || records[0].finishOpacity!=='0') throw Error('original bridge state invalid');
            for(const rec of [records[1],records[4]]) if(rec.bridgeHidden || rec.bridgeReason!=='visible' || Number(rec.finishOpacity)<=0) throw Error(`visible bridge state invalid: ${rec.label}`);
            for(const rec of [records[2],records[3]]) if(!rec.bridgeHidden || rec.bridgeReason!=='host-hidden') throw Error(`hidden bridge state invalid: ${rec.label}`);
            if(records.some(rec=>rec.maskAsset!=='assets/kitchen/masks/04-06-seam-bridge.png')) throw Error('wrong bridge mask');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Crop and enlarge exact seam zone
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          out=Path('/tmp/module04-seam-review')
          canonical=(1536,1024)
          crop=(1188,34,1252,92)
          records=[]
          for name in ['original-both','black-both','white-both','black-no06','black-no04']:
              im=Image.open(out/f'{name}.png').convert('RGB')
              w,h=im.size
              x0=round(crop[0]*w/canonical[0]); y0=round(crop[1]*h/canonical[1]); x1=round(crop[2]*w/canonical[0]); y1=round(crop[3]*h/canonical[1])
              c=im.crop((x0,y0,x1,y1))
              c.resize((c.width*12,c.height*12),Image.Resampling.NEAREST).save(out/f'{name}-seam-12x.png')
              records.append({'name':name,'viewer':[w,h],'crop':[x0,y0,x1,y1]})
          (out/'crop-meta.json').write_text(json.dumps(records,indent=2)+'\n')
          print(json.dumps(records))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: module04-seam-browser-review
          path: /tmp/module04-seam-review
