name: Review module04-06 finish seam temp
on:
  push:
    branches: [fix/module04-seam-bridge]
    paths: ['.github/workflows/review-module04-seam-temp.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/seam-browser --no-audit --no-fund playwright@1.62.1
          /tmp/seam-browser/node_modules/.bin/playwright install --with-deps chromium
          python -m pip install -r tools/requirements.txt
      - name: Capture historical and stacking variants
        env:
          NODE_PATH: /tmp/seam-browser/node_modules
        run: |
          mkdir -p /tmp/module04-seam-review
          git worktree add --detach /tmp/pre29 e83d318eab52fdd9c8787d5d5d190205cf960aad
          node - <<'NODE'
          const path=require('node:path');
          const {pathToFileURL}=require('node:url');
          const {chromium}=require('playwright');
          (async()=>{
            const out='/tmp/module04-seam-review';
            const browser=await chromium.launch({headless:true});
            async function open(root){const p=await browser.newPage({viewport:{width:1366,height:768}});await p.goto(pathToFileURL(path.resolve(root,'index.html')).href);await p.evaluate(()=>Promise.all(Array.from(document.images,i=>i.decode())));return p;}
            async function capture(root,name,mutate){
              const p=await open(root);await p.getByRole('button',{name:'Aplicar Preto',exact:true}).click();if(mutate)await p.evaluate(mutate);await p.locator('#viewer').screenshot({path:`${out}/${name}.png`,animations:'disabled'});await p.close();
            }
            await capture('/tmp/pre29/app','pre29');
            await capture('app','base');
            await capture('app','no-isolation',()=>{document.querySelector('.layer-group[data-entity-id="module-04-06-finish-bridge"]').style.isolation='auto';});
            await capture('app','nested-group',()=>{const b=document.querySelector('.layer-group[data-entity-id="module-04-06-finish-bridge"]');b.style.isolation='auto';document.querySelector('.layer-group[data-entity-id="module-04"]').append(b);});
            await capture('app','nested-finish',()=>{const b=document.querySelector('.layer-group[data-entity-id="module-04-06-finish-bridge"]');const f=b.querySelector('.finish-layer');document.querySelector('.layer-group[data-entity-id="module-04"]').append(f);});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Compare stacking variants
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import json
          out=Path('/tmp/module04-seam-review'); ref=Image.open(out/'pre29.png').convert('RGB'); report={}
          for name in ('base','no-isolation','nested-group','nested-finish'):
              im=Image.open(out/f'{name}.png').convert('RGB'); diff=ImageChops.difference(im,ref); bands=diff.split(); support=ImageChops.lighter(ImageChops.lighter(bands[0],bands[1]),bands[2]); changed=sum(1 for v in support.get_flattened_data() if v); report[name]={'differentPixels':changed,'bounds':list(support.getbbox()) if support.getbbox() else None}
          best=min(report,key=lambda k:report[k]['differentPixels']); report['best']=best
          (out/'stacking-report.json').write_text(json.dumps(report,indent=2)+'\n'); print(json.dumps(report,sort_keys=True))
          assert report[best]['differentPixels']==0, report
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: module04-seam-stacking-probe
          path: /tmp/module04-seam-review
