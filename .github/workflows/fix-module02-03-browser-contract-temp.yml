name: Fix module02-03 browser contract temp

on:
  push:
    branches: [fix/module02-03-geometry-seams]
    paths: ['.github/workflows/fix-module02-03-browser-contract-temp.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update pairwise seam expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/stone-browser.cjs')
          text = p.read_text()
          old = "    assert.equal(visible['stone-02-joint-bridge'].visible,a);\n    assert.equal(visible['stone-03-joint-bridge'].visible,b);"
          new = "    assert.equal(visible['stone-02-joint-bridge'].visible,a && b);\n    assert.equal(visible['stone-03-joint-bridge'].visible,a && b);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one browser bridge assertion block, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          node --check tests/stone-browser.cjs
      - name: Commit patch with CAS readback
        env:
          TARGET_BRANCH: fix/module02-03-geometry-seams
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-module02-03-browser-contract-temp.yml
          git add tests/stone-browser.cjs
          git commit -m 'Test pairwise visibility for module 02-03 stone seams'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:${remote_before}!=${EXPECTED_HEAD}" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_after" != "$candidate_sha" ]; then
            echo "TARGET_READBACK_FAILED:${remote_after}!=${candidate_sha}" >&2
            exit 2
          fi
          echo "BROWSER_CONTRACT_PATCH base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"
