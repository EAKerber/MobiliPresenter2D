name: Audit live UX temp
on:
  push:
    branches: [audit/live-state-2026-09-17]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      TARGET_URL: https://mobilipresenter2d.netlify.app
      TARGET_BRANCH: audit/live-state-2026-09-17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium tooling
        run: |
          npm install --prefix /tmp/ux-browser --no-audit --no-fund playwright@1.62.1
          /tmp/ux-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture UX states and responsive metrics
        env:
          NODE_PATH: /tmp/ux-browser/node_modules
        run: |
          cat > /tmp/ux-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = '/tmp/ux-audit';
          fs.mkdirSync(out, {recursive:true});
          const url = process.env.TARGET_URL;
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const safeName = s => s.replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();

          async function metrics(page, label) {
            const data = await page.evaluate((label) => {
              const visible = el => {
                const cs = getComputedStyle(el); const r = el.getBoundingClientRect();
                return cs.display !== 'none' && cs.visibility !== 'hidden' && r.width > 0 && r.height > 0;
              };
              const rect = sel => {
                const el = document.querySelector(sel); if (!el || !visible(el)) return null;
                const r = el.getBoundingClientRect(); const cs=getComputedStyle(el);
                return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right,position:cs.position,overflowX:cs.overflowX,overflowY:cs.overflowY,fontSize:cs.fontSize,lineHeight:cs.lineHeight};
              };
              const textCandidates = [...document.querySelectorAll('h1,h2,h3,h4,p,span,strong,small,button,label,li,dt,dd,legend,em')]
                .filter(visible)
                .map(el => {
                  const r=el.getBoundingClientRect(), cs=getComputedStyle(el);
                  const text=(el.innerText||el.textContent||'').trim().replace(/\s+/g,' ').slice(0,140);
                  return {tag:el.tagName.toLowerCase(), cls:el.className || '', id:el.id||'', text, clientWidth:el.clientWidth, scrollWidth:el.scrollWidth, clientHeight:el.clientHeight, scrollHeight:el.scrollHeight, overflowX:cs.overflowX,overflowY:cs.overflowY,whiteSpace:cs.whiteSpace,fontSize:cs.fontSize,lineHeight:cs.lineHeight,x:r.x,y:r.y,width:r.width,height:r.height};
                });
              const clipped = textCandidates.filter(x => (x.scrollWidth > x.clientWidth + 1 || x.scrollHeight > x.clientHeight + 1) && (['hidden','clip'].includes(x.overflowX) || ['hidden','clip'].includes(x.overflowY) || x.whiteSpace === 'nowrap')).slice(0,100);
              const outside = textCandidates.filter(x => x.x < -1 || x.x + x.width > innerWidth + 1).slice(0,100);
              return {
                label, url:location.href, viewport:{width:innerWidth,height:innerHeight},
                doc:{scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,bodyScrollWidth:document.body.scrollWidth},
                horizontalOverflow:document.documentElement.scrollWidth > innerWidth + 1,
                rects:{topbar:rect('.topbar'),workspace:rect('.workspace'),viewerCard:rect('.viewer-card'),viewer:rect('#viewer'),controls:rect('.controls'),flowNav:rect('.flow-nav'),flowActions:rect('.flow-actions'),moduleDetail:rect('#moduleDetail'),moduleList:rect('#moduleList'),summary:rect('#summaryPanel')},
                headings:[...document.querySelectorAll('h1,h2,h3,h4')].filter(visible).map(el=>({tag:el.tagName,text:(el.textContent||'').trim(),fontSize:getComputedStyle(el).fontSize})),
                buttons:[...document.querySelectorAll('button')].filter(visible).map(el=>({text:(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,120),aria:el.getAttribute('aria-label'),pressed:el.getAttribute('aria-pressed'),disabled:el.disabled})),
                clipped, outside,
                bodyClasses:document.body.className,
                currentStep:[...document.querySelectorAll('[data-step]')].find(b=>b.classList.contains('is-active'))?.dataset.step || null,
                selectedEntity:window.CASA_EM_MODULOS_DEBUG?.getState?.().selectedEntityId || null,
                visibleCount:document.getElementById('visibleCount')?.textContent || null,
                valueText:(document.getElementById('configurationValue')?.innerText||'').trim().replace(/\s+/g,' ')
              };
            }, label);
            fs.writeFileSync(path.join(out, safeName(label)+'.json'), JSON.stringify(data,null,2));
            return data;
          }
          async function shot(page,label,full=true){ await page.screenshot({path:path.join(out,safeName(label)+'.png'),fullPage:full,animations:'disabled'}); await metrics(page,label); }
          async function gotoFresh(page){ await page.goto(url,{waitUntil:'networkidle',timeout:90000}); await page.waitForTimeout(1200); }

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[]; page.on('pageerror',e=>errors.push('pageerror: '+e.message)); page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          await gotoFresh(page);
          await shot(page,'desktop-1440-modules-initial');
          const detail02=page.locator('[data-select-entity="module-02"]');
          if(await detail02.count()){ await detail02.first().click(); await page.waitForTimeout(500); await shot(page,'desktop-1440-module02-detail'); }
          const finishStep=page.locator('[data-step="finishes"]');
          if(await finishStep.count()){ await finishStep.click(); await page.waitForTimeout(350); await shot(page,'desktop-1440-finishes'); }
          const frontButtons=page.locator('[data-color]'); if(await frontButtons.count()>1){await frontButtons.nth(1).click();}
          const handles=page.locator('[data-handle-id]'); if(await handles.count()>1){await handles.nth(1).click();}
          const stones=page.locator('[data-stone-color]'); if(await stones.count()){await stones.first().click(); await page.waitForTimeout(350);}
          await shot(page,'desktop-1440-finishes-selected');
          const servicesStep=page.locator('[data-step="services"]'); if(await servicesStep.count()){await servicesStep.click(); await page.waitForTimeout(350); await shot(page,'desktop-1440-services');}
          const summaryStep=page.locator('[data-step="summary"]'); if(await summaryStep.count()){await summaryStep.click(); await page.waitForTimeout(350); await shot(page,'desktop-1440-summary');}
          const restore=page.locator('#restoreButton'); if(await restore.count()){await restore.click(); await page.waitForTimeout(400);}
          const toggle03=page.locator('#toggle-module-03'); if(await toggle03.count()){await toggle03.uncheck(); await page.waitForTimeout(350); await shot(page,'desktop-1440-module03-off');}

          for (const vp of [{w:1051,h:900},{w:1050,h:900},{w:900,h:900},{w:701,h:900},{w:700,h:900},{w:390,h:844},{w:360,h:800}]) {
            await page.setViewportSize({width:vp.w,height:vp.h}); await gotoFresh(page); await shot(page,`responsive-${vp.w}x${vp.h}-initial`);
            if (vp.w<=390) {
              const d=page.locator('[data-select-entity="module-02"]'); if(await d.count()){await d.first().click(); await page.waitForTimeout(350); await shot(page,`responsive-${vp.w}x${vp.h}-module02-detail`);}
              const f=page.locator('[data-step="finishes"]'); if(await f.count()){await f.click(); await page.waitForTimeout(350); await shot(page,`responsive-${vp.w}x${vp.h}-finishes`);}
              const s=page.locator('[data-step="summary"]'); if(await s.count()){await s.click(); await page.waitForTimeout(350); await shot(page,`responsive-${vp.w}x${vp.h}-summary`);}
            }
          }
          fs.writeFileSync(path.join(out,'errors.json'),JSON.stringify(errors,null,2));
          await browser.close();
          NODE
          node /tmp/ux-audit.cjs
      - name: Upload UX audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-ux-audit-2026-09-17
          path: /tmp/ux-audit
          if-no-files-found: error
      - name: Self-clean temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-live-ux-temp.yml
          git commit -m 'Remove temporary live UX audit workflow'
          git push origin HEAD:${TARGET_BRANCH}
