name: Raw variant capture temp
on:
  push:
    branches: [fix/module-02-exposed-right-face]
    paths:
      - '.github/workflows/raw-variant-capture-temp.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Render exact deterministic variants
        run: |
          mkdir -p /tmp/raw-variant-render/views
          node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/raw-variant-render/manifest.json
          python tools/render_variant_fidelity.py --manifest /tmp/raw-variant-render/manifest.json --output-dir /tmp/raw-variant-render/views
          sha256sum /tmp/raw-variant-render/views/module-03-hidden.png /tmp/raw-variant-render/views/default.png > /tmp/raw-variant-render/sha256.txt
      - name: Upload deterministic captures
        uses: actions/upload-artifact@v4
        with:
          name: raw-variant-render-${{ github.run_id }}
          path: /tmp/raw-variant-render
          if-no-files-found: error
