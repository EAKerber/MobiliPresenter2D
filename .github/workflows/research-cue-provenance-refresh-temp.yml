name: Research cue provenance refresh temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-cue-provenance-refresh-temp.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Build current variant manifest
        run: node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/current-variants.json
      - name: Run research tests
        run: |
          python -m py_compile tools/research_depth_cue_ownership.py tools/research_scene_projective_consistency.py
          python -m unittest tests/test_research_depth_cue_ownership.py tests/test_research_scene_projective_consistency.py
      - name: Refresh cue ownership and SC-01 reports
        run: |
          python tools/research_depth_cue_ownership.py             --variant-manifest /tmp/current-variants.json             --output review-assets/research/module02-depth-cue-ownership-v0.1.json
          python tools/research_scene_projective_consistency.py             --config review-assets/research/scene-projective-consistency-v0.1.json             --output review-assets/research/scene-projective-consistency-v0.1-report.json
          python - <<'PY'
          import json
          ownership=json.load(open("review-assets/research/module02-depth-cue-ownership-v0.1.json"))
          sc=json.load(open("review-assets/research/scene-projective-consistency-v0.1-report.json"))
          print(json.dumps({
            "ownership02": ownership["module02HistoricalCue"]["finding"],
            "ownership03": {
              "variantPositive": ownership["module03GapReferenceCue"]["assets"]["stone03Variant"]["alphaPositiveCount"],
              "bridgePositive": ownership["module03GapReferenceCue"]["assets"]["stone03Bridge"]["alphaPositiveCount"],
              "bridgeVisibility": ownership["module03GapReferenceCue"]["currentModule02HiddenVisibility"]["stone03Bridge"],
              "hashMatches": ownership["module03GapReferenceCue"]["fullFrameHashMatchesCurrentStone03Variant"],
            },
            "sc01": sc["preliminaryClassification"],
          },sort_keys=True))
          PY
      - name: Commit reports and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-cue-provenance-refresh-temp.yml
          git add             review-assets/research/module02-depth-cue-ownership-v0.1.json             review-assets/research/scene-projective-consistency-v0.1-report.json
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: refresh cue provenance and SC-01 classification"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
