name: Research projection compatibility probe temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-projection-compat-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test research probe
        run: |
          python -m py_compile tools/research_projection_compatibility.py
          python -m unittest tests/test_research_projection_compatibility.py

      - name: Materialize deterministic compatibility report
        run: |
          python tools/research_projection_compatibility.py             --config review-assets/research/projection-compatibility-v0.1.json             --output review-assets/research/projection-compatibility-v0.1-report.json
          cat review-assets/research/projection-compatibility-v0.1-report.json

      - name: Commit report and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-projection-compat-temp.yml
          git add review-assets/research/projection-compatibility-v0.1-report.json
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:$remote_before!=$EXPECTED_HEAD" >&2
            exit 2
          fi
          git commit -m "research: materialize projection compatibility report"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
          echo "PROJECTION_COMPAT_RESULT=$result"
