          # Stone/MDF material renderer: stone keeps stone shading; MDF fully covers the old stone and uses texture luminance only.
          Path("app/core/stone.js").write_text(r'''(function (global) {
  "use strict";

  const width = 1536, height = 1024;

  function caseId(state) {
    const a = state.visibilityByEntity["module-02"];
    const b = state.visibilityByEntity["module-03"];
    return a ? (b ? "default" : "module-03-hidden") : (b ? "module-02-hidden" : "modules-02-03-hidden");
  }

  function parseColor(color) {
    if (!/^#[0-9a-f]{6}$/i.test(color || "")) return null;
    return [1, 3, 5].map((index) => Number.parseInt(color.slice(index, index + 2), 16));
  }

  function materialKey(material) {
    if (!material) return "original";
    const hasTexture = Boolean(material.textureAsset);
    const color = parseColor(material.color);
    if (!hasTexture && !color) return "original";
    return [
      material.materialType || "generic",
      hasTexture ? material.textureAsset : "no-texture",
      material.color || "no-color",
      material.textureStrength ?? ""
    ].join(":");
  }

  function createRenderer(stoneCanvas, plinthCanvas, data) {
    const inputCache = new Map();
    const materialCache = new Map();
    const renderCache = new Map();
    let revision = 0;

    const stoneContext = stoneCanvas.getContext("2d");
    const plinthContext = plinthCanvas.getContext("2d");

    async function fullCanvasPixels(url) {
      const image = new Image();
      image.src = url;
      await image.decode();
      const scratch = document.createElement("canvas");
      scratch.width = width;
      scratch.height = height;
      const context = scratch.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      return context.getImageData(0, 0, width, height).data;
    }

    async function texturePixels(url) {
      if (!materialCache.has(url)) {
        materialCache.set(url, (async () => {
          const image = new Image();
          image.src = url;
          await image.decode();
          const textureWidth = image.naturalWidth || image.width;
          const textureHeight = image.naturalHeight || image.height;
          const scratch = document.createElement("canvas");
          scratch.width = textureWidth;
          scratch.height = textureHeight;
          const context = scratch.getContext("2d", { willReadFrequently: true });
          context.drawImage(image, 0, 0, textureWidth, textureHeight);
          const data = context.getImageData(0, 0, textureWidth, textureHeight).data;
          let totalLuminance = 0, samples = 0;
          for (let index = 0; index < data.length; index += 4) {
            if (!data[index + 3]) continue;
            totalLuminance += data[index] * 0.2126 + data[index + 1] * 0.7152 + data[index + 2] * 0.0722;
            samples += 1;
          }
          return {
            data,
            width: textureWidth,
            height: textureHeight,
            averageLuminance: samples ? totalLuminance / samples : 128
          };
        })());
      }
      return materialCache.get(url);
    }

    async function materialSource(material) {
      const materialType = material?.materialType || "stone";
      const color = parseColor(material?.color);
      const texture = material?.textureAsset ? await texturePixels(material.textureAsset) : null;
      if (!texture && !color) return null;
      return {
        materialType,
        rgb: color,
        texture,
        textureStrength: Number.isFinite(Number(material?.textureStrength)) ? Number(material.textureStrength) : 0.35
      };
    }

    function textureRgb(source, pixel) {
      if (!source.texture) return source.rgb;
      const x = pixel % width;
      const y = Math.floor(pixel / width);
      const index = ((y % source.texture.height) * source.texture.width + (x % source.texture.width)) * 4;
      return [
        source.texture.data[index],
        source.texture.data[index + 1],
        source.texture.data[index + 2]
      ];
    }

    function composeStone(neutral, under, objects, mask, source) {
      const result = new Uint8ClampedArray(neutral.length);
      if (!source) return new ImageData(result, width, height);

      for (let pixel = 0, index = 0; pixel < width * height; pixel += 1, index += 4) {
        const coverage = mask[index] / 255;
        if (!coverage) continue;
        const background = 1 - objects[index + 3] / 255;
        const luminance = (
          under[index] * 0.2126 +
          under[index + 1] * 0.7152 +
          under[index + 2] * 0.0722
        ) / 180;
        const shade = Math.min(1.35, Math.max(0.35, luminance));
        const rgb = textureRgb(source, pixel) || source.rgb;
        if (!rgb) continue;
        for (let channel = 0; channel < 3; channel += 1) {
          const target = Math.min(255, rgb[channel] * shade);
          result[index + channel] = Math.round(
            neutral[index + channel] +
            (target - under[index + channel]) * background * coverage
          );
        }
        result[index + 3] = Math.round(255 * coverage);
      }
      return new ImageData(result, width, height);
    }

    function composeMdf(mask, source) {
      const result = new Uint8ClampedArray(width * height * 4);
      if (!source?.rgb) return new ImageData(result, width, height);

      for (let pixel = 0, index = 0; pixel < width * height; pixel += 1, index += 4) {
        const coverage = mask[index] / 255;
        if (!coverage) continue;
        let detail = 1;
        if (source.texture) {
          const texture = textureRgb(source, pixel);
          const luminance = texture[0] * 0.2126 + texture[1] * 0.7152 + texture[2] * 0.0722;
          const delta = (luminance - source.texture.averageLuminance) / 255;
          detail = Math.min(1.22, Math.max(0.78, 1 + delta * source.textureStrength));
        }
        for (let channel = 0; channel < 3; channel += 1) {
          result[index + channel] = Math.round(Math.min(255, source.rgb[channel] * detail));
        }
        result[index + 3] = Math.round(255 * coverage);
      }
      return new ImageData(result, width, height);
    }

    async function caseInputs(id) {
      if (!inputCache.has(id)) {
        inputCache.set(
          id,
          Promise.all(
            ["neutral", "under", "objects", "upperMask", "plinthMask"]
              .map((key) => fullCanvasPixels(data[id][key]))
          )
        );
      }
      return inputCache.get(id);
    }

    async function rendered(id, maskName, material) {
      const key = id + "|" + maskName + "|" + materialKey(material);
      if (!renderCache.has(key)) {
        renderCache.set(key, (async () => {
          const [neutral, under, objects, upperMask, plinthMask] = await caseInputs(id);
          const mask = maskName === "plinth" ? plinthMask : upperMask;
          const source = await materialSource(material);
          return source?.materialType === "mdf"
            ? composeMdf(mask, source)
            : composeStone(neutral, under, objects, mask, source);
        })());
      }
      return renderCache.get(key);
    }

    return async function render(state, materials = {}) {
      const ticket = ++revision;
      stoneContext.clearRect(0, 0, width, height);
      plinthContext.clearRect(0, 0, width, height);

      const id = caseId(state);
      try {
        const jobs = [];
        if (materialKey(materials.upper) !== "original") {
          jobs.push(rendered(id, "upper", materials.upper).then((image) => [stoneContext, image]));
        }
        if (materialKey(materials.plinth) !== "original") {
          jobs.push(rendered(id, "plinth", materials.plinth).then((image) => [plinthContext, image]));
        }
        const images = await Promise.all(jobs);
        if (ticket !== revision) return;
        images.forEach(([context, image]) => context.putImageData(image, 0, 0));
      } catch (error) {
        inputCache.delete(id);
        if (ticket === revision) console.error(error);
      }
    };
  }

  global.CasaStone = Object.freeze({ caseId, createRenderer, materialKey });
})(window);
''')

          # Core contracts for material semantics.
          replace_once(
              "app/tools/test-core.js",
              'assert.equal(catalog.options.finishes.every((finish) => finish.textureAsset && finish.textureAsset.startsWith("assets/materials/")), true);',
              'assert.equal(catalog.options.finishes.every((finish) => finish.materialType === "mdf" && finish.textureAsset && finish.textureAsset.startsWith("assets/materials/")), true);'
          )
          replace_once(
              "app/tools/test-core.js",
              'assert.deepEqual(Array.from(catalog.options.stonePackages.filter((stone) => ["stone-light","stone-green","stone-dark"].includes(stone.id)).map((stone) => Boolean(stone.textureAsset))), [true,true,true]);',
              'assert.deepEqual(Array.from(catalog.options.stonePackages.filter((stone) => ["stone-light","stone-green","stone-dark"].includes(stone.id)).map((stone) => stone.materialType === "stone" && Boolean(stone.textureAsset))), [true,true,true]);\nassert.equal(finishes.resolveOverlayOpacity(catalog.options.finishes[0], catalog.options.finishes[0].color), 0.84);'
          )
          PY

      - name: Core and asset tests
        working-directory: app
        run: npm test

      - name: Install Playwright browser gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Browser behavior gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/review
          python -m http.server 4173 --directory app >/tmp/mobili-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          cat >/tmp/pw/gate.cjs <<'JS'
          const { chromium } = require("playwright");
          const fs = require("fs");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1366, height: 768 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on("pageerror", error => errors.push(String(error)));
            await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
            await page.evaluate(async () => Promise.all([...document.images].map(image => image.decode().catch(() => null))));
            await page.waitForTimeout(700);

            const assert = (condition, message) => { if (!condition) throw new Error(message); };
            const sig = async (id, y=820, h=100) => page.$eval(id, (canvas,args) => {
              const data=canvas.getContext("2d").getImageData(0,args.y,canvas.width,args.h).data;
              let alpha=0,sum=0;
              for(let i=0;i<data.length;i+=4){
                if(data[i+3]) alpha++;
                sum=(sum+data[i]*3+data[i+1]*5+data[i+2]*7+data[i+3])>>>0;
              }
              return {alpha,sum};
            }, {y,h});

            const waitPlinth = () => page.waitForFunction(() => {
              const data=document.getElementById("plinthCanvas").getContext("2d").getImageData(450,840,800,80).data;
              for(let i=3;i<data.length;i+=4) if(data[i]) return true;
              return false;
            });

            await waitPlinth();
            const initial = await sig("#plinthCanvas");
            assert(initial.alpha > 0, "MDF plinth missing at initial state");

            // OFF: stone choice cannot affect plinth.
            await page.locator('[data-step="finishes"]').click();
            await page.locator('[data-stone-package-id="stone-light"]').click();
            await page.waitForTimeout(500);
            const offAfterStone = await sig("#plinthCanvas");
            assert(offAfterStone.sum === initial.sum, "stone choice leaked into plinth while skirting is OFF");

            // OFF: MDF choice must affect plinth.
            await page.locator('[data-finish-id="tone-25-a"]').click();
            await page.waitForTimeout(500);
            const offAfterMdf = await sig("#plinthCanvas");
            assert(offAfterMdf.sum !== offAfterStone.sum, "MDF choice did not affect plinth while skirting is OFF");

            // ON: switch to stone.
            await page.locator("#stoneSkirtingToggle").check();
            await page.waitForTimeout(500);
            const onStoneLight = await sig("#plinthCanvas");
            assert(onStoneLight.sum !== offAfterMdf.sum, "skirting ON did not switch plinth to stone");

            // ON: MDF choice cannot affect plinth.
            await page.locator('[data-finish-id="tone-25-b"]').click();
            await page.waitForTimeout(500);
            const onAfterMdf = await sig("#plinthCanvas");
            assert(onAfterMdf.sum === onStoneLight.sum, "MDF choice leaked into plinth while skirting is ON");

            // ON: stone choice must affect plinth.
            await page.locator('[data-stone-package-id="stone-dark"]').click();
            await page.waitForTimeout(500);
            const onStoneDark = await sig("#plinthCanvas");
            assert(onStoneDark.sum !== onAfterMdf.sum, "stone choice did not affect plinth while skirting is ON");

            // MDF scene rendering must use main-style normal overlay and tonal background blending.
            await page.locator('[data-finish-id="base-light"]').click();
            await page.waitForTimeout(200);
            const finishStyle = await page.locator(".finish-layer.is-texture").first().evaluate(el => ({
              mix: getComputedStyle(el).mixBlendMode,
              backgroundBlend: getComputedStyle(el).backgroundBlendMode,
              opacity: Number(getComputedStyle(el).opacity)
            }));
            assert(finishStyle.mix === "normal", "MDF texture still uses cross-layer multiply");
            assert(finishStyle.backgroundBlend.includes("luminosity"), "MDF texture is not tonal/luminosity detail");
            assert(Math.abs(finishStyle.opacity - 0.84) < 0.02, "base white did not recover main opacity");

            // Desktop narrow control column: labels must compact based on container and never overflow.
            const navState = await page.locator(".flow-nav").evaluate(nav => ({
              width: nav.getBoundingClientRect().width,
              steps: [...nav.querySelectorAll(".flow-step")].map(step => ({
                client: step.clientWidth,
                scroll: step.scrollWidth,
                compact: getComputedStyle(step.querySelector(".flow-step__label")).fontSize === "0px",
                title: step.title
              }))
            }));
            assert(navState.width < 500, "desktop control column did not reproduce narrow nav");
            assert(navState.steps.every(step => step.scroll <= step.client + 1), "desktop step text overflows");
            assert(navState.steps.every(step => step.compact), "narrow desktop nav did not compact labels");
            assert(navState.steps.some(step => step.title === "Acabamentos"), "full hover title missing");

            await page.screenshot({ path: "/tmp/review/desktop-materials-nav.png", fullPage: true });

            // Mobile PiP: controls must remain affiliated and state-specific.
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
            await page.evaluate(async () => Promise.all([...document.images].map(image => image.decode().catch(() => null))));
            await page.evaluate(() => window.scrollTo(0, document.querySelector(".flow-nav").getBoundingClientRect().top + window.scrollY + 220));
            await page.waitForFunction(() => document.body.classList.contains("is-mobile-scene-pinned"));

            const pinnedControls = await page.evaluate(() => {
              const card=document.getElementById("viewerCard").getBoundingClientRect();
              const pin=document.getElementById("mobileScenePin").getBoundingClientRect();
              const opacity=document.getElementById("mobileSceneOpacity").getBoundingClientRect();
              return {
                pinInside: pin.left >= card.left && pin.right <= card.right && pin.top >= card.top && pin.bottom <= card.bottom,
                opacityInside: opacity.left >= card.left && opacity.right <= card.right && opacity.top >= card.top && opacity.bottom <= card.bottom,
                opacityDisplay: getComputedStyle(document.getElementById("mobileSceneOpacity")).display
              };
            });
            assert(pinnedControls.pinInside && pinnedControls.opacityInside, "PiP controls are not affiliated with viewerCard");
            assert(pinnedControls.opacityDisplay !== "none", "opacity control hidden while pinned");

            await page.locator('[data-select-scene-entity="module-03"]').click({ force: true });
            await page.waitForFunction(() => document.querySelector("#moduleDetail h3")?.textContent?.includes("Inferior da pia"));
            assert(await page.evaluate(() => document.body.classList.contains("is-mobile-scene-pinned")), "module click dropped PiP");

            // Force stale geometry then resize; runtime must clamp it back to viewport.
            await page.evaluate(() => {
              const root=document.documentElement.style;
              root.setProperty("--mobile-pip-left","900px");
              root.setProperty("--mobile-pip-top","900px");
              root.setProperty("--mobile-pip-right","auto");
              root.setProperty("--mobile-pip-width","500px");
              document.getElementById("viewerCard").dataset.pipPositioned="true";
            });
            await page.setViewportSize({ width: 320, height: 700 });
            await page.waitForTimeout(300);
            const clamped = await page.locator("#viewerCard").evaluate(card => {
              const r=card.getBoundingClientRect();
              return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width};
            });
            assert(clamped.left >= 7 && clamped.right <= 313, "PiP horizontal geometry not clamped");
            assert(clamped.top >= 7 && clamped.bottom <= 693, "PiP vertical geometry not clamped");

            // Disable pin and return to normal view: opacity control must disappear, pin remains inside the card.
            await page.locator("#mobileScenePin").click();
            await page.evaluate(() => window.scrollTo(0,0));
            await page.waitForTimeout(250);
            const normalControls = await page.evaluate(() => {
              const card=document.getElementById("viewerCard").getBoundingClientRect();
              const pin=document.getElementById("mobileScenePin").getBoundingClientRect();
              return {
                pinned: document.body.classList.contains("is-mobile-scene-pinned"),
                cardPosition: getComputedStyle(document.getElementById("viewerCard")).position,
                opacityDisplay: getComputedStyle(document.getElementById("mobileSceneOpacity")).display,
                pinInside: pin.left >= card.left && pin.right <= card.right && pin.top >= card.top && pin.bottom <= card.bottom
              };
            });
            assert(!normalControls.pinned, "pin disable did not return normal viewer");
            assert(normalControls.cardPosition === "relative", "normal mobile viewer is not the controls containing block");
            assert(normalControls.opacityDisplay === "none", "opacity control remains active outside PiP");
            assert(normalControls.pinInside, "pin control escapes normal viewer card");

            const mobileOverflow = await page.locator(".flow-nav").evaluate(nav =>
              [...nav.querySelectorAll(".flow-step")].every(step => step.scrollWidth <= step.clientWidth + 1)
            );
            assert(mobileOverflow, "mobile step text overflows");

            await page.screenshot({ path: "/tmp/review/mobile-pip-normal.png", fullPage: true });
            if (errors.length) throw new Error("page errors: "+errors.join(" | "));

            fs.writeFileSync("/tmp/review/gate.json", JSON.stringify({
              pass:true, initial, offAfterStone, offAfterMdf, onStoneLight, onAfterMdf, onStoneDark,
              finishStyle, navState, pinnedControls, clamped, normalControls
            }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          cd /tmp/pw
          node gate.cjs

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-rendering-pip-gate
          path: /tmp/review
          if-no-files-found: error

      - name: Commit patch with CAS readback and remove temporary workflow
        shell: bash
        env:
          TARGET_BRANCH: feat/global-finishes-stone-mobile-pip
          EXPECTED_HEAD: \${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/fix-material-rendering-pip-temp.yml
          git add app/app.js app/styles.css app/core/stone.js app/data/catalog-data.js app/index.html app/tools/test-core.js docs/work/global-materials-mobile-pip-backlog.md

          python - <<'PY'
          import subprocess
          allowed={
            ".github/workflows/fix-material-rendering-pip-temp.yml",
            "app/app.js","app/styles.css","app/core/stone.js","app/data/catalog-data.js",
            "app/index.html","app/tools/test-core.js",
            "docs/work/global-materials-mobile-pip-backlog.md"
          }
          changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          extra=changed-allowed
          if extra:
              raise SystemExit("UNEXPECTED_STAGED:"+",".join(sorted(extra)))
          required=allowed-{".github/workflows/fix-material-rendering-pip-temp.yml"}
          missing=required-changed
          if missing:
              raise SystemExit("EXPECTED_CHANGE_MISSING:"+",".join(sorted(missing)))
          print("STAGED",sorted(changed))
          PY

          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:$remote_before!=$EXPECTED_HEAD" >&2
            exit 2
          fi

          git commit -m "fix: separate MDF material semantics and stabilize mobile PiP"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$candidate_sha"
          echo "MATERIAL_PIP_FIX base=$EXPECTED_HEAD result=$candidate_sha readback=PASS"
