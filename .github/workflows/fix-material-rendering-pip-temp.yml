name: Fix material rendering and PiP temp

on:
  push:
    branches:
      - feat/global-finishes-stone-mobile-pip
    paths:
      - .github/workflows/fix-material-rendering-pip-temp.yml

permissions:
  contents: write

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/global-finishes-stone-mobile-pip
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Apply diagnosed fixes
        run: python ops/tmp-fix-material-rendering-pip.py

      - name: Core and asset tests
        working-directory: app
        run: npm test

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Browser behavior gate
        run: |
          mkdir -p /tmp/review
          python -m http.server 4173 --directory app >/tmp/mobili-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          cp ops/tmp-material-rendering-pip-gate.cjs /tmp/pw/gate.cjs
          cd /tmp/pw
          node gate.cjs

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: material-rendering-pip-gate
          path: /tmp/review
          if-no-files-found: error

      - name: Commit patch with CAS readback and cleanup
        env:
          TARGET_BRANCH: feat/global-finishes-stone-mobile-pip
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/fix-material-rendering-pip-temp.yml
          git rm ops/tmp-fix-material-rendering-pip.py ops/tmp-material-rendering-pip-gate.cjs
          git add app/app.js app/styles.css app/core/stone.js app/data/catalog-data.js app/index.html app/tools/test-core.js docs/work/global-materials-mobile-pip-backlog.md

          python - <<'PY'
          import subprocess
          allowed={
            ".github/workflows/fix-material-rendering-pip-temp.yml",
            "ops/tmp-fix-material-rendering-pip.py",
            "ops/tmp-material-rendering-pip-gate.cjs",
            "app/app.js","app/styles.css","app/core/stone.js","app/data/catalog-data.js",
            "app/index.html","app/tools/test-core.js",
            "docs/work/global-materials-mobile-pip-backlog.md"
          }
          changed=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          extra=changed-allowed
          if extra:
              raise SystemExit("UNEXPECTED_STAGED:"+",".join(sorted(extra)))
          required={
            "app/app.js","app/styles.css","app/core/stone.js","app/data/catalog-data.js",
            "app/index.html","app/tools/test-core.js",
            "docs/work/global-materials-mobile-pip-backlog.md"
          }
          missing=required-changed
          if missing:
              raise SystemExit("EXPECTED_CHANGE_MISSING:"+",".join(sorted(missing)))
          print("STAGED",sorted(changed))
          PY

          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:$remote_before!=$EXPECTED_HEAD" >&2
            exit 2
          fi

          git commit -m "fix: separate MDF material semantics and stabilize mobile PiP"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$candidate_sha"
          echo "MATERIAL_PIP_FIX base=$EXPECTED_HEAD result=$candidate_sha readback=PASS"
