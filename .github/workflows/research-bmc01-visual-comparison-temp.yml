name: Research BMC01 visual comparison temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc01-visual-comparison-temp.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Build current variant manifest
        run: node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/current-variants.json
      - name: Rebuild candidate and review sheet
        run: |
          python -m py_compile tools/research_bmc01_minimal_completion.py
          python -m unittest tests/test_research_bmc01_minimal_completion.py
          python tools/research_bmc01_minimal_completion.py \
            --config review-assets/research/bmc01-minimal-completion-v0.1.json \
            --variant-manifest /tmp/current-variants.json \
            --output-dir review-assets/research/bmc01-minimal-completion-v0.1
          cat review-assets/research/bmc01-minimal-completion-v0.1/report.json
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmc01-minimal-completion-review
          path: |
            review-assets/research/bmc01-minimal-completion-v0.1/comparison.png
            review-assets/research/bmc01-minimal-completion-v0.1/edited.png
            review-assets/research/bmc01-minimal-completion-v0.1/candidate.png
            review-assets/research/bmc01-minimal-completion-v0.1/edit-mask.png
            review-assets/research/bmc01-minimal-completion-v0.1/report.json
          if-no-files-found: error
      - name: Commit outputs and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc01-visual-comparison-temp.yml
          git add review-assets/research/bmc01-minimal-completion-v0.1
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize BMC-01 visual comparison"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
