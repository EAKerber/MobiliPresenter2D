name: Boundary forensic audit

on:
  push:
    branches:
      - audit/boundary-forensics
    paths:
      - 'tools/audit-boundaries.py'
      - '.github/workflows/boundary-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install forensic dependencies
        run: python -m pip install pillow numpy
      - name: Run boundary audit
        run: python tools/audit-boundaries.py --output boundary-audit-output
      - name: Upload forensic maps
        uses: actions/upload-artifact@v4
        with:
          name: boundary-forensic-audit
          path: boundary-audit-output/
          if-no-files-found: error
