name: CI-BASELINE-01 verify gated V5 published preview fixture
on:
  push:
    branches:
      - ci/ci-baseline-01-published-preview-fixture-20261023
    paths:
      - scripts/build-ci-preview-fixture.mjs
      - scripts/ci-preview-build-context.mjs
      - package.json
      - plugins/ci-config-preview-fixture/**
      - tests/ci/preview-published-fixture.test.mjs
      - netlify.toml
      - .github/workflows/ci-baseline-01-published-preview-fixture.yml
      - docs/handoffs/CI_BASELINE_01_PUBLISHED_PREVIEW_2026-10-23.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install baseline dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Pure preview fixture and fail-closed source tests
        run: |
          node --check scripts/build-ci-preview-fixture.mjs
          node --check scripts/ci-preview-build-context.mjs
          node --check plugins/ci-config-preview-fixture/index.js
          node --test tests/ci/preview-published-fixture.test.mjs
          node scripts/verify-design-system-reference-pin.mjs
          node scripts/verify-vis002-contextual-token.mjs
          npm run pages:check
      - name: Ordinary build MUST remain unchanged, never publish CI data
        run: |
          npm run build
          npm run pages:check
          test ! -e .netlify/blobs/deploy/configurator-settings/published
          test ! -e app/ci-validation/build-context.json
          test ! -e app/ci-validation/published-v5-status.json
          echo CI_PRODUCTION_BUILD_HAS_NO_TEST_PUBLISHED_BLOB
      - name: No private application changes; only pinned preview OIDC additions allowed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          # App/Admin/Viewer access logic stays frozen. Preview-only OIDC files
          # are *new* isolated endpoints, not rewrites of existing functions.
          git diff --quiet origin/main...HEAD -- app/config app/admin app/access app/viewer
          mapfile -t changed < <(git diff --name-only origin/main...HEAD -- netlify/)
          for file in "${changed[@]}"; do
            case "$file" in
              netlify/access/github-oidc-ci.mjs|netlify/functions/ci-config-session.mjs)
                : # explicitly allowed preview-only addition
                ;;
              *)
                echo "::error::Unreviewed Netlify runtime change: $file"
                exit 1
                ;;
            esac
          done
          test -f netlify/access/github-oidc-ci.mjs
          test -f netlify/functions/ci-config-session.mjs
          grep -Fq 'CI_PREVIEW_ORIGIN="https://deploy-preview-235--mobilipresenter2d.netlify.app"' netlify/access/github-oidc-ci.mjs
          grep -Fq 'context?.deploy?.context==="deploy-preview"' netlify/access/github-oidc-ci.mjs
          grep -Fq 'await verifyGithubOidc(jwt)' netlify/functions/ci-config-session.mjs
          grep -Fq 'access:"config-only"' netlify/functions/ci-config-session.mjs
          echo CI_PRIVATE_APP_FROZEN_AND_PINNED_PREVIEW_OIDC_ONLY
