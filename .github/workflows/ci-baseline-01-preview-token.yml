# CI-BASELINE-01: second invitation authorized by user on 2026-10-23.
# One-shot push only. Never rerun this commit with the consumed invitation.
name: CI-BASELINE-01 one-time authenticated Config on existing preview
on:
  push:
    branches:
      - ci/ci-baseline-01-auth235-only-20261023
    paths:
      - ".github/workflows/ci-baseline-01-preview-token.yml"
      - "tests/ci/config-auth-preview-runner.mjs"
      - "tests/mobile-pip-main-browser.cjs"
      - "tests/keyboard-browser.cjs"
      - "tests/flow-layout-browser.cjs"
      - "tests/summary-pricing-browser.cjs"
      - "tests/stone-browser.cjs"
      - "docs/handoffs/CI_BASELINE_01_PREVIEW_TOKEN_2026-10-23.md"
permissions:
  contents: read
concurrency:
  group: ci-baseline-01-preview-token-once
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate existing browser test syntax and one-time runner
        run: |
          node --check tests/ci/config-auth-preview-runner.mjs
          for f in tests/mobile-pip-main-browser.cjs tests/keyboard-browser.cjs tests/flow-layout-browser.cjs tests/summary-pricing-browser.cjs tests/stone-browser.cjs; do
            node --check "$f"
          done
      - name: Ensure validated Netlify PR #235 is reachable before touching secret
        run: |
          curl --fail --silent --show-error --location --max-time 20 \
            https://deploy-preview-235--mobilipresenter2d.netlify.app/access/ \
            --output /tmp/ci-access-page
          grep -q 'id="confirmAccess"' /tmp/ci-access-page
          status=$(curl --silent --show-error --max-time 15 -o /tmp/ci-anon-buyer -w '%{http_code}' \
            https://deploy-preview-235--mobilipresenter2d.netlify.app/api/buyer-configuration)
          case "$status" in
            401|403) echo CI_ANONYMOUS_BUYER_GUARD_PASS ;;
            *) echo "Expected protected buyer API 401/403; received $status"; exit 1 ;;
          esac
          for marker in build-context.json published-v5-status.json; do
            code=$(curl --silent --show-error --max-time 20 \
              --output "/tmp/ci-${marker}" --write-out '%{http_code}' \
              "https://deploy-preview-235--mobilipresenter2d.netlify.app/ci-validation/${marker}")
            echo "CI_PREVIEW_MARKER_STATUS name=${marker} http=${code}"
            test "$code" = "200" || exit 1
          done
          node -e 'const x=require("/tmp/ci-build-context.json");if(x.schema!=="M2DCIPreviewBuildContext/1"||x.reviewId!==235||!x.branchMatches||!x.hasDeployId||!x.hasSiteId)process.exit(1);console.log("CI_PREVIEW_BUILD_CONTEXT_PASS")'
          # The preview Build Plugin must expose a nonsecret artifact only
          # AFTER writing/reading back V5 in the deploy-only Blob Store.
          curl --fail --silent --show-error --max-time 20 \
            https://deploy-preview-235--mobilipresenter2d.netlify.app/ci-validation/published-v5-status.json \
            --output /tmp/ci-fixture-status.json
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("/tmp/ci-fixture-status.json","utf8"));if(x.schema!=="M2DPreviewPublishedFixtureStatus/1"||x.reviewId!==235||x.verified!==true||x.store!=="configurator-settings"||!/^[a-f0-9]{64}$/.test(x.sha256))process.exit(1);console.log("CI_PREVIEW_PUBLISHED_MARKER_PASS")'
          echo CI_CONFIG_PREVIEW_PREFLIGHT_PASS
  authenticated:
    needs: preflight
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[auth-fixture-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ci-auth-preview
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies without Netlify deploy
        run: |
          npm install --prefix /tmp/m2d-ci-token-playwright --no-audit --no-fund playwright@1.56.0
          ln -s /tmp/m2d-ci-token-playwright/node_modules ./node_modules
      - name: Redeem user-supplied one-time secret and run five authenticated suites
        env:
          CI_CONFIG_TEST_TOKEN: ${{ secrets.CI_CONFIG_TEST_TOKEN }}
        run: node tests/ci/config-auth-preview-runner.mjs
      - name: Do not publish session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-config-authenticated-preview-sanitized
          path: artifacts/ci-baseline-01/preview-invitation.json
          retention-days: 7
          if-no-files-found: warn
