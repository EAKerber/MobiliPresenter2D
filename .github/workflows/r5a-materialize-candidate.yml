name: R5A materialize review candidate

on:
  push:
    branches:
      - work/r5a-module02-hidden
    paths:
      - 'review-assets/recipes/module-03-left-termination-e-rounded-9px.json'
      - 'review-assets/roles.json'
      - 'review-assets/authoring-contracts.json'
      - 'tools/materialize_candidate_recipe.py'
      - 'tools/extract_candidate_delta.py'
      - 'tools/validate_candidate_assets.py'
      - 'tools/validate_authoring_provenance.py'
      - '.github/workflows/r5a-materialize-candidate.yml'
  workflow_dispatch:

concurrency:
  group: r5a-module02-hidden-materialize
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[r5a-candidate-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Render exact target variant
        run: |
          mkdir -p /tmp/r5a-materialize/variants
          node tools/variant_fidelity_manifest.js \
            --cases reference/variant-cases.json \
            --output /tmp/r5a-materialize/variant-manifest.json
          python tools/render_variant_fidelity.py \
            --manifest /tmp/r5a-materialize/variant-manifest.json \
            --output-dir /tmp/r5a-materialize/variants
      - name: Materialize deterministic termination candidate
        run: |
          python tools/materialize_candidate_recipe.py \
            --recipe review-assets/recipes/module-03-left-termination-e-rounded-9px.json \
            --source-frame /tmp/r5a-materialize/variants/module-02-hidden.png \
            --variant-manifest /tmp/r5a-materialize/variant-manifest.json \
            --output-dir review-assets/candidates/module-03-left-termination-e-rounded-9px
      - name: Validate materialized candidate before commit
        run: |
          python tools/validate_candidate_assets.py \
            --output /tmp/r5a-materialize/intake.json
          python tools/validate_authoring_provenance.py \
            --output /tmp/r5a-materialize/provenance.json
          cat /tmp/r5a-materialize/intake.json
          cat /tmp/r5a-materialize/provenance.json
      - name: Commit generated review candidate
        shell: bash
        env:
          TARGET_BRANCH: work/r5a-module02-hidden
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add review-assets/candidates/module-03-left-termination-e-rounded-9px
          if git diff --cached --quiet; then
            echo 'R5A_CANDIDATE_MATERIALIZATION_NO_CHANGE readback=PASS'
            exit 0
          fi
          git commit -m 'R5A: materialize module 03 termination candidate [r5a-candidate-materialized]'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:${remote_before}!=${EXPECTED_HEAD}" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_after" != "$candidate_sha" ]; then
            echo "TARGET_READBACK_FAILED:${remote_after}!=${candidate_sha}" >&2
            exit 2
          fi
          echo "R5A_CANDIDATE_MATERIALIZATION_RECEIPT base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"
