name: Materialize stone bridge fix

on:
  push:
    branches:
      - fix/stone-bridge-host-coverage
    paths:
      - '.github/workflows/materialize-stone-bridge-temp.yml'
      - 'tools/build_approved_stone.py'
      - 'tests/test_stone_surface_masks.py'

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[stone-bridge-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Verify bridge ownership regression
        run: python -m unittest tests/test_stone_surface_masks.py
      - name: Materialize corrected stone bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/stone-bridge-materialized
          python tools/build_approved_stone.py --output-dir /tmp/stone-bridge-materialized
          cp /tmp/stone-bridge-materialized/stone-data.js app/data/stone-data.js
      - name: Refresh and validate canonical baseline
        run: |
          set -euo pipefail
          python tools/refresh-baseline-manifest.py
          python tools/validate-baseline.py
      - name: Preserve app runtime contract
        working-directory: app
        run: npm test
      - name: Commit generated derivatives with CAS readback
        shell: bash
        env:
          TARGET_BRANCH: fix/stone-bridge-host-coverage
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(app/data/stone-data\.js|reference/baseline-manifest\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "UNEXPECTED_GENERATED_FILES" >&2
            printf '%s\n' "$unexpected" >&2
            exit 2
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'app/data/stone-data.js'; then
            echo 'STONE_DATA_NOT_CHANGED' >&2
            exit 2
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/data/stone-data.js reference/baseline-manifest.json
          git rm .github/workflows/materialize-stone-bridge-temp.yml
          git commit -m 'Stone: materialize bridge host masks [stone-bridge-materialized]'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:${remote_before}!=${EXPECTED_HEAD}" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_after" != "$candidate_sha" ]; then
            echo "TARGET_READBACK_FAILED:${remote_after}!=${candidate_sha}" >&2
            exit 2
          fi
          echo "STONE_BRIDGE_MATERIALIZATION_RECEIPT base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"
