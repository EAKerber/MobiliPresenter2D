name: Development 10 — legacy a11y fallback semantic supersession (offline)

on:
  push:
    branches:
      - development
    paths:
      - 'tools/development_a11y_fallback_semantic_audit.py'
      - 'tests/public-image-fallback.test.mjs'
      - 'tests/public-image-fallback-browser.mjs'
      - 'app/core/image-fallback.js'
      - 'app/how-it-works/**'
      - 'architecture/pages/how-it-works.page.html'
      - '.github/workflows/development-a11y-semantic-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-contract:
    name: Pinned legacy scope and current reusable image handler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and pin exact original and main commits
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags origin '+refs/heads/a11y/image-failure-scalable-placeholder-20261025:refs/remotes/origin/a11y/image-failure-scalable-placeholder-20261025'
          test "$(git rev-parse origin/a11y/image-failure-scalable-placeholder-20261025)" = 6840d8986e44a7860b541e6becb3b5373ef48c09
      - name: Verify legacy behavior was superseded without copying HTML or JS
        run: |
          python3 -m py_compile tools/development_a11y_fallback_semantic_audit.py
          python3 tools/development_a11y_fallback_semantic_audit.py
          node --check app/core/image-fallback.js
          node --check app/how-it-works/how-it-works.js
          node tests/public-image-fallback.test.mjs
          npm run pages:check

  local-browser:
    name: Chromium + WebKit 16 viewports/routes, 152 image failure/recovery cases
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real publish folder, no Netlify deployment
        run: |
          npm install --no-save --no-package-lock esbuild@0.28.2 playwright@1.56.0
          npm run build
          npm run pages:check
      - name: Serve only local built site
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory app >/tmp/a11y-fallback-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8123/how-it-works/ >/dev/null
      - name: Verify 19 informative frames, alt, contrast, layout, keyboard, error and recovery
        run: node tests/public-image-fallback-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-a11y-image-fallback-${{ github.run_id }}
          path: artifacts/public-image-fallback-browser/report.json
          if-no-files-found: warn
          retention-days: 30
