name: Main app snapshot

on:
  push:
    branches: [audit/boundary-forensics]
    paths:
      - '.github/workflows/main-app-snapshot.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-artifact@v4
        with:
          name: main-app-snapshot
          path: app
          if-no-files-found: error
