name: Research BMC04 final deterministic gate temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc04-final-pre-gen-temp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Validate ready-for-generation state
        run: |
          python -m unittest             tests/test_validate_reconstruction_packet.py             tests/test_research_bmc04_generation_input.py             tests/test_research_bmc04_post_generation_gate.py
          python tools/validate_reconstruction_packet.py             review-assets/research/bmc04-cooktop-bounded-generation-v0.1.json
          python - <<'PY'
          import json
          p=json.load(open("review-assets/research/bmc04-cooktop-bounded-generation-v0.1.json"))
          r=json.load(open("review-assets/research/bmc04-generation-input-v0.2/receipt.json"))
          assert p["generationGuide"]["status"]=="READY_FOR_BOUNDED_GENERATION"
          assert r["status"]=="READY_FOR_BOUNDED_GENERATION"
          assert p["generationGuide"]["postFitBudget"]["projectiveWarpAllowed"] is False
          assert p["editContract"]["directGeneratedPromotionAllowed"] is False
          print("BMC04_READY_FOR_ISOLATED_GENERATION")
          PY
      - name: Self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc04-final-pre-gen-temp.yml
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "chore: self-clean BMC-04 final pre-generation gate"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
