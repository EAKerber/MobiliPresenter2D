name: Merged PR head hygiene (proven preservation)

on:
  pull_request_target:
    types: [closed]
    branches: [main, development]

concurrency:
  group: m2d-branch-hygiene-mutations
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'development' && !startsWith(github.event.pull_request.head.ref, 'archive/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Never execute code from a PR head. The policy and executor live on main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact merged head and preservation before leased deletion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOBILIPRESENTER2D_BRANCH_HYGIENE_AUTHORIZED: '1'
        run: |
          python tools/branch_hygiene_merged_pr_cleanup.py \
            --event "$GITHUB_EVENT_PATH" \
            --receipt /tmp/merged-pr-head-cleanup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2d-merged-pr-head-cleanup-${{ github.run_id }}
          path: /tmp/merged-pr-head-cleanup.json
          if-no-files-found: warn
