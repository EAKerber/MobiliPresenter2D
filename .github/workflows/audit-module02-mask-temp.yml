name: Audit module02 finish mask temp
on:
  push:
    branches: [audit/module02-finish-mask]
    paths: ['.github/workflows/audit-module02-mask-temp.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Locate mask04 leakage
        run: |
          python - <<'PY'
          import json
          from PIL import Image, ImageChops
          layer=Image.open('app/assets/kitchen/layers/04_lateral_geladeira.png').convert('RGBA').getchannel('A')
          mask=Image.open('app/assets/kitchen/masks/04.png').convert('RGBA').getchannel('A')
          la=layer.point(lambda v:255 if v else 0); ma=mask.point(lambda v:255 if v else 0)
          outside=ImageChops.multiply(ma,ImageChops.invert(la))
          coords=[]
          px=outside.load()
          bbox=outside.getbbox()
          if bbox:
            for y in range(bbox[1],bbox[3]):
              for x in range(bbox[0],bbox[2]):
                if px[x,y]: coords.append([x,y])
          by_x={}; by_y={}
          for x,y in coords:
            by_x[str(x)]=by_x.get(str(x),0)+1;by_y[str(y)]=by_y.get(str(y),0)+1
          print(json.dumps({'outsidePixels':len(coords),'bbox':list(bbox) if bbox else None,'coords':coords,'byX':by_x,'byY':by_y},sort_keys=True))
          PY
