name: Materialize module04 seam composite v2 temp
on:
  push:
    branches: [fix/module04-seam-bridge]
    paths:
      - '.github/workflows/materialize-module04-seam-composite-v2-temp.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements.txt
      - name: Apply migration and validate
        run: |
          python tools/apply-module04-seam-composite-migration.py
          cd app
          python tools/build-front-seam-masks.py
          python tools/build-inline-masks.py
          python tools/update-technical-data.py
          npm test
          cd ..
          python tools/refresh-baseline-manifest.py
          python tools/validate-baseline.py
      - name: Commit generated implementation with CAS readback
        env:
          TARGET_BRANCH: fix/module04-seam-bridge
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app reference/baseline-manifest.json
          git diff --cached --name-only
          git commit -m 'Render external 04-06 seam through conditional composite mask'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_after" = "$candidate_sha"
          echo "MODULE04_SEAM_COMPOSITE base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"
