name: Boundary forensic audit v2

on:
  push:
    branches:
      - audit/boundary-forensics
    paths:
      - 'tools/audit-boundaries-v2.py'
      - '.github/workflows/boundary-audit-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow numpy
      - run: python tools/audit-boundaries-v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: boundary-forensic-audit-v2
          path: boundary-audit-v2-output/
          if-no-files-found: error
