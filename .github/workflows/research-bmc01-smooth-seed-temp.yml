name: Research BMC01 smooth seed completion temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-bmc01-smooth-seed-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Build current variant manifest
        run: node tools/variant_fidelity_manifest.js --cases reference/variant-cases.json --output /tmp/current-variants.json
      - name: Test and run smooth-seed completion
        run: |
          python -m py_compile tools/research_bmc01_minimal_completion.py
          python -m unittest tests/test_research_bmc01_minimal_completion.py
          rm -rf review-assets/research/bmc01-minimal-completion-v0.4
          python tools/research_bmc01_minimal_completion.py             --config review-assets/research/bmc01-minimal-completion-v0.4.json             --variant-manifest /tmp/current-variants.json             --output-dir review-assets/research/bmc01-minimal-completion-v0.4
          python - <<'PY'
          import json
          out={}
          for v in ("v0.2","v0.3","v0.4"):
              r=json.load(open(f"review-assets/research/bmc01-minimal-completion-{v}/report.json"))
              out[v]={
                "editMaskPixels":r["editMaskPixels"],
                "boundaryAfter":r["boundaryColorErrorAfter"],
                "contactAfter":r["sameObjectContactErrorAfter"],
                "roughness":r.get("candidateRowRoughness"),
                "appearanceMode":r.get("appearanceMode"),
                "continuationMode":r.get("continuationMode"),
                "promotedSoft":r.get("promotedSoftHostRgbPixels"),
                "residualFill":r.get("nearestFilledResidualPixels"),
                "fillStats":r.get("donorDistance")
              }
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Commit candidate and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-bmc01-smooth-seed-temp.yml
          git add review-assets/research/bmc01-minimal-completion-v0.4
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize smooth-seed BMC-01 completion"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
