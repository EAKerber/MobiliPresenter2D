name: Legacy context audit

on:
  push:
    branches:
      - audit/boundary-forensics
    paths:
      - 'tools/audit-legacy-context.py'
      - '.github/workflows/legacy-context-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tools/audit-legacy-context.py
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-context-audit
          path: legacy-context-audit-output/
          if-no-files-found: error
