name: Refine white tags swipe and front guides temp

on:
  push:
    branches:
      - feat/global-finishes-stone-mobile-pip
    paths:
      - .github/workflows/refine-white-tags-swipe-guides-temp.yml

permissions:
  contents: write

jobs:
  patch-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-finishes-stone-mobile-pip
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Materialize persistent front-guide builder
        run: cp ops/tmp-build-front-guides.py app/tools/build-front-guides.py

      - name: Apply refinements and derive guides
        run: python ops/tmp-b10-b13.py

      - name: Verify front-guide derivation is reproducible
        run: |
          cp app/data/front-guide-data.js /tmp/front-guide-data.before.js
          python app/tools/build-front-guides.py
          cmp /tmp/front-guide-data.before.js app/data/front-guide-data.js

      - name: Syntax and deterministic gates
        run: |
          node --check app/app.js
          node --check app/data/catalog-data.js
          node --check app/data/front-guide-data.js
          python -m py_compile app/tools/build-front-guides.py
          cd app
          npm test

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser behavior gate
        run: |
          mkdir -p /tmp/review
          python -m http.server 4173 --directory app >/tmp/mobili-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          cp ops/tmp-b10-b13-gate.cjs /tmp/pw/gate.cjs
          cd /tmp/pw
          node gate.cjs

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: b10-b13-white-tags-swipe-guides
          path: /tmp/review
          if-no-files-found: error

      - name: Commit with CAS and self-cleanup
        env:
          TARGET_BRANCH: feat/global-finishes-stone-mobile-pip
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/refine-white-tags-swipe-guides-temp.yml
          git rm ops/tmp-b10-b13.py ops/tmp-b10-b13-gate.cjs ops/tmp-build-front-guides.py
          git add             app/app.js             app/styles.css             app/data/catalog-data.js             app/data/front-guide-data.js             app/index.html             app/tools/build-front-guides.py             app/tools/test-core.js             docs/work/global-materials-mobile-pip-backlog.md

          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:$remote_before!=$EXPECTED_HEAD" >&2
            exit 2
          fi

          git commit -m "feat: refine white navigation and seam-guided drawings"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
          echo "B10_B13_RESULT=$result"
