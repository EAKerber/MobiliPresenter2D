name: Stone browser
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/stone-browser.cjs'
      - '.github/workflows/stone-browser.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'tests/stone-browser.cjs'
      - '.github/workflows/stone-browser.yml'
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional deployed URL for a production smoke test
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test runtime configuration contracts
        run: node app/tools/test-runtime-contracts.js
      - name: Resolve browser target
        shell: bash
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            target="${{ inputs.target_url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            target="https://deploy-preview-${{ github.event.pull_request.number }}--mobilipresenter2d.netlify.app/config/"
          else
            target="https://mobilipresenter2d.netlify.app/config/"
          fi
          echo "STONE_BROWSER_URL=$target" >> "$GITHUB_ENV"
          echo "Browser target: $target"
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/stone-browser-tools --no-audit --no-fund playwright@1.62.1
          /tmp/stone-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test current stone and skirting controls
        env:
          NODE_PATH: /tmp/stone-browser-tools/node_modules
        run: node tests/stone-browser.cjs /tmp/stone-browser-review
      - name: Save interface review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stone-browser-${{ github.run_id }}
          path: /tmp/stone-browser-review
          if-no-files-found: ignore
