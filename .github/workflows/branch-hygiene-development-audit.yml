name: Development squash hygiene audit only

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/branch-hygiene-development-batch.json'
      - 'ops/branch-dispositions-development.json'
      - 'tools/branch_hygiene_plan.py'
      - 'tools/branch_hygiene_apply.py'
      - 'tests/test_branch_hygiene_*.py'
      - '.github/workflows/branch-hygiene-development-audit.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -p 'test_branch_hygiene_*.py'
          python -m py_compile tools/branch_hygiene_observe.py tools/branch_hygiene_plan.py tools/branch_hygiene_apply.py
      - name: Detect fresh manifest change
        id: manifest-change
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$PR_BASE_SHA"...HEAD -- ops/branch-hygiene-development-batch.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: SHA-pinned development audit, never apply
        if: steps.manifest-change.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/branch_hygiene_observe.py --control development --output /tmp/dev-observation.json
          python tools/branch_hygiene_plan.py --observation /tmp/dev-observation.json --dispositions ops/branch-dispositions-development.json --output /tmp/dev-plan.json >/dev/null
          python tools/branch_hygiene_apply.py \
            --plan /tmp/dev-plan.json \
            --dispositions ops/branch-dispositions-development.json \
            --expected-plan "$(python -c 'import json; print(json.load(open("/tmp/dev-plan.json"))["planHash"])')" \
            --batch ops/branch-hygiene-development-batch.json \
            --receipt /tmp/dev-receipt.json \
            --audit-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-dev-branch-audit-${{ github.run_id }}
          path: /tmp/dev-receipt.json
          if-no-files-found: warn
