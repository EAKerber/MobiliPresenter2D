name: Development CP-PUBLIC historical PR lineage (offline)
on:
  push:
    branches:
      - development
    paths:
      - 'docs/work/DEVELOPMENT_CP_PUBLIC_PR_LINEAGE_2026-10-28.md'
      - 'tests/test_development_cp_public_lineage.py'
      - '.github/workflows/development-cp-public-lineage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Offline full-history, endpoints, PR and source proof without external services
        run: python3 -m unittest discover -s tests -p test_development_cp_public_lineage.py -v
