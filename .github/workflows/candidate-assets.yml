name: Current asset gates

on:
  pull_request:
    paths:
      - 'app/**'
      - 'review-assets/**'
      - 'reference/variant-cases.json'
      - 'reference/visual-debt.md'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/candidate-assets.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'review-assets/**'
      - 'reference/variant-cases.json'
      - 'reference/visual-debt.md'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/candidate-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-asset-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Unit-test current candidate contracts
        run: >-
          python -m unittest
          tests/test_candidate_asset_gates.py
          tests/test_candidate_asset_sets.py
          tests/test_candidate_delta_authoring.py
          tests/test_candidate_authoring_provenance.py
          tests/test_perspective_editorial_gate.py
          tests/test_gap_parallelism_gate.py
          tests/test_gap_pixel_gate.py
          tests/test_faucet_edge.py
      - name: Validate current app runtime and asset invariants
        working-directory: app
        run: npm test
      - name: Derive current target variants
        run: |
          mkdir -p /tmp/candidate-review
          node tools/variant_fidelity_manifest.js \
            --cases reference/variant-cases.json \
            --output /tmp/candidate-review/variant-manifest.json
          python tools/render_variant_fidelity.py \
            --manifest /tmp/candidate-review/variant-manifest.json \
            --output-dir /tmp/candidate-review/variants
      - name: Validate approved stone runtime integration
        run: |
          python tools/validate_approved_stone.py \
            --manifest /tmp/candidate-review/variant-manifest.json \
            --output-dir /tmp/candidate-review/approved-stone
      - name: Verify approved faucet runtime pixels and host visibility
        run: |
          python tools/validate_approved_faucet.py \
            --manifest /tmp/candidate-review/variant-manifest.json \
            --output-dir /tmp/candidate-review/approved-faucet
      - name: Verify approved range runtime pixels
        run: |
          python tools/validate_approved_range.py \
            --manifest /tmp/candidate-review/variant-manifest.json \
            --output-dir /tmp/candidate-review/approved-range
      - name: Structural candidate intake
        run: |
          python tools/validate_candidate_assets.py --output /tmp/candidate-review/intake.json
          cat /tmp/candidate-review/intake.json
      - name: Validate candidate authoring provenance
        run: |
          python tools/validate_authoring_provenance.py --output /tmp/candidate-review/authoring-provenance.json
          cat /tmp/candidate-review/authoring-provenance.json
      - name: Upload current review evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-asset-review-${{ github.run_id }}
          path: /tmp/candidate-review
          if-no-files-found: error
