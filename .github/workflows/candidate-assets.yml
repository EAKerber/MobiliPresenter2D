name: Candidate asset gates

on:
  pull_request:
    paths:
      - 'app/**'
      - 'review-assets/**'
      - 'reference/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/candidate-assets.yml'
      - 'docs/work/r5a-module02-hidden.md'
  push:
    branches:
      - main
      - work/r5a-module02-hidden
    paths:
      - 'app/**'
      - 'review-assets/**'
      - 'reference/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/candidate-assets.yml'
      - 'docs/work/r5a-module02-hidden.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-r5a:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/work/r5a-module02-hidden' && !contains(github.event.head_commit.message, '[r5a-pixelperfect-materialized]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Materialize accepted deterministic R5A edits
        working-directory: app
        run: |
          npm run build:stone-layers
          npm run build:r5a-pixelperfect
          npm run build:inline-masks
          npm run build:technical-data
          npm test
      - name: Refresh canonical baseline manifest
        run: |
          python tools/refresh-baseline-manifest.py
          python tools/validate-baseline.py
      - name: Derive target variants before candidate materialization
        run: |
          mkdir -p /tmp/r5a-materialize/variants
          node tools/variant_fidelity_manifest.js \
            --cases reference/variant-cases.json \
            --output /tmp/r5a-materialize/variant-manifest.json
          python tools/render_variant_fidelity.py \
            --manifest /tmp/r5a-materialize/variant-manifest.json \
            --output-dir /tmp/r5a-materialize/variants
      - name: Materialize generated-donor range candidate
        run: |
          python tools/materialize_range_donor_recipe.py \
            --recipe review-assets/recipes/range-freestanding-generated-donor-v1.json \
            --source-frame /tmp/r5a-materialize/variants/module-02-hidden.png \
            --variant-manifest /tmp/r5a-materialize/variant-manifest.json \
            --output-dir review-assets/candidates/range-freestanding-generated-donor-v1
          python tools/validate_candidate_assets.py --output /tmp/r5a-materialize/intake.json
          python tools/validate_authoring_provenance.py --output /tmp/r5a-materialize/provenance.json
      - name: Commit generated R5A assets with CAS readback
        shell: bash
        env:
          TARGET_BRANCH: work/r5a-module02-hidden
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/assets/kitchen/layers/stone-02-cozinha.png \
            app/assets/kitchen/variants/stone-02-cozinha-exposed-right.png \
            app/assets/kitchen/variants/stone-03-pia-exposed-left.png \
            app/assets/kitchen/bridges/stone-02-joint-bridge.png \
            app/assets/kitchen/bridges/stone-03-joint-bridge.png \
            app/assets/kitchen/masks/02.png \
            app/assets/kitchen/composicao-completa.png \
            app/data/mask-data.js \
            app/data/technical-data.json \
            app/reports/r5a-pixelperfect-materialization.json \
            app/reports/r5a-pixelperfect-gate.json \
            reference/baseline-manifest.json \
            review-assets/candidates/range-freestanding-generated-donor-v1
          if git diff --cached --quiet; then
            echo 'R5A_PIXELPERFECT_MATERIALIZATION_NO_CHANGE readback=PASS'
            exit 0
          fi
          git commit -m 'R5A: materialize pixel-perfect edits and range candidate [r5a-pixelperfect-materialized]'
          candidate_sha="$(git rev-parse HEAD)"
          remote_before="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_before" != "$EXPECTED_HEAD" ]; then
            echo "TARGET_HEAD_DRIFT:${remote_before}!=${EXPECTED_HEAD}" >&2
            exit 2
          fi
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          if [ "$remote_after" != "$candidate_sha" ]; then
            echo "TARGET_READBACK_FAILED:${remote_after}!=${candidate_sha}" >&2
            exit 2
          fi
          echo "R5A_PIXELPERFECT_MATERIALIZATION_RECEIPT base=${EXPECTED_HEAD} result=${candidate_sha} readback=PASS"

  candidate-gates:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/work/r5a-module02-hidden' || contains(github.event.head_commit.message, '[r5a-pixelperfect-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Unit-test candidate gates
        run: >-
          python -m unittest
          tests/test_candidate_asset_gates.py
          tests/test_candidate_asset_sets.py
          tests/test_candidate_delta_authoring.py
          tests/test_candidate_authoring_provenance.py
      - name: Preserve canonical baseline
        run: python tools/validate-baseline.py
      - name: Preserve app runtime and R5A pixel-perfect invariants
        working-directory: app
        run: npm test
      - name: Derive target variants
        run: |
          mkdir -p /tmp/candidate-review
          node tools/variant_fidelity_manifest.js \
            --cases reference/variant-cases.json \
            --output /tmp/candidate-review/variant-manifest.json
          python tools/render_variant_fidelity.py \
            --manifest /tmp/candidate-review/variant-manifest.json \
            --output-dir /tmp/candidate-review/variants
      - name: Structural candidate intake
        run: |
          python tools/validate_candidate_assets.py --output /tmp/candidate-review/intake.json
          cat /tmp/candidate-review/intake.json
      - name: Validate authoring provenance
        run: |
          python tools/validate_authoring_provenance.py --output /tmp/candidate-review/authoring-provenance.json
          cat /tmp/candidate-review/authoring-provenance.json
      - name: Compose individual visual review gates
        run: |
          python tools/render_candidate_review.py \
            --variant-manifest /tmp/candidate-review/variant-manifest.json \
            --variant-render-dir /tmp/candidate-review/variants \
            --intake-report /tmp/candidate-review/intake.json \
            --output-dir /tmp/candidate-review/candidates
          cat /tmp/candidate-review/candidates/summary.json
      - name: Compose stacked candidate-set gates
        run: |
          python tools/render_candidate_set_review.py \
            --sets review-assets/candidate-sets.json \
            --variant-manifest /tmp/candidate-review/variant-manifest.json \
            --variant-render-dir /tmp/candidate-review/variants \
            --intake-report /tmp/candidate-review/intake.json \
            --output-dir /tmp/candidate-review/sets
          cat /tmp/candidate-review/sets/summary.json
      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-asset-review-${{ github.run_id }}
          path: /tmp/candidate-review
          if-no-files-found: error
