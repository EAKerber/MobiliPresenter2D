name: Research M02 same-object side probe temp

on:
  push:
    branches:
      - research/reconstruction-architecture-v0.1
    paths:
      - .github/workflows/research-m02-side-probe-temp.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconstruction-architecture-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install -r tools/requirements.txt
      - name: Test and run same-object side probe
        run: |
          python -m py_compile tools/research_scene_projective_consistency.py
          python -m unittest tests/test_research_scene_projective_consistency.py
          python tools/research_scene_projective_consistency.py             --config review-assets/research/scene-projective-consistency-v0.1.json             --output review-assets/research/scene-projective-consistency-v0.1-report.json
          python - <<'PY'
          import json
          d=json.load(open("review-assets/research/scene-projective-consistency-v0.1-report.json"))
          print(json.dumps({
            "module02":d["residualSideProbes"].get("module-02-existing-right-side"),
            "module01VP":d["module01TwoEdgeVanishingFit"],
            "classification":d["preliminaryClassification"],
          },sort_keys=True))
          PY
      - name: Commit report and self-clean with CAS
        env:
          TARGET_BRANCH: research/reconstruction-architecture-v0.1
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/research-m02-side-probe-temp.yml
          git add review-assets/research/scene-projective-consistency-v0.1-report.json
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_before" = "$EXPECTED_HEAD"
          git commit -m "research: materialize Module 02 same-object side probe"
          result="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_after" = "$result"
