[build]
  publish = "app"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/configuration"
  to = "/.netlify/functions/configuration"
  status = 200
  force = true

# Buyer read model: server guard remains admin-only until customer sessions exist.
[[redirects]]
  from = "/api/buyer-configuration"
  to = "/.netlify/functions/buyer-configuration"
  status = 200
  force = true
