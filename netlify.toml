[build]
  publish = "app"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/configuration"
  to = "/.netlify/functions/configuration"
  status = 200
  force = true

[[redirects]]
  from = "/api/buyer-configuration"
  to = "/.netlify/functions/buyer-configuration"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-bootstrap"
  to = "/.netlify/functions/admin-bootstrap"
  status = 200
  force = true

[[redirects]]
  from = "/api/access/session/logout"
  to = "/.netlify/functions/access-session-logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/access/session"
  to = "/.netlify/functions/access-session-status"
  status = 200
  force = true

# CP-PUBLIC-04a: public schema-driven read projection; no preview seeds.
[[redirects]]
  from = "/api/public-modules"
  to = "/.netlify/functions/public-modules"
  status = 200
  force = true

# Keep old landing-page URLs usable after moving their canonical paths to the site root.
[[redirects]]
  from = "/landing"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/landing/como-funciona"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/landing/como-funciona/"
  to = "/how-it-works/"
  status = 301

[[redirects]]
  from = "/landing/quem-somos"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/landing/quem-somos/"
  to = "/about/"
  status = 301

[[context.deploy-preview.plugins]]
  package = "./netlify/plugins/ci-v5-fixture"
