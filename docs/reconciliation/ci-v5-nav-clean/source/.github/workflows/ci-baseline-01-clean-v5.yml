name: CI-BASELINE-01 clean V5 navigation and Flow gates (no secrets)
on:
  push:
    branches:
      - fix/ci-baseline-v5-nav-flow-clean-20261023
    paths:
      - "app/styles.css"
      - "tests/flow-layout-browser.cjs"
      - "tests/ci/ci-baseline-clean-v5.mjs"
      - "tests/ci/local-buyer-config-server.mjs"
      - "tests/ci/nav-flow-profile-crossbrowser.mjs"
      - "tests/ci/nav-css-visual-differential.mjs"
      - ".github/workflows/ci-baseline-01-clean-v5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch frozen CSS baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Install browser and bundle dependencies in ephemeral container
        run: |
          npm install --prefix /tmp/m2d-v5-clean --no-audit --no-fund playwright@1.56.0 esbuild@0.28.2 @netlify/identity@2.0.0
          ln -s /tmp/m2d-v5-clean/node_modules ./node_modules
      - name: Build production-equivalent private scripts
        run: |
          npm run build
          test -s app/core/private-navigation.bundle.js
      - name: Start localhost-only validated V5 projection
        run: |
          node tests/ci/local-buyer-config-server.mjs > /tmp/ci-clean-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8123/config/ --output /dev/null
          curl --fail --silent http://127.0.0.1:8123/api/buyer-configuration --output /dev/null
      - name: Run all five unchanged functional assertions through current V5
        run: node tests/ci/ci-baseline-clean-v5.mjs
      - name: Gate stage geometry and navigation in Chromium and WebKit
        run: node tests/ci/nav-flow-profile-crossbrowser.mjs
      - name: Gate navigation visual parity with main CSS
        run: node tests/ci/nav-css-visual-differential.mjs
      - name: Preserve sanitized hashes and geometry only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-baseline-clean-v5-nav-visual
          path: artifacts/ci-baseline-01/nav-visual-differential.json
          retention-days: 7
          if-no-files-found: ignore
