name: CI-BASELINE-01 navigation compact-label width boundary (no secrets)
on:
  push:
    branches:
      - fix/ci-baseline-v5-nav-flow-clean-20261023
    paths:
      - "tests/ci/nav-label-width-boundary.mjs"
      - ".github/workflows/ci-baseline-01-nav-boundary.yml"
      - "app/styles.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nav-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch frozen reference CSS
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Install ephemeral browser prerequisites
        run: |
          npm install --prefix /tmp/m2d-v5-boundary --no-audit --no-fund playwright@1.56.0 esbuild@0.28.2 @netlify/identity@2.0.0
          ln -s /tmp/m2d-v5-boundary/node_modules ./node_modules
      - name: Build current private scripts and serve synthetic validated V5
        run: |
          npm run build
          node tests/ci/local-buyer-config-server.mjs > /tmp/ci-boundary-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8123/config/ --output /dev/null
      - name: Verify nav label threshold pixel-for-pixel in two engines
        run: node tests/ci/nav-label-width-boundary.mjs
