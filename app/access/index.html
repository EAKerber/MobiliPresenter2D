<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <script src="/core/ui-theme.js?v=ds01-theme-v1"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f5f2">
  <title>Acesso ao configurador | Casa em Módulos</title>
  <link rel="stylesheet" href="/public-theme.css">
  <link rel="stylesheet" href="/ui-theme.css?v=private-header-v1">
  <style>
    body { min-height: 100vh; display: block; padding: 0; }
    main { width: min(calc(100% - 32px), 520px); margin: clamp(34px, 8vh, 76px) auto; padding: clamp(24px, 6vw, 44px); border: 1px solid var(--public-line); border-radius: 18px; background: var(--public-surface); box-shadow: var(--public-shadow); }
    .eyebrow { margin: 0 0 10px; color: var(--public-accent-dark); font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.08; letter-spacing: -.045em; }
    p { color: var(--public-muted); line-height: 1.6; }
    button { width: 100%; min-height: 50px; margin-top: 12px; border: 0; border-radius: 8px; background: var(--public-accent-dark); color: white; font-weight: 750; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    [role="status"] { min-height: 1.6em; }
    .back { display: inline-block; margin-top: 16px; color: var(--public-accent-dark); }
  </style>
</head>
<body class="access-page">
  <header class="private-header access-private-header" data-private-header>
    <a class="private-header__brand" href="/" aria-label="Casa em Módulos, início"><img data-brand-variant data-src-light="/branding/logo-light-380.png" data-src-dark="/branding/logo-dark-380.png" src="/branding/logo-light-380.png" width="380" height="136" alt="Casa em Módulos"><span class="private-header__page-name">Confirmar acesso</span></a>
    <div class="admin-topbar__actions private-header__actions">
      <button class="private-menu-toggle" style="order:3" type="button" data-private-menu-toggle aria-expanded="false" aria-controls="privateMenu" aria-label="Abrir menu"><span></span><span></span><span></span></button>
      <nav id="privateMenu" class="private-menu" data-private-menu aria-label="Menu do site" hidden>
        <div data-private-links></div>
        <div class="private-menu__account" data-private-account hidden>
          <p class="private-menu__email" data-private-email hidden></p>
          <button id="logoutButton" class="private-menu__logout" type="button" hidden>Sair</button>
        </div>
      </nav>
    </div>
  </header>
  <main>
    <p class="eyebrow">Casa em Módulos</p>
    <h1>Confirmar acesso ao configurador</h1>
    <p>O link recebido por email vale por 3 horas e pode ser usado uma única vez. Confirme abaixo para abrir o configurador.</p>
    <button id="confirmAccess" type="button" hidden>Confirmar e continuar</button>
    <p id="accessStatus" role="status" aria-live="polite">Verificando o link…</p>
    <a class="back" href="/">Voltar ao início</a>
  </main>
  <script type="module" src="/core/private-navigation.bundle.js?v=private-header-v1"></script>
  <script src="/access/access.js" defer></script>
</body>
</html>
