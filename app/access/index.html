<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f5f2">
  <title>Acesso ao configurador | Casa em Módulos</title>
  <link rel="stylesheet" href="/public-theme.css">
  <style>
    body { display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); padding: clamp(24px, 6vw, 44px); border: 1px solid var(--public-line); border-radius: 18px; background: var(--public-surface); box-shadow: var(--public-shadow); }
    .eyebrow { margin: 0 0 10px; color: var(--public-accent-dark); font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.08; letter-spacing: -.045em; }
    p { color: var(--public-muted); line-height: 1.6; }
    button { width: 100%; min-height: 50px; margin-top: 12px; border: 0; border-radius: 8px; background: var(--public-accent-dark); color: white; font-weight: 750; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    [role="status"] { min-height: 1.6em; }
    .back { display: inline-block; margin-top: 16px; color: var(--public-accent-dark); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Casa em Módulos</p>
    <h1>Confirmar acesso ao configurador</h1>
    <p>O link recebido por email vale por 3 horas e pode ser usado uma única vez. Confirme abaixo para abrir o configurador.</p>
    <button id="confirmAccess" type="button" hidden>Confirmar e continuar</button>
    <p id="accessStatus" role="status" aria-live="polite">Verificando o link…</p>
    <a class="back" href="/">Voltar ao início</a>
  </main>
  <script src="/access/access.js" defer></script>
</body>
</html>
